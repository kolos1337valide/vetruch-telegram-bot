<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="vetruch-economy.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Слоты 777 - Vetruch</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        :root {
            --bg: #000000;
            --text: #ffffff;
            --blue-main: #0088ff;
            --blue-cyan: #00d9ff;
            --blue-glow: rgba(0, 136, 255, 0.55);
            --gold: #ffd700;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            user-select: none;
            -webkit-user-select: none;
        }

        #stars { position: fixed; z-index: 0; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        .dark-overlay { position: fixed; z-index: 1; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.88) 100%); pointer-events: none; }

        .game-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 10px 14px 18px 14px;
            justify-content: space-between;
        }

        /* Верхняя панель */
        .top-section { display: flex; flex-direction: column; gap: 8px; width: 100%; z-index: 10; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .back-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            height: 38px;
            padding: 0 13px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .balance-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 136, 255, 0.15);
            padding: 7px 15px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 15px;
            border: 1px solid rgba(0, 136, 255, 0.35);
        }
        .coin-icon { width: 17px; height: 17px; flex-shrink: 0; vertical-align: middle; }

        .game-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 22, 28, 0.85);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 14px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .info-item { font-size: 12.5px; color: #8c97a7; display: flex; align-items: center; gap: 6px; }
        .info-val { font-size: 14.5px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 4px; }

        /* ================= КОМПАКТНЫЙ АВТОМАТ (В 1.5 РАЗА МЕНЬШЕ) ================= */
        .slot-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px 0;
        }

        .machine-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-right: 28px;
            width: 100%;
            max-width: 275px;
        }

        .slot-cabinet {
            width: 100%;
            background: linear-gradient(180deg, #1b2845 0%, #0d1526 55%, #070b14 100%);
            border: 2.5px solid #00d9ff;
            border-radius: 26px 26px 18px 18px;
            padding: 10px 10px 12px 10px;
            position: relative;
            box-shadow:
                0 14px 35px rgba(0, 0, 0, 0.9),
                0 0 24px rgba(0, 170, 255, 0.25),
                inset 0 1.5px 0 rgba(255, 255, 255, 0.25),
                inset 0 -6px 16px rgba(0, 0, 0, 0.8);
        }

        .slot-top-dome {
            background: radial-gradient(circle at 50% 0%, rgba(255, 215, 0, 0.28) 0%, rgba(15, 23, 42, 0.95) 80%);
            border: 1.5px solid rgba(255, 215, 0, 0.65);
            border-radius: 18px 18px 10px 10px;
            padding: 6px 8px 6px 8px;
            text-align: center;
            position: relative;
            margin-bottom: 8px;
            box-shadow: 0 0 14px rgba(255, 215, 0, 0.2), inset 0 0 10px rgba(255, 215, 0, 0.15);
        }

        .dome-lights {
            display: flex;
            justify-content: space-between;
            padding: 0 4px;
            margin-bottom: 3px;
        }

        .dome-bulb {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ffd700;
            box-shadow: 0 0 6px #ffd700;
            animation: bulbChase 1.2s infinite alternate;
        }
        .dome-bulb:nth-child(even) {
            background: #00d9ff;
            box-shadow: 0 0 6px #00d9ff;
            animation-delay: 0.6s;
        }

        @keyframes bulbChase {
            0% { opacity: 0.35; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1.15); }
        }

        .dome-title {
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1.5px;
            background: linear-gradient(180deg, #fff6b7 0%, #ffd700 55%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 8px rgba(255, 215, 0, 0.35);
            line-height: 1.1;
        }

        .dome-status {
            margin-top: 3px;
            font-size: 9.5px;
            font-weight: 800;
            color: #7dd3fc;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            min-height: 13px;
        }
        .dome-status.win { color: #00ff88; text-shadow: 0 0 8px rgba(0, 255, 136, 0.6); }
        .dome-status.jackpot { color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.8); }
        .dome-status.lose { color: #ff5277; }

        .reels-frame {
            position: relative;
            background: #050811;
            border: 2px solid #283a5e;
            border-radius: 14px;
            padding: 6px 5px;
            box-shadow:
                inset 0 8px 16px rgba(0, 0, 0, 0.95),
                inset 0 -8px 16px rgba(0, 0, 0, 0.95),
                0 0 12px rgba(0, 217, 255, 0.2);
            margin-bottom: 8px;
        }

        .payline-bar {
            position: absolute;
            left: 2px;
            right: 2px;
            top: 50%;
            transform: translateY(-50%);
            height: 2.5px;
            background: linear-gradient(90deg, #ff3366 0%, rgba(255, 215, 0, 0.85) 50%, #ff3366 100%);
            box-shadow: 0 0 8px rgba(255, 51, 102, 0.9);
            z-index: 5;
            pointer-events: none;
            opacity: 0.65;
        }

        .payline-tag {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 11px;
            height: 17px;
            background: #ff3366;
            color: #fff;
            font-size: 7.5px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            z-index: 6;
            box-shadow: 0 0 6px rgba(255, 51, 102, 0.8);
        }
        .payline-tag.left { left: -5px; }
        .payline-tag.right { right: -5px; }

        .reels-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            position: relative;
            z-index: 2;
        }

        /* Высота барабана уменьшена со 116px до 76px */
        .reel-window {
            height: 76px;
            background: linear-gradient(180deg, #10192b 0%, #1e2c47 50%, #0d1627 100%);
            border-radius: 9px;
            overflow: hidden;
            position: relative;
            border: 1.5px solid rgba(0, 217, 255, 0.45);
            box-shadow: inset 0 10px 12px -6px rgba(0,0,0,0.75), inset 0 -10px 12px -6px rgba(0,0,0,0.75);
        }

        .reel-window.win-glow {
            border-color: #ffd700;
            box-shadow: 0 0 14px rgba(255, 215, 0, 0.85), inset 0 0 10px rgba(255, 215, 0, 0.4);
        }
