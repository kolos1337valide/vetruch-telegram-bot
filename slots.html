<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="vetruch-economy.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Слоты 777 - Vetruch</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        :root {
            --bg: #000000;
            --text: #ffffff;
            --blue-main: #0088ff;
            --blue-cyan: #00d9ff;
            --blue-glow: rgba(0, 136, 255, 0.55);
            --gold: #ffd700;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            user-select: none;
            -webkit-user-select: none;
        }

        #stars { position: fixed; z-index: 0; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        .dark-overlay { position: fixed; z-index: 1; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.88) 100%); pointer-events: none; }

        .game-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 14px 14px 26px 14px;
            gap: 10px;
        }

        /* Верхняя панель */
        .top-section { display: flex; flex-direction: column; gap: 10px; width: 100%; z-index: 10; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .back-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            height: 40px;
            padding: 0 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .balance-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 136, 255, 0.15);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 16px;
            border: 1px solid rgba(0, 136, 255, 0.35);
        }
        .coin-icon { width: 18px; height: 18px; flex-shrink: 0; vertical-align: middle; }

        .game-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 22, 28, 0.85);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 16px;
            border-radius: 14px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .info-item { font-size: 13px; color: #8c97a7; display: flex; align-items: center; gap: 8px; }
        .info-val { font-size: 15px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 4px; }

        /* ================= СЦЕНА АВТОМАТА (ОДНОРУКИЙ БАНДИТ) ================= */
        .slot-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 0;
        }

        .machine-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-right: 34px; /* Место под боковую ручку */
            width: 100%;
            max-width: 370px;
        }

        /* Корпус слот-машины */
        .slot-cabinet {
            width: 100%;
            background: linear-gradient(180deg, #1b2845 0%, #0d1526 55%, #070b14 100%);
            border: 3px solid #00d9ff;
            border-radius: 36px 36px 24px 24px;
            padding: 14px 14px 16px 14px;
            position: relative;
            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.9),
                0 0 30px rgba(0, 170, 255, 0.25),
                inset 0 2px 0 rgba(255, 255, 255, 0.25),
                inset 0 -8px 20px rgba(0, 0, 0, 0.8);
        }

        /* Верхний купол с лампочками */
        .slot-top-dome {
            background: radial-gradient(circle at 50% 0%, rgba(255, 215, 0, 0.28) 0%, rgba(15, 23, 42, 0.95) 80%);
            border: 2px solid rgba(255, 215, 0, 0.65);
            border-radius: 24px 24px 14px 14px;
            padding: 10px 12px 8px 12px;
            text-align: center;
            position: relative;
            margin-bottom: 12px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2), inset 0 0 15px rgba(255, 215, 0, 0.15);
        }

        .dome-lights {
            display: flex;
            justify-content: space-between;
            padding: 0 6px;
            margin-bottom: 6px;
        }

        .dome-bulb {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffd700;
            box-shadow: 0 0 8px #ffd700;
            animation: bulbChase 1.2s infinite alternate;
        }
        .dome-bulb:nth-child(even) {
            background: #00d9ff;
            box-shadow: 0 0 8px #00d9ff;
            animation-delay: 0.6s;
        }

        @keyframes bulbChase {
            0% { opacity: 0.35; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1.15); }
        }

        .dome-title {
            font-size: 19px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #fff6b7 0%, #ffd700 55%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.35);
            line-height: 1.1;
        }

        .dome-status {
            margin-top: 4px;
            font-size: 11px;
            font-weight: 800;
            color: #7dd3fc;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            min-height: 15px;
        }
        .dome-status.win { color: #00ff88; text-shadow: 0 0 10px rgba(0, 255, 136, 0.6); }
        .dome-status.jackpot { color: #ffd700; text-shadow: 0 0 12px rgba(255, 215, 0, 0.8); }
        .dome-status.lose { color: #ff5277; }

        /* Окно барабанов */
        .reels-frame {
            position: relative;
            background: #050811;
            border: 3px solid #283a5e;
            border-radius: 18px;
            padding: 10px 8px;
            box-shadow:
                inset 0 10px 22px rgba(0, 0, 0, 0.95),
                inset 0 -10px 22px rgba(0, 0, 0, 0.95),
                0 0 15px rgba(0, 217, 255, 0.2);
            margin-bottom: 12px;
        }

        /* Линия выплаты посередине */
        .payline-bar {
            position: absolute;
            left: 2px;
            right: 2px;
            top: 50%;
            transform: translateY(-50%);
            height: 3px;
            background: linear-gradient(90deg, #ff3366 0%, rgba(255, 215, 0, 0.85) 50%, #ff3366 100%);
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.9);
            z-index: 5;
            pointer-events: none;
            opacity: 0.65;
        }

        .payline-tag {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 22px;
            background: #ff3366;
            color: #fff;
            font-size: 9px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            z-index: 6;
            box-shadow: 0 0 8px rgba(255, 51, 102, 0.8);
        }
        .payline-tag.left { left: -6px; }
        .payline-tag.right { right: -6px; }

        .reels-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            position: relative;
            z-index: 2;
        }

        .reel-window {
            height: 116px;
            background: linear-gradient(180deg, #dce6f2 0%, #ffffff 50%, #cfdceb 100%);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            border: 1.5px solid rgba(0, 217, 255, 0.45);
            box-shadow: inset 0 14px 16px -8px rgba(0,0,0,0.55), inset 0 -14px 16px -8px rgba(0,0,0,0.55);
        }

        .reel-window.win-glow {
            border-color: #ffd700;
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.85), inset 0 0 12px rgba(255, 215, 0, 0.4);
        }

        .reel-strip {
            display: flex;
            flex-direction: column;
            will-change: transform;
        }

        .reel-cell {
            height: 116px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            line-height: 1;
            flex-shrink: 0;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));
        }

        .reel-strip.spinning .reel-cell {
            filter: blur(1.5px);
        }

        /* Таблица множителей на корпусе */
        .paytable-box {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            background: rgba(5, 10, 20, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 7px 6px;
        }

        .pay-pill {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 4px 6px;
            font-size: 10px;
            font-weight: 800;
        }

        .pay-pill span.mult {
            color: #ffd700;
        }

        /* Нижний лоток автомата */
        .cabinet-tray {
            margin-top: 10px;
            height: 28px;
            background: linear-gradient(180deg, #060911 0%, #141f33 100%);
            border: 1.5px solid rgba(0, 217, 255, 0.35);
            border-radius: 8px 8px 14px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 900;
            color: #94a3b8;
            letter-spacing: 1px;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.8);
        }

        /* ================= БОКОВАЯ РУЧКА (РЫЧАГ ОДНОРУКОГО БАНДИТА) ================= */
        .slot-lever {
            position: absolute;
            right: 0;
            top: 42%;
            transform: translateY(-50%);
            width: 36px;
            height: 150px;
            cursor: pointer;
            z-index: 8;
        }

        /* Крепление к корпусу */
        .lever-mount {
            position: absolute;
            left: 0;
            top: 62px;
            width: 14px;
            height: 36px;
            background: linear-gradient(90deg, #1e293b, #475569, #1e293b);
            border: 2px solid #00d9ff;
            border-left: none;
            border-radius: 0 10px 10px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
        }

        /* Поворотный стержень с шаром */
        .lever-arm-group {
            position: absolute;
            left: 10px;
            top: 10px;
            width: 24px;
            height: 75px;
            transform-origin: bottom center;
            transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .lever-shaft {
            position: absolute;
            bottom: 0;
            left: 9px;
            width: 6px;
            height: 58px;
            background: linear-gradient(90deg, #94a3b8, #f8fafc, #64748b);
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }

        .lever-ball {
            position: absolute;
            top: 0;
            left: 0;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 30%, #ff8fa3, #ff3366 55%, #990026 100%);
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.85), inset -3px -3px 6px rgba(0,0,0,0.4);
            transition: transform 0.28s ease;
        }

        /* Анимация нажатия рычага вниз */
        .slot-lever.pulled .lever-arm-group {
            animation: pullLeverAnim 0.55s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        @keyframes pullLeverAnim {
            0%   { transform: rotateX(0deg) scaleY(1); }
            45%  { transform: translateY(58px) scaleY(0.25); }
            75%  { transform: translateY(-4px) scaleY(1.06); }
            100% { transform: rotateX(0deg) scaleY(1); }
        }

        /* ================= ПАНЕЛЬ УПРАВЛЕНИЯ ================= */
        .controls {
            background: rgba(20, 22, 28, 0.88);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 16px;
            margin-top: auto;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .bet-options { display: flex; gap: 8px; margin-bottom: 12px; }
        .bet-btn {
            background: #1a1d24;
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 11px 12px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
            font-size: 15px;
        }
        .bet-btn.active {
            background: rgba(0, 217, 255, 0.2);
            border-color: var(--blue-cyan);
            color: var(--blue-cyan);
        }
        .bet-btn:disabled { opacity: 0.45; pointer-events: none; }

        .action-btn {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            border: none;
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(90deg, #0088ff, #00d9ff);
            cursor: pointer;
            box-shadow: 0 0 18px var(--blue-glow);
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
        }
        .action-btn:active { transform: scale(0.97); }
        .action-btn.win { background: linear-gradient(90deg, #00c853, #00e676); color: #052210; box-shadow: 0 0 20px rgba(0, 230, 118, 0.5); }
        .action-btn.bust { background: linear-gradient(90deg, #ff3366, #ff5277); box-shadow: 0 0 18px rgba(255, 51, 102, 0.4); }
        .action-btn:disabled { background: #2a2d35; color: #777; box-shadow: none; pointer-events: none; }
    </style>
</head>
<body>

    <canvas id="stars"></canvas>
    <div class="dark-overlay"></div>

    <div class="game-container">
        <div class="top-section">
            <div class="header">
                <button class="back-btn" onclick="goBack()">❮ Назад</button>
                <div class="balance-pill">
                    <span id="balanceDisplay">500</span> <img src="coins.png" alt="coins" class="coin-icon">
                </div>
            </div>

            <div class="game-info-bar">
                <div class="info-item">Ставка:
                    <span class="info-val"><span id="infoBet">20</span> <img src="coins.png" class="coin-icon"></span>
                </div>
                <div class="info-item">Остаток:
                    <span class="info-val"><span id="infoBalance">500</span> <img src="coins.png" class="coin-icon"></span>
                </div>
            </div>
        </div>

        <!-- ФИГУРА СЛОТ-МАШИНЫ С РУЧКОЙ -->
        <div class="slot-stage">
            <div class="machine-wrapper">
                <div class="slot-cabinet">
                    <!-- Верхний купол -->
                    <div class="slot-top-dome">
                        <div class="dome-lights">
                            <span class="dome-bulb"></span>
                            <span class="dome-bulb"></span>
                            <span class="dome-bulb"></span>
                            <span class="dome-bulb"></span>
                            <span class="dome-bulb"></span>
                            <span class="dome-bulb"></span>
                            <span class="dome-bulb"></span>
                        </div>
                        <div class="dome-title">VETRUCH 777</div>
                        <div class="dome-status" id="domeStatus">ДЁРНИ РУЧКУ ИЛИ НАЖМИ КРУТИТЬ</div>
                    </div>

                    <!-- Три барабана -->
                    <div class="reels-frame">
                        <div class="payline-tag left">►</div>
                        <div class="payline-bar"></div>
                        <div class="payline-tag right">◄</div>

                        <div class="reels-grid">
                            <div class="reel-window" id="reelWin0">
                                <div class="reel-strip" id="reelStrip0">
                                    <div class="reel-cell">7️⃣</div>
                                </div>
                            </div>
                            <div class="reel-window" id="reelWin1">
                                <div class="reel-strip" id="reelStrip1">
                                    <div class="reel-cell">7️⃣</div>
                                </div>
                            </div>
                            <div class="reel-window" id="reelWin2">
                                <div class="reel-strip" id="reelStrip2">
                                    <div class="reel-cell">7️⃣</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Таблица выплат -->
                    <div class="paytable-box">
                        <div class="pay-pill"><span>7️⃣7️⃣7️⃣</span><span class="mult">x15</span></div>
                        <div class="pay-pill"><span>💎💎💎</span><span class="mult">x8</span></div>
                        <div class="pay-pill"><span>🍒🍒🍒</span><span class="mult">x5</span></div>
                        <div class="pay-pill"><span>🍋🍋🍋</span><span class="mult">x3</span></div>
                        <div class="pay-pill"><span>🍊🍊🍊</span><span class="mult">x3</span></div>
                        <div class="pay-pill"><span>ПАРА</span><span class="mult">x1.5</span></div>
                    </div>

                    <!-- Лоток выдачи монет -->
                    <div class="cabinet-tray" id="cabinetTray">JACKPOT PAYOUT • RTP 50%</div>
                </div>

                <!-- Боковая ручка (рычаг) -->
                <div class="slot-lever" id="slotLever" onclick="spinSlots()" title="Дёрнуть ручку">
                    <div class="lever-mount"></div>
                    <div class="lever-arm-group">
                        <div class="lever-shaft"></div>
                        <div class="lever-ball"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Управление ставкой -->
        <div class="controls">
            <div class="bet-options">
                <button class="bet-btn active" onclick="setBet(20, this)">20</button>
                <button class="bet-btn" onclick="setBet(50, this)">50</button>
                <button class="bet-btn" onclick="setBet(100, this)">100</button>
                <button class="bet-btn" onclick="setBet(200, this)">200</button>
            </div>

            <button class="action-btn" id="spinBtn" onclick="spinSlots()">🎰 КРУТИТЬ БАРАБАНЫ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand(); tg.setHeaderColor('#000000'); tg.setBackgroundColor('#000000');

        let rawBal = localStorage.getItem('vetruch_balance');
        let balance = rawBal !== null ? parseInt(rawBal, 10) : 500;
        if (isNaN(balance)) balance = 500;

        let bet = 20;
        let isSpinning = false;

        const SYMBOLS = ['7️⃣', '💎', '🍒', '🍋', '🍊', '🍇'];
        const FRUITS = ['🍋', '🍊', '🍇'];
        const CELL_HEIGHT = 116;

        const balanceDisplay = document.getElementById('balanceDisplay');
        const infoBalance = document.getElementById('infoBalance');
        const infoBet = document.getElementById('infoBet');
        const betBtns = document.querySelectorAll('.bet-btn');
        const spinBtn = document.getElementById('spinBtn');
        const slotLever = document.getElementById('slotLever');
        const domeStatus = document.getElementById('domeStatus');
        const cabinetTray = document.getElementById('cabinetTray');

        updateBalanceUI();

        function goBack() {
            if (window.parent && window.parent !== window && typeof window.parent.closeGameModal === 'function') {
                window.parent.closeGameModal();
            } else if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }

        function updateBalanceUI() {
            balanceDisplay.textContent = balance;
            infoBalance.textContent = balance;
            localStorage.setItem('vetruch_balance', balance);
        }

        function setBet(amount, btn) {
            if (isSpinning) return;
            bet = amount;
            infoBet.textContent = bet;
            betBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // Генерация исхода спина с математикой под ~50% RTP
        function rollSlotOutcome() {
            const r = Math.random();

            // 0.35% — Джекпот 777 (x15)
            if (r < 0.0035) {
                return { reels: ['7️⃣', '7️⃣', '7️⃣'], mult: 15, title: '🔥 ДЖЕКПОТ 777! 🔥' };
            }
            // 0.9% — Три алмаза (x8)
            if (r < 0.0125) {
                return { reels: ['💎', '💎', '💎'], mult: 8, title: '💎 БРИЛЛИАНТОВЫЙ КУШ! 💎' };
            }
            // 2.0% — Три вишни (x5)
            if (r < 0.0325) {
                return { reels: ['🍒', '🍒', '🍒'], mult: 5, title: '🍒 СПЕЛЫЕ ВИШНИ x5!' };
            }
            // 4.5% — Три фрукта: лимон / апельсин / виноград (x3)
            if (r < 0.0775) {
                const f = FRUITS[Math.floor(Math.random() * FRUITS.length)];
                return { reels: [f, f, f], mult: 3, title: `${f}${f}${f} ФРУКТОВЫЙ СЕТ x3!` };
            }
            // 9.5% — Пара одинаковых символов (x1.5)
            if (r < 0.1725) {
                const pairSym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
                const others = SYMBOLS.filter(s => s !== pairSym);
                const oddSym = others[Math.floor(Math.random() * others.length)];
                // Ставим пару либо на [0,1], либо на [1,2], либо на [0,2]
                const pos = Math.floor(Math.random() * 3);
                let reels;
                if (pos === 0) reels = [pairSym, pairSym, oddSym];
                else if (pos === 1) reels = [oddSym, pairSym, pairSym];
                else reels = [pairSym, oddSym, pairSym];
                return { reels, mult: 1.5, title: `✨ ПАРА ${pairSym}${pairSym} (x1.5)` };
            }

            // Остальные ~82.75% — проигрыш (3 разных символа без совпадений)
            const pool = SYMBOLS.slice();
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            return { reels: [pool[0], pool[1], pool[2]], mult: 0, title: 'Попробуй ещё раз!' };
        }

        function animateReel(reelIndex, finalSymbol, totalSteps, durationMs) {
            return new Promise(resolve => {
                const strip = document.getElementById('reelStrip' + reelIndex);
                const currentSym = strip.querySelector('.reel-cell')?.textContent || '7️⃣';

                const items = [currentSym];
                for (let i = 1; i < totalSteps - 1; i++) {
                    items.push(SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
                }
                items.push(finalSymbol);

                strip.style.transition = 'none';
                strip.style.transform = 'translateY(0px)';
                strip.innerHTML = items.map(s => `<div class="reel-cell">${s}</div>`).join('');
                strip.classList.add('spinning');

                // Форсируем reflow перед стартом CSS-анимации
                void strip.offsetHeight;

                const offset = -(totalSteps - 1) * CELL_HEIGHT;
                strip.style.transition = `transform ${durationMs}ms cubic-bezier(0.16, 1.12, 0.34, 1)`;
                strip.style.transform = `translateY(${offset}px)`;

                setTimeout(() => {
                    strip.classList.remove('spinning');
                    strip.style.transition = 'none';
                    strip.style.transform = 'translateY(0px)';
                    strip.innerHTML = `<div class="reel-cell">${finalSymbol}</div>`;
                    resolve();
                }, durationMs);
            });
        }

        async function spinSlots() {
            if (isSpinning) return;
            if (balance < bet) {
                tg.showAlert("Недостаточно монет!");
                return;
            }

            if (window.VETRUCH_ECONOMY) {
                var check = VETRUCH_ECONOMY.checkAndUseAttempt('slots');
                if (!check.ok) {
                    VETRUCH_ECONOMY.showNoAttemptsOverlay('slots');
                    return;
                }
                VETRUCH_ECONOMY.updateBadgeUI('slots');
            }

            isSpinning = true;

            // Анимация опускания боковой ручки
            slotLever.classList.remove('pulled');
            void slotLever.offsetWidth;
            slotLever.classList.add('pulled');

            if (tg.HapticFeedback) {
                try { tg.HapticFeedback.impactOccurred('medium'); } catch (e) {}
            }

            balance -= bet;
            const expEarned = Math.floor(bet / 50);
            if (expEarned > 0) {
                let curXp = parseInt(localStorage.getItem('vetruch_user_xp') || '0', 10);
                localStorage.setItem('vetruch_user_xp', curXp + expEarned);
            }
            updateBalanceUI();

            for (let i = 0; i < 3; i++) {
                document.getElementById('reelWin' + i).classList.remove('win-glow');
            }

            betBtns.forEach(b => b.disabled = true);
            spinBtn.disabled = true;
            spinBtn.className = 'action-btn';
            spinBtn.textContent = 'КРУТИМ...';

            domeStatus.className = 'dome-status';
            domeStatus.textContent = 'УДАЧИ! БАРАБАНЫ КРУТЯТСЯ...';
            cabinetTray.textContent = 'КРУТИМ БАРАБАНЫ...';

            const outcome = rollSlotOutcome();

            // Запускаем 3 барабана с поочерёдной остановкой
            await Promise.all([
                animateReel(0, outcome.reels[0], 14, 950),
                animateReel(1, outcome.reels[1], 19, 1350),
                animateReel(2, outcome.reels[2], 24, 1750)
            ]);

            if (outcome.mult > 0) {
                const winAmount = Math.floor(bet * outcome.mult);
                balance += winAmount;
                updateBalanceUI();

                for (let i = 0; i < 3; i++) {
                    document.getElementById('reelWin' + i).classList.add('win-glow');
                }

                domeStatus.className = outcome.mult >= 8 ? 'dome-status jackpot' : 'dome-status win';
                domeStatus.textContent = outcome.title;
                cabinetTray.textContent = `ВЫПЛАТА: +${winAmount} МОНЕТ!`;

                spinBtn.className = 'action-btn win';
                spinBtn.innerHTML = `ВЫИГРЫШ +${winAmount} <img src="coins.png" class="coin-icon"> · КРУТИТЬ ЕЩЁ`;

                if (tg.HapticFeedback) {
                    try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
                }
            } else {
                domeStatus.className = 'dome-status lose';
                domeStatus.textContent = 'НЕТ КОМБИНАЦИИ · ПОПРОБУЙ ЕЩЁ!';
                cabinetTray.textContent = 'JACKPOT PAYOUT • RTP 50%';

                spinBtn.className = 'action-btn bust';
                spinBtn.textContent = 'МИМО · КРУТИТЬ СНОВА';
            }

            spinBtn.disabled = false;
            betBtns.forEach(b => b.disabled = false);
            isSpinning = false;
        }

        // ================= Анимация звезд =================
        const canvas = document.getElementById("stars");
        const ctx = canvas.getContext("2d");
        let stars = []; let w = 0; let h = 0;

        function resizeCanvas() {
            w = window.innerWidth; h = window.innerHeight;
            canvas.width = w; canvas.height = h;
            createStars();
        }
        function createStars() {
            stars = [];
            for (let i = 0; i < 70; i++) stars.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.2 + 0.2, s: Math.random() * 0.1 + 0.02, o: Math.random() * 0.5 + 0.2 });
        }
        function drawStars() {
            ctx.clearRect(0, 0, w, h);
            for (const star of stars) {
                ctx.beginPath(); ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(100, 180, 255, ${star.o})`; ctx.fill();
                star.y += star.s;
                if (star.y > h) { star.y = 0; star.x = Math.random() * w; }
            }
            requestAnimationFrame(drawStars);
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas(); drawStars();
    </script>
</body>
