<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="vetruch-economy.js?v=6"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Слоты 777 - Vetruch</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        :root {
            --bg: #02050b;
            --text: #ffffff;
            --blue-main: #0088ff;
            --blue-cyan: #00d9ff;
            --blue-glow: rgba(0, 136, 255, 0.55);
            --gold: #00d9ff;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at 50% 22%, #0d2444 0%, #050d1a 58%, #02050b 100%);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            user-select: none;
            -webkit-user-select: none;
        }

        #stars { position: fixed; z-index: 0; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        .dark-overlay { position: fixed; z-index: 1; inset: 0; background: linear-gradient(180deg, rgba(5,13,26,0.12) 0%, rgba(2,5,11,0.82) 100%); pointer-events: none; }

        .game-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 10px 14px 18px 14px;
            justify-content: space-between;
        }

        /* Верхняя панель */
        .top-section { display: flex; flex-direction: column; gap: 8px; width: 100%; z-index: 10; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .back-btn {
            background: rgba(11, 24, 46, 0.88);
            border: 1px solid rgba(0, 217, 255, 0.3);
            color: #fff;
            height: 38px;
            padding: 0 13px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }
        .balance-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, rgba(0, 136, 255, 0.2), rgba(0, 217, 255, 0.1));
            padding: 7px 15px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 15px;
            color: #e0f7ff;
            border: 1px solid rgba(0, 217, 255, 0.42);
            box-shadow: 0 0 16px rgba(0, 136, 255, 0.24);
        }
        .coin-icon { width: 17px; height: 17px; flex-shrink: 0; vertical-align: middle; }

        .game-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(9, 20, 38, 0.88);
            border: 1px solid rgba(0, 217, 255, 0.24);
            padding: 8px 14px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.45);
        }
        .info-item { font-size: 12.5px; color: #94b8db; display: flex; align-items: center; gap: 6px; }
        .info-val { font-size: 14.5px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 4px; }

        /* ================= КОМПАКТНЫЙ САПФИРОВЫЙ АВТОМАТ ================= */
        .slot-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px 0;
        }

        .machine-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-right: 28px;
            width: 100%;
            max-width: 275px;
        }

        .slot-cabinet {
            width: 100%;
            background: linear-gradient(180deg, #162a4a 0%, #0b1629 55%, #050a14 100%);
            border: 2.5px solid #00d9ff;
            border-radius: 26px 26px 18px 18px;
            padding: 10px 10px 12px 10px;
            position: relative;
            box-shadow:
                0 16px 38px rgba(0, 0, 0, 0.92),
                0 0 28px rgba(0, 170, 255, 0.28),
                inset 0 1.5px 0 rgba(180, 235, 255, 0.3),
                inset 0 -6px 16px rgba(0, 0, 0, 0.85);
        }
        .slot-cabinet::before,
        .slot-cabinet::after {
            content: "";
            position: absolute;
            top: 42px;
            bottom: 34px;
            width: 3px;
            border-radius: 3px;
            background: linear-gradient(180deg, transparent, #00e5ff, #0284c7, #00e5ff, transparent);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.7);
            pointer-events: none;
            opacity: 0.75;
        }
        .slot-cabinet::before { left: 4px; }
        .slot-cabinet::after { right: 4px; }

        .slot-top-dome {
            background: radial-gradient(circle at 50% 0%, rgba(255, 215, 0, 0.28) 0%, rgba(15, 23, 42, 0.95) 80%);
            border: 1.5px solid rgba(255, 215, 0, 0.65);
            border-radius: 18px 18px 10px 10px;
            padding: 6px 8px 6px 8px;
            text-align: center;
            position: relative;
            margin-bottom: 8px;
            box-shadow: 0 0 14px rgba(255, 215, 0, 0.2), inset 0 0 10px rgba(255, 215, 0, 0.15);
        }

        .dome-lights {
            display: flex;
            justify-content: space-between;
            padding: 0 4px;
            margin-bottom: 3px;
        }

        .dome-bulb {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ffd700;
            box-shadow: 0 0 6px #ffd700;
            animation: bulbChase 1.2s infinite alternate;
        }
        .dome-bulb:nth-child(even) {
            background: #00d9ff;
            box-shadow: 0 0 6px #00d9ff;
            animation-delay: 0.6s;
        }

        @keyframes bulbChase {
            0% { opacity: 0.35; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1.15); }
        }

        .dome-title {
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1.5px;
            background: linear-gradient(180deg, #fff6b7 0%, #ffd700 55%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 8px rgba(255, 215, 0, 0.35);
            line-height: 1.1;
        }

        .dome-status {
            margin-top: 3px;
            font-size: 9.5px;
            font-weight: 800;
            color: #7dd3fc;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            min-height: 13px;
        }
        .dome-status.win { color: #00ff88; text-shadow: 0 0 8px rgba(0, 255, 136, 0.6); }
        .dome-status.jackpot { color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.8); }
        .dome-status.lose { color: #ff5277; }

        .reels-frame {
            position: relative;
            background: #050a14;
            border: 2px solid rgba(0, 217, 255, 0.45);
            border-radius: 14px;
            padding: 6px 5px;
            box-shadow:
                inset 0 8px 16px rgba(0, 0, 0, 0.95),
                inset 0 -8px 16px rgba(0, 0, 0, 0.95),
                0 0 16px rgba(0, 170, 255, 0.25);
            margin-bottom: 8px;
        }

        .payline-bar {
            position: absolute;
            left: 2px;
            right: 2px;
            top: 50%;
            transform: translateY(-50%);
            height: 2.5px;
            background: linear-gradient(90deg, #ff3366 0%, rgba(255, 215, 0, 0.85) 50%, #ff3366 100%);
            box-shadow: 0 0 8px rgba(255, 51, 102, 0.9);
            z-index: 5;
            pointer-events: none;
            opacity: 0.65;
        }

        .payline-tag {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 11px;
            height: 17px;
            background: #ff3366;
            color: #fff;
            font-size: 7.5px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            z-index: 6;
            box-shadow: 0 0 6px rgba(255, 51, 102, 0.8);
        }
        .payline-tag.left { left: -5px; }
        .payline-tag.right { right: -5px; }

        .reels-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            position: relative;
            z-index: 2;
        }

        /* Высота барабана уменьшена со 116px до 76px */
        .reel-window {
            height: 76px;
            background: linear-gradient(180deg, #0b1629 0%, #172b4f 50%, #091324 100%);
            border-radius: 9px;
            overflow: hidden;
            position: relative;
            border: 1.5px solid rgba(0, 217, 255, 0.45);
            box-shadow: inset 0 10px 12px -6px rgba(0,0,0,0.75), inset 0 -10px 12px -6px rgba(0,0,0,0.75);
        }

        .reel-window.win-glow {
            border-color: #ffd700;
            box-shadow: 0 0 14px rgba(255, 215, 0, 0.85), inset 0 0 10px rgba(255, 215, 0, 0.4);
        }

        .reel-strip {
            display: flex;
            flex-direction: column;
            will-change: transform;
        }

        .reel-cell {
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding: 4px;
        }

        .reel-strip.spinning .slot-icon-svg {
            filter: blur(1.2px) brightness(1.12);
            transform: scale(0.97);
        }

        /* Размер значков уменьшен с 76px до 52px */
        .slot-icon-svg {
            width: 52px;
            height: 52px;
            display: block;
            transition: transform 0.09s ease-out, filter 0.09s ease-out;
        }

        .reel-window.win-glow .slot-icon-svg {
            animation: symbolWinPulse 0.9s ease-in-out infinite alternate;
        }

        @keyframes symbolWinPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.6)); }
            100% { transform: scale(1.1); filter: drop-shadow(0 0 14px rgba(255, 215, 0, 1)); }
        }

        /* Компактная таблица выплат */
        .paytable-box {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            background: rgba(5, 10, 20, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 9px;
            padding: 5px 4px;
        }

        .pay-pill {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 2.5px 4px;
            font-size: 8.5px;
            font-weight: 800;
        }

        .pay-pill-icons {
            display: flex;
            align-items: center;
            gap: 1.5px;
        }

        .mini-ico {
            width: 11px;
            height: 11px;
            display: inline-block;
        }

        .pay-pill span.mult {
            color: #ffd700;
        }

        .cabinet-tray {
            margin-top: 6px;
            height: 24px;
            padding: 0 10px;
            background: linear-gradient(180deg, #060e1c 0%, #132542 100%);
            border: 1px solid rgba(0, 217, 255, 0.42);
            border-radius: 6px 6px 10px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: clamp(7.5px, 2.35vw, 9.5px);
            font-weight: 900;
            line-height: 1;
            color: #e0f7ff;
            letter-spacing: 0.35px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.8);
        }

        /* Пропорциональный рычаг */
        .slot-lever {
            position: absolute;
            right: 0;
            top: 45%;
            transform: translateY(-50%);
            width: 28px;
            height: 115px;
            cursor: pointer;
            z-index: 8;
        }

        .lever-mount {
            position: absolute;
            left: 0;
            top: 48px;
            width: 10px;
            height: 28px;
            background: linear-gradient(90deg, #162947, #2b4c7e, #162947);
            border: 1.5px solid #00d9ff;
            border-left: none;
            border-radius: 0 8px 8px 0;
            box-shadow: 0 3px 8px rgba(0,0,0,0.7);
        }

        .lever-arm-group {
            position: absolute;
            left: 7px;
            top: 8px;
            width: 19px;
            height: 58px;
            transform-origin: bottom center;
            transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .lever-shaft {
            position: absolute;
            bottom: 0;
            left: 7px;
            width: 5px;
            height: 44px;
            background: linear-gradient(90deg, #94a3b8, #f8fafc, #64748b);
            border-radius: 3px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.6);
        }

        .lever-ball {
            position: absolute;
            top: 0;
            left: 0;
            width: 19px;
            height: 19px;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 30%, #ff8fa3, #ff3366 55%, #990026 100%);
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 12px rgba(255, 51, 102, 0.85), inset -2px -2px 4px rgba(0,0,0,0.4);
        }

        .slot-lever.pulled .lever-arm-group {
            animation: pullLeverAnim 0.55s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        @keyframes pullLeverAnim {
            0%   { transform: rotateX(0deg) scaleY(1); }
            45%  { transform: translateY(44px) scaleY(0.25); }
            75%  { transform: translateY(-3px) scaleY(1.06); }
            100% { transform: rotateX(0deg) scaleY(1); }
        }

        /* Панель управления */
        .controls {
            background: rgba(9, 20, 38, 0.9);
            border: 1px solid rgba(0, 217, 255, 0.28);
            border-radius: 18px;
            padding: 12px;
            z-index: 10;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.65);
        }

        .bet-options { display: flex; gap: 7px; margin-bottom: 10px; }
        .bet-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(0,195,255,0.2);
            color: #fff;
            padding: 10px 10px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
            font-size: 14px;
        }
        .bet-btn.active {
            background: rgba(0, 170, 255, 0.22);
            border-color: #00d9ff;
            color: #7dd3fc;
            box-shadow: 0 0 12px rgba(0, 170, 255, 0.28);
        }
        .bet-btn:disabled { opacity: 0.45; pointer-events: none; }

        .action-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(135deg, #0095ff 0%, #005fd2 100%);
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(0, 136, 255, 0.48), inset 0 1px 0 rgba(255,255,255,0.3);
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
        }
        .action-btn:active { transform: scale(0.97); }
        .action-btn.win { background: linear-gradient(90deg, #00c853, #00e676); color: #052210; box-shadow: 0 0 18px rgba(0, 230, 118, 0.5); }
        .action-btn.bust { background: linear-gradient(90deg, #ff3366, #ff5277); box-shadow: 0 0 16px rgba(255, 51, 102, 0.4); }
        .action-btn:disabled { background: #192538; color: #5b6e8a; box-shadow: none; pointer-events: none; }
    </style>
</head>
<body>

    <canvas id="stars"></canvas>
    <div class="dark-overlay"></div>

    <div class="game-container">
        <div class="top-section">
            <div class="header">
                <button class="back-btn" onclick="goBack()">❮ Назад</button>
                <div class="balance-pill">
                    <span id="balanceDisplay">500</span> <img src="coins.png" alt="coins" class="coin-icon">
                </div>
            </div>

            <div class="game-info-bar">
                <div class="info-item">Ставка:
                    <span class="info-val"><span id="infoBet">20</span> <img src="coins.png" class="coin-icon"></span>
                </div>
                <div class="info-item">Остаток:
                    <span class="info-val"><span id="infoBalance">500</span> <img src="coins.png" class="coin-icon"></span>
                </div>
            </div>
        </div>

        <!-- КОРПУС АВТОМАТА (КОМПАКТНЫЙ) -->
        <div class="slot-stage">
            <div class="machine-wrapper">
                <div class="slot-cabinet">
                    <div class="slot-top-dome">
                        <div class="dome-lights">
                            <span class="dome-bulb"></span>
                            <span class="dome-bulb"></span>
                            <span class="dome-bulb"></span>
                            <span class="dome-bulb"></span>
                            <span class="dome-bulb"></span>
                            <span class="dome-bulb"></span>
                            <span class="dome-bulb"></span>
                        </div>
                        <div class="dome-title">VETRUCH 777</div>
                        <div class="dome-status" id="domeStatus">ДЁРНИ РУЧКУ ИЛИ НАЖМИ КРУТИТЬ</div>
                    </div>

                    <div class="reels-frame">
                        <div class="payline-tag left">►</div>
                        <div class="payline-bar"></div>
                        <div class="payline-tag right">◄</div>

                        <div class="reels-grid">
                            <div class="reel-window" id="reelWin0">
                                <div class="reel-strip" id="reelStrip0"></div>
                            </div>
                            <div class="reel-window" id="reelWin1">
                                <div class="reel-strip" id="reelStrip1"></div>
                            </div>
                            <div class="reel-window" id="reelWin2">
                                <div class="reel-strip" id="reelStrip2"></div>
                            </div>
                        </div>
                    </div>

                    <div class="paytable-box">
                        <div class="pay-pill"><span class="pay-pill-icons" id="ptSeven"></span><span class="mult">x15</span></div>
                        <div class="pay-pill"><span class="pay-pill-icons" id="ptDiamond"></span><span class="mult">x8</span></div>
                        <div class="pay-pill"><span class="pay-pill-icons" id="ptCherry"></span><span class="mult">x5</span></div>
                        <div class="pay-pill"><span class="pay-pill-icons" id="ptLemon"></span><span class="mult">x3</span></div>
                        <div class="pay-pill"><span class="pay-pill-icons" id="ptOrange"></span><span class="mult">x3</span></div>
                        <div class="pay-pill"><span>ПАРА</span><span class="mult">x1.5</span></div>
                    </div>

                    <div class="cabinet-tray" id="cabinetTray">VETRUCH VIP CLUB • SUPER 777 JACKPOT</div>
                </div>

                <div class="slot-lever" id="slotLever" onclick="spinSlots()" title="Дёрнуть ручку">
                    <div class="lever-mount"></div>
                    <div class="lever-arm-group">
                        <div class="lever-shaft"></div>
                        <div class="lever-ball"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="bet-options">
                <button class="bet-btn active" onclick="setBet(20, this)">20</button>
                <button class="bet-btn" onclick="setBet(50, this)">50</button>
                <button class="bet-btn" onclick="setBet(100, this)">100</button>
                <button class="bet-btn" onclick="setBet(200, this)">200</button>
            </div>

            <button class="action-btn" id="spinBtn" onclick="spinSlots()">🎰 КРУТИТЬ БАРАБАНЫ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand(); tg.setHeaderColor('#050d1a'); tg.setBackgroundColor('#02050b');

        let rawBal = localStorage.getItem('vetruch_balance');
        let balance = rawBal !== null ? parseInt(rawBal, 10) : 500;
        if (isNaN(balance)) balance = 500;

        let bet = 20;
        let isSpinning = false;
        const CELL_HEIGHT = 76; // Ровно под новую высоту ячейки

        const SVGS = {
            seven: `
                <svg class="slot-icon-svg" viewBox="0 0 100 100" fill="none">
                    <defs>
                        <linearGradient id="g7Gold" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#fff8db"/>
                            <stop offset="25%" stop-color="#ffd700"/>
                            <stop offset="65%" stop-color="#f59e0b"/>
                            <stop offset="100%" stop-color="#b45309"/>
                        </linearGradient>
                        <filter id="f7Glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ffd700" flood-opacity="0.9"/>
                        </filter>
                    </defs>
                    <path d="M18 16 H82 V34 L48 86 H26 L56 34 H20 L18 16 Z"
                          fill="url(#g7Gold)" filter="url(#f7Glow)" stroke="#fffef0" stroke-width="2.5" stroke-linejoin="round"/>
                    <path d="M26 23 H74 V28 L48 68" stroke="#ffffff" stroke-width="2" opacity="0.65" stroke-linecap="round"/>
                </svg>
            `,
            diamond: `
                <svg class="slot-icon-svg" viewBox="0 0 100 100" fill="none">
                    <defs>
                        <linearGradient id="gDia" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="35%" stop-color="#a5f3fc"/>
                            <stop offset="70%" stop-color="#00d9ff"/>
                            <stop offset="100%" stop-color="#0284c7"/>
                        </linearGradient>
                        <filter id="fDiaGlow">
                            <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00d9ff" flood-opacity="0.9"/>
                        </filter>
                    </defs>
                    <g filter="url(#fDiaGlow)">
                        <polygon points="30,22 70,22 86,44 14,44" fill="#67e8f9" stroke="#ffffff" stroke-width="1.8"/>
                        <polygon points="14,44 86,44 50,86" fill="url(#gDia)" stroke="#ffffff" stroke-width="1.8"/>
                        <polygon points="30,22 50,44 70,22" fill="#e0f2fe" opacity="0.8"/>

            grape: `
                <svg class="slot-icon-svg" viewBox="0 0 100 100" fill="none">

                        <radialGradient id="gGrape" cx="35%" cy="32%" r="65%">

                        <circle cx="52" cy="80" r="7.5" fill="url(#gGrape)" stroke="#e879f9" stroke-width="1"/>

        };

        const SYMBOL_KEYS = ['seven', 'diamond', 'cherry', 'lemon', 'orange', 'grape'];
        const FRUIT_KEYS = ['lemon', 'orange', 'grape'];
        const SYMBOL_NAMES = {
            seven: '7️⃣ Семёрки',
            diamond: '💎 Алмазы',
            cherry: '🍒 Вишни',
            lemon: '🍋 Лимоны',
            orange: '🍊 Апельсины',
            grape: '🍇 Виноград'
        };

        const balanceDisplay = document.getElementById('balanceDisplay');
        const infoBalance = document.getElementById('infoBalance');
        const infoBet = document.getElementById('infoBet');
        const betBtns = document.querySelectorAll('.bet-btn');
        const spinBtn = document.getElementById('spinBtn');
        const slotLever = document.getElementById('slotLever');
        const domeStatus = document.getElementById('domeStatus');
        const cabinetTray = document.getElementById('cabinetTray');

        function renderInitialReels() {
            for (let i = 0; i < 3; i++) {
                const strip = document.getElementById('reelStrip' + i);
                if (strip) strip.innerHTML = `<div class="reel-cell">${SVGS.seven}</div>`;
            }
            document.getElementById('ptSeven').innerHTML = `${SVGS.seven}${SVGS.seven}${SVGS.seven}`.replaceAll('slot-icon-svg', 'mini-ico');
            document.getElementById('ptDiamond').innerHTML = `${SVGS.diamond}${SVGS.diamond}${SVGS.diamond}`.replaceAll('slot-icon-svg', 'mini-ico');
            document.getElementById('ptCherry').innerHTML = `${SVGS.cherry}${SVGS.cherry}${SVGS.cherry}`.replaceAll('slot-icon-svg', 'mini-ico');
            document.getElementById('ptLemon').innerHTML = `${SVGS.lemon}${SVGS.lemon}${SVGS.lemon}`.replaceAll('slot-icon-svg', 'mini-ico');
            document.getElementById('ptOrange').innerHTML = `${SVGS.orange}${SVGS.orange}${SVGS.orange}`.replaceAll('slot-icon-svg', 'mini-ico');
        }

        updateBalanceUI();
        renderInitialReels();

        function goBack() {
            if (window.parent && window.parent !== window && typeof window.parent.closeGameModal === 'function') {
                window.parent.closeGameModal();
            } else if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }

        function updateBalanceUI() {
            balanceDisplay.textContent = balance;
            infoBalance.textContent = balance;
            localStorage.setItem('vetruch_balance', balance);
        }

        function setBet(amount, btn) {
            if (isSpinning) return;
            bet = amount;
            infoBet.textContent = bet;
            betBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function rollSlotOutcome() {
            const r = Math.random();

            if (r < 0.0035) {
                return { reels: ['seven', 'seven', 'seven'], mult: 15, title: '🔥 ДЖЕКПОТ 777! 🔥' };
            }
            if (r < 0.0125) {
                return { reels: ['diamond', 'diamond', 'diamond'], mult: 8, title: '💎 БРИЛЛИАНТОВЫЙ КУШ! 💎' };
            }
            if (r < 0.0325) {
                return { reels: ['cherry', 'cherry', 'cherry'], mult: 5, title: '🍒 СПЕЛЫЕ ВИШНИ x5!' };
            }
            if (r < 0.0775) {
                const f = FRUIT_KEYS[Math.floor(Math.random() * FRUIT_KEYS.length)];
                return { reels: [f, f, f], mult: 3, title: `${SYMBOL_NAMES[f]} x3!` };
            }
            if (r < 0.1725) {
                const pairSym = SYMBOL_KEYS[Math.floor(Math.random() * SYMBOL_KEYS.length)];
                const others = SYMBOL_KEYS.filter(s => s !== pairSym);
                const oddSym = others[Math.floor(Math.random() * others.length)];
                const pos = Math.floor(Math.random() * 3);
                let reels;
                if (pos === 0) reels = [pairSym, pairSym, oddSym];
                else if (pos === 1) reels = [oddSym, pairSym, pairSym];
                else reels = [pairSym, oddSym, pairSym];
                return { reels, mult: 1.5, title: `✨ ПАРА (${SYMBOL_NAMES[pairSym]}) x1.5` };
            }

            const pool = SYMBOL_KEYS.slice();
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            return { reels: [pool[0], pool[1], pool[2]], mult: 0, title: 'Попробуй ещё раз!' };
        }

        function animateReel(reelIndex, finalKey, totalSteps, durationMs) {
            return new Promise(resolve => {
                const strip = document.getElementById('reelStrip' + reelIndex);
                const currentHtml = strip.querySelector('.reel-cell')?.innerHTML || SVGS.seven;

                const items = [currentHtml];
                for (let i = 1; i < totalSteps - 1; i++) {
                    const rnd = SYMBOL_KEYS[Math.floor(Math.random() * SYMBOL_KEYS.length)];
                    items.push(SVGS[rnd]);
                }
                items.push(SVGS[finalKey]);

                strip.style.transition = 'none';
                strip.style.transform = 'translateY(0px)';
                strip.innerHTML = items.map(s => `<div class="reel-cell">${s}</div>`).join('');
                strip.classList.add('spinning');

                void strip.offsetHeight;

                const offset = -(totalSteps - 1) * CELL_HEIGHT;
                strip.style.transition = `transform ${durationMs}ms cubic-bezier(0.25, 0.8, 0.5, 1)`;
                strip.style.transform = `translateY(${offset}px)`;

                setTimeout(() => {
                    strip.classList.remove('spinning');
                }, Math.max(0, durationMs - 95));

                setTimeout(() => {
                    strip.classList.remove('spinning');
                    strip.style.transition = 'none';
                    strip.style.transform = 'translateY(0px)';
                    strip.innerHTML = `<div class="reel-cell">${SVGS[finalKey]}</div>`;
                    resolve();
                }, durationMs + 10);
            });
        }

        async function spinSlots() {
            if (isSpinning) return;

            if (!(window.VETRUCH_ECONOMY && VETRUCH_ECONOMY.hasPartnerRefAccess())) {
                showAppAlert("🔗 Игра «Слоты 777» доступна после регистрации по реферальной ссылке в разделе «Задания»!", { title: "Доступ по рефке" });
                return;
            }

            if (balance < bet) {
                showAppAlert("Недостаточно монет!");
                return;
            }

            if (window.VETRUCH_ECONOMY) {
                var check = VETRUCH_ECONOMY.checkAndUseAttempt('slots');
                if (!check.ok) {
                    VETRUCH_ECONOMY.showNoAttemptsOverlay('slots');
                    return;
                }
                VETRUCH_ECONOMY.updateBadgeUI('slots');
            }

            isSpinning = true;

            slotLever.classList.remove('pulled');
            void slotLever.offsetWidth;
            slotLever.classList.add('pulled');

            if (tg.HapticFeedback) {
                try { tg.HapticFeedback.impactOccurred('medium'); } catch (e) {}
            }

            balance -= bet;
            const expEarned = Math.floor(bet / 50);
            if (expEarned > 0) {
                let curXp = parseInt(localStorage.getItem('vetruch_user_xp') || '0', 10);
                localStorage.setItem('vetruch_user_xp', curXp + expEarned);
            }
            updateBalanceUI();

            for (let i = 0; i < 3; i++) {
                document.getElementById('reelWin' + i).classList.remove('win-glow');
            }

            betBtns.forEach(b => b.disabled = true);
            spinBtn.disabled = true;
            spinBtn.className = 'action-btn';
            spinBtn.textContent = 'КРУТИМ...';

            domeStatus.className = 'dome-status';
            domeStatus.textContent = 'УДАЧИ! БАРАБАНЫ КРУТЯТСЯ...';
            cabinetTray.textContent = 'КРУТИМ БАРАБАНЫ...';

            const outcome = rollSlotOutcome();

            await Promise.all([
                animateReel(0, outcome.reels[0], 14, 900),
                animateReel(1, outcome.reels[1], 19, 1250),
                animateReel(2, outcome.reels[2], 24, 1600)
            ]);

            if (outcome.mult > 0) {
                const winAmount = Math.floor(bet * outcome.mult);
                balance += winAmount;
                updateBalanceUI();

                for (let i = 0; i < 3; i++) {
                    document.getElementById('reelWin' + i).classList.add('win-glow');
                }

                domeStatus.className = outcome.mult >= 8 ? 'dome-status jackpot' : 'dome-status win';
                domeStatus.textContent = outcome.title;
                cabinetTray.textContent = `ВЫПЛАТА: +${winAmount} МОНЕТ!`;

                spinBtn.className = 'action-btn win';
                spinBtn.innerHTML = `ВЫИГРЫШ +${winAmount} <img src="coins.png" class="coin-icon"> · КРУТИТЬ ЕЩЁ`;

                if (tg.HapticFeedback) {
                    try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
                }
            } else {
                domeStatus.className = 'dome-status lose';
                domeStatus.textContent = 'НЕТ КОМБИНАЦИИ · ПОПРОБУЙ ЕЩЁ!';
                cabinetTray.textContent = 'VETRUCH VIP CLUB • SUPER 777 JACKPOT';

                spinBtn.className = 'action-btn bust';
                spinBtn.textContent = 'МИМО · КРУТИТЬ СНОВА';
            }

            spinBtn.disabled = false;
            betBtns.forEach(b => b.disabled = false);
            isSpinning = false;
        }

        // ================= Анимация звезд =================
        const canvas = document.getElementById("stars");
        const ctx = canvas.getContext("2d");
        let stars = []; let w = 0; let h = 0;

        function resizeCanvas() {
            w = window.innerWidth; h = window.innerHeight;
            canvas.width = w; canvas.height = h;
            createStars();
        }
        function createStars() {
            stars = [];
            for (let i = 0; i < 70; i++) stars.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.2 + 0.2, s: Math.random() * 0.1 + 0.02, o: Math.random() * 0.5 + 0.2 });
        }
        function drawStars() {
            ctx.clearRect(0, 0, w, h);
            for (const star of stars) {
                ctx.beginPath(); ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(100, 200, 255, ${star.o})`; ctx.fill();
                star.y += star.s;
                if (star.y > h) { star.y = 0; star.x = Math.random() * w; }
            }
            requestAnimationFrame(drawStars);
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas(); drawStars();
    </script>
