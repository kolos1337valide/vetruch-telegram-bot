<!DOCTYPE html>
<html lang="ru">
<head>

<script src="vetruch-economy.js?v=6"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мины - Vetruch</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        :root {
            --bg: #03070e; --text: #ffffff;
            --blue-main: #22d3ee; --blue-glow: rgba(34, 211, 238, 0.48);
            --cell-bg: linear-gradient(180deg, #1f3354 0%, #111f36 100%);
            --cell-safe: linear-gradient(145deg, rgba(34, 211, 238, 0.28), rgba(16, 185, 129, 0.22));
            --cell-mine: linear-gradient(145deg, rgba(244, 63, 94, 0.3), rgba(190, 18, 60, 0.22));
        }
        
        body { 
            margin: 0;
            background: radial-gradient(circle at 50% 18%, #0e284b 0%, #06101f 60%, #03070e 100%);
            color: var(--text); 
            min-height: 100vh; overflow-x: hidden; overflow-y: auto; 
        }

        /* Фон */
        #stars { position: fixed; z-index: 0; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        .dark-overlay { position: fixed; z-index: 1; inset: 0; background: linear-gradient(180deg, rgba(6,16,31,0.1) 0%, rgba(3,7,14,0.78) 100%); pointer-events: none; }

        .game-container { 
            position: relative; z-index: 2; display: flex; flex-direction: column; 
            min-height: 100vh; padding: 20px 16px 40px 16px; 
        }

        /* Верхняя панель */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
        .back-btn { background: rgba(16, 36, 66, 0.85); border: 1px solid rgba(56, 189, 248, 0.28); color: #fff; width: 40px; height: 40px; border-radius: 12px; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(8px); }
        .balance-pill { display: flex; align-items: center; gap: 6px; background: linear-gradient(135deg, rgba(34, 211, 238, 0.16), rgba(16, 185, 129, 0.1)); padding: 8px 16px; border-radius: 20px; font-weight: 800; font-size: 16px; border: 1px solid rgba(34, 211, 238, 0.42); color: #e0f7ff; box-shadow: 0 0 16px rgba(34, 211, 238, 0.2); }
        .coin-icon { width: 18px; height: 18px; flex-shrink: 0; vertical-align: middle; }

        /* Игровое поле 5x5 — Сейф */
        .grid-wrapper { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px; flex: 1; }
        .vault-stage-hud {
            width: 100%;
            max-width: 356px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 14px;
            border-radius: 12px;
            background: rgba(9, 22, 44, 0.88);
            border: 1px solid rgba(34, 211, 238, 0.34);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.6px;
            color: #93c5fd;
            text-transform: uppercase;
        }
        .vault-stage-hud b { color: #e0fbff; }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            grid-template-rows: repeat(5, 1fr);
            gap: 8px; 
            width: 100%; 
            max-width: 356px; 
            aspect-ratio: 1; 
            margin: 0 auto;
            padding: 10px;
            position: relative;
            background: linear-gradient(180deg, rgba(16, 36, 68, 0.72), rgba(7, 15, 29, 0.9));
            border: 1.5px solid rgba(56, 189, 248, 0.34);
            border-radius: 18px;
            box-shadow: inset 0 1px 0 rgba(186, 230, 253, 0.2), 0 14px 34px rgba(0, 0, 0, 0.65), 0 0 22px rgba(34, 211, 238, 0.14);
        }
        
        .cell { 
            background: var(--cell-bg); 
            border-radius: 10px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: clamp(24px, 7vw, 32px);
            cursor: pointer; 
            border: 1px solid rgba(148, 197, 255, 0.16); 
            box-shadow: inset 0 1px 0 rgba(186, 230, 253, 0.2), inset 0 -3px 0 rgba(4, 9, 18, 0.65), 0 4px 10px rgba(0,0,0,0.45);
            transition: all 0.2s ease;
            width: 100%;
            height: 100%;
            aspect-ratio: 1;
            overflow: hidden;
            line-height: 1;
        }
        
        .grid.disabled .cell { opacity: 0.72; pointer-events: none; }

        .cell.safe { background: var(--cell-safe); border: 1px solid #22d3ee; box-shadow: inset 0 0 16px rgba(34, 211, 238, 0.35), 0 0 12px rgba(16, 185, 129, 0.24); animation: pop 0.4s ease forwards; }
        .cell.mine { background: var(--cell-mine); border: 1px solid #ff3366; box-shadow: inset 0 0 16px rgba(255,51,102,0.45); animation: shake 0.4s ease forwards; }
        .cell.dimmed { opacity: 0.4; }

        @keyframes pop { 
            0% { transform: scale(0.7); opacity: 0; } 
            50% { transform: scale(1.05); } 
            100% { transform: scale(1); opacity: 1; } 
        }
        @keyframes shake { 
            0%, 100% { transform: translateX(0); } 
            25% { transform: translateX(-4px); } 
            75% { transform: translateX(4px); } 
        }

        /* Управление ставкой */
        .controls { background: rgba(10, 21, 39, 0.9); border: 1px solid rgba(56, 189, 248, 0.24); border-radius: 20px; padding: 18px; margin-top: auto; backdrop-filter: blur(10px); box-shadow: 0 10px 26px rgba(0, 0, 0, 0.65); }
        
        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .label { font-size: 14px; color: #94b8db; font-weight: 700; }
        
        .bet-options { display: flex; gap: 8px; }
        .bet-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(56,189,248,0.18); color: #fff; padding: 10px 14px; border-radius: 10px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .bet-btn.active { background: rgba(34, 211, 238, 0.22); border-color: #22d3ee; color: #67e8f9; box-shadow: 0 0 12px rgba(34, 211, 238, 0.25); }
        .bet-btn:disabled { opacity: 0.5; pointer-events: none; }

        .mines-selector { display: flex; align-items: center; gap: 15px; background: rgba(15, 31, 56, 0.9); border-radius: 10px; padding: 5px 10px; border: 1px solid rgba(56,189,248,0.22); }
        .m-btn { background: transparent; border: none; color: #fff; font-size: 20px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .m-btn:disabled { opacity: 0.3; pointer-events: none; }
        .m-val { font-weight: 900; font-size: 16px; width: 25px; text-align: center; color: #22d3ee; }

        .action-btn { 
            width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 16px; font-weight: 900; 
            color: #ffffff; background: linear-gradient(135deg, #0095ff 0%, #005fd2 100%); cursor: pointer; 
            box-shadow: 0 4px 18px rgba(0, 136, 255, 0.45), inset 0 1px 0 rgba(255,255,255,0.3); transition: 0.2s; 
            display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px;
        }
        .action-btn:active { transform: scale(0.97); }
        
        .action-btn.cashout { background: linear-gradient(135deg, #00e676, #00c853); color: #042111; box-shadow: 0 4px 18px rgba(0, 230, 118, 0.45); }
        .action-btn.bust { background: linear-gradient(135deg, #fb7185, #e11d48); color: #fff; box-shadow: 0 4px 18px rgba(225, 29, 72, 0.45); }
        .action-btn:disabled { background: #1d293d; color: #5b6e8a; box-shadow: none; pointer-events: none; }
    </style>
</head>
<body>

    <canvas id="stars"></canvas>
    <div class="dark-overlay"></div>

    <div class="game-container">
        
        <!-- Шапка -->
        <div class="header">
            <button class="back-btn" onclick="goBack()">❮</button>
            <div class="balance-pill">
                <span id="balanceDisplay">500</span> <img src="coins.png" alt="coins" class="coin-icon">
            </div>
        </div>

        <!-- Сетка мин (изначально заблокирована классом disabled) -->
        <div class="grid-wrapper">
            <div class="vault-stage-hud">
                <span>💎 <b>СЕЙФ 5×5</b></span>
                <span>⚡ ИЩИ КРИСТАЛЛЫ</span>
            </div>
            <div class="grid disabled" id="grid">
                <!-- Ячейки сгенерируются в JS -->
            </div>
        </div>

        <!-- Панель управления -->
        <div class="controls">
            
            <div class="row">
                <div class="label">Ставка</div>
                <div class="bet-options">
                    <button class="bet-btn active" onclick="setBet(20, this)">20</button>
                    <button class="bet-btn" onclick="setBet(50, this)">50</button>
                    <button class="bet-btn" onclick="setBet(100, this)">100</button>
                    <button class="bet-btn" onclick="setBet(200, this)">200</button>
                </div>
            </div>

            <div class="row">
                <div class="label">Кол-во мин (2-20)</div>
                <div class="mines-selector">
                    <button class="m-btn" id="minMinus" onclick="changeMines(-1)">-</button>
                    <div class="m-val" id="minesCount">3</div>
                    <button class="m-btn" id="minPlus" onclick="changeMines(1)">+</button>
                </div>
            </div>

            <!-- Кнопка действия -->
            <button class="action-btn" id="actionBtn" onclick="handleAction()">НАЧАТЬ ИГРУ</button>

        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand(); tg.setHeaderColor('#050d1a'); tg.setBackgroundColor('#02050b');

        // Глобальные переменные игры
        let balance = parseInt(localStorage.getItem('vetruch_balance')) || 500;
        let bet = 20;
        let mines = 3;
        
        let state = 'idle'; // 'idle', 'playing', 'finished'
        
        let gridData = [];
        let clicks = 0;
        let currentWin = 0;

        const gridEl = document.getElementById('grid');
        const actionBtn = document.getElementById('actionBtn');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const betBtns = document.querySelectorAll('.bet-btn');
        const mineMinus = document.getElementById('minMinus');
        const minePlus = document.getElementById('minPlus');

        updateBalanceUI();
        drawEmptyGrid();

        function goBack() {
            if (window.parent && window.parent !== window && typeof window.parent.closeGameModal === 'function') {
                window.parent.closeGameModal();
            } else if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }

        function updateBalanceUI() {
            balanceDisplay.textContent = balance;
            localStorage.setItem('vetruch_balance', balance);
        }

        function setBet(amount, btn) {
            if(state === 'playing') return;
            bet = amount;
            betBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function changeMines(delta) {
            if(state === 'playing') return;
            mines += delta;
            if(mines < 2) mines = 2;
            if(mines > 20) mines = 20;
            document.getElementById('minesCount').textContent = mines;
        }

        function drawEmptyGrid() {
            gridEl.innerHTML = '';
            for(let i=0; i<25; i++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                gridEl.appendChild(cell);
            }
        }

        function getMultiplier(minesCount, clicksCount) {
            let prob = 1.0;
            let safeCells = 25 - minesCount;
            for(let i=0; i<clicksCount; i++) {
                prob *= (safeCells - i) / (25 - i);
            }
            // RTP 60% формула множителей (минимум 1.15x)
            return Math.max(1.15, (0.60 / prob)); 
        }

        function handleAction() {
            if (state === 'idle' || state === 'finished') {
                startGame();
            } else if (state === 'playing' && clicks > 0) {
                cashout();
            }
        }

        function startGame() {
            if (balance < bet) {
                showAppAlert("Недостаточно монет!");
                return;
            }

            if (window.VETRUCH_ECONOMY) {
                var check = VETRUCH_ECONOMY.checkAndUseAttempt('mines');
                if (!check.ok) {
                    VETRUCH_ECONOMY.showNoAttemptsOverlay('mines');
                    return;
                }
                VETRUCH_ECONOMY.updateBadgeUI('mines');
            }

            balance -= bet;
            const expEarned = Math.floor(bet / 50);
            if (expEarned > 0) {
                let curXp = parseInt(localStorage.getItem('vetruch_user_xp') || '0', 10);
                localStorage.setItem('vetruch_user_xp', curXp + expEarned);
            }
            updateBalanceUI();
            
            state = 'playing';
            clicks = 0;
            currentWin = 0;

            betBtns.forEach(b => b.disabled = true);
            mineMinus.disabled = true;
            minePlus.disabled = true;

            actionBtn.classList.remove('cashout', 'bust');
            actionBtn.innerHTML = 'ОТКРОЙТЕ ЯЧЕЙКУ';
            actionBtn.disabled = true;

            gridEl.classList.remove('disabled');
            generateGrid();
        }

        function generateGrid() {
            gridEl.innerHTML = '';
            gridData = [];
            
            let rawMines = Array(25).fill(false);
            for(let i=0; i<mines; i++) rawMines[i] = true;

            for (let i = rawMines.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [rawMines[i], rawMines[j]] = [rawMines[j], rawMines[i]];
            }

            for(let i=0; i<25; i++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                cell.onclick = () => clickCell(i);
                gridEl.appendChild(cell);
                
                gridData.push({ 
                    isMine: rawMines[i], 
                    revealed: false, 
                    el: cell 
                });
            }
        }

        function clickCell(index) {
            if(state !== 'playing' || gridData[index].revealed) return;

            let cellData = gridData[index];
            cellData.revealed = true;

            // Контроль RTP 60%: если ячейка была без мины, с шансом 40% (house edge)
            // при клике может превратиться в мину (начиная со второго клика)
            if (!cellData.isMine && clicks >= 1 && Math.random() > 0.60) {
                cellData.isMine = true;
            }

            if (cellData.isMine) {
                cellData.el.classList.add('mine');
                cellData.el.innerHTML = '💣';
                loseGame();
            } else {
                cellData.el.classList.add('safe');
                cellData.el.innerHTML = '💎';
                clicks++;
                
                let mult = getMultiplier(mines, clicks);
                currentWin = Math.floor(bet * mult);

                actionBtn.disabled = false;
                actionBtn.classList.add('cashout');
                actionBtn.innerHTML = `ЗАБРАТЬ ${currentWin} <img src="coins.png" class="coin-icon"> (x${mult.toFixed(2)})`;

                if (clicks === (25 - mines)) {
                    cashout();
                }
            }
        }

        function cashout() {
            if(clicks === 0 || state !== 'playing') return;
            
            balance += currentWin;
            updateBalanceUI();
            
            actionBtn.classList.remove('cashout');
            actionBtn.classList.add('cashout');
            actionBtn.innerHTML = `ВЫИГРЫШ ${currentWin}! ИГРАТЬ СНОВА`;
            
            endGame();
        }

        function loseGame() {
            actionBtn.classList.remove('cashout');
            actionBtn.classList.add('bust');
            actionBtn.innerHTML = 'ПРОИГРЫШ! ИГРАТЬ СНОВА';
            actionBtn.disabled = false;
            
            endGame();
        }

        function endGame() {
            state = 'finished';
            gridEl.classList.add('disabled');
            
            betBtns.forEach(b => b.disabled = false);
            mineMinus.disabled = false;
            minePlus.disabled = false;

            for(let i=0; i<25; i++) {
                if(!gridData[i].revealed) {
                    gridData[i].el.classList.add('dimmed');
                    if(gridData[i].isMine) {
                        gridData[i].el.innerHTML = '💣';
                    }
                }
            }
        }

        // ================= Анимация звезд на фоне =================
        const canvas = document.getElementById("stars");
        const ctx = canvas.getContext("2d");
        let stars = []; let w = 0; let h = 0;

        function resizeCanvas() {
            w = window.innerWidth; h = window.innerHeight;
            canvas.width = w; canvas.height = h;
            createStars();
        }
        function createStars() {
            stars = [];
            for (let i = 0; i < 70; i++) stars.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.2 + 0.2, s: Math.random() * 0.1 + 0.02, o: Math.random() * 0.5 + 0.2 });
        }
        function drawStars() {
            ctx.clearRect(0, 0, w, h);
            for (const star of stars) {
                ctx.beginPath(); ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(120, 235, 255, ${star.o})`; ctx.fill();
                star.y += star.s;
                if (star.y > h) { star.y = 0; star.x = Math.random() * w; }
            }
            requestAnimationFrame(drawStars);
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas(); drawStars();
    </script>
</body>
</html>
