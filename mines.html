<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мины - Vetruch</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        :root {
            --bg: #000000; --text: #ffffff;
            --blue-main: #0088ff; --blue-glow: rgba(0, 136, 255, 0.5);
            --cell-bg: #1a1d24; --cell-safe: rgba(0, 136, 255, 0.2); --cell-mine: rgba(255, 51, 102, 0.2);
        }
        
        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            min-height: 100vh; overflow-x: hidden; overflow-y: auto; 
        }

        /* Фон */
        #stars { position: fixed; z-index: 0; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        .dark-overlay { position: fixed; z-index: 1; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.8) 100%); pointer-events: none; }

        .game-container { 
            position: relative; z-index: 2; display: flex; flex-direction: column; 
            min-height: 100vh; padding: 20px 16px 40px 16px; 
        }

        /* Верхняя панель */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .back-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 40px; height: 40px; border-radius: 12px; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .balance-pill { display: flex; align-items: center; gap: 6px; background: rgba(0, 136, 255, 0.15); padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 16px; border: 1px solid rgba(0, 136, 255, 0.3); }
        .coin-icon { width: 18px; height: 18px; flex-shrink: 0; vertical-align: middle; }

        /* Игровое поле 5x5 */
        .grid-wrapper { display: flex; justify-content: center; align-items: center; margin-bottom: 25px; flex: 1; }
        
        /* СТРОГИЕ ПРАВИЛА СЕТКИ: фиксируем столбцы и строки */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            grid-template-rows: repeat(5, 1fr); /* Жестко 5 строк одинакового размера */
            gap: 8px; 
            width: 100%; 
            max-width: 350px; 
            aspect-ratio: 1; 
            margin: 0 auto; 
        }
        
        /* СТРОГИЕ ПРАВИЛА ЯЧЕЙКИ: запрещаем ей менять размер */
        .cell { 
            background: var(--cell-bg); 
            border-radius: 10px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: clamp(24px, 7vw, 32px); /* Эмодзи подстраивается под экран, но не рвет ячейку */
            cursor: pointer; 
            border: 1px solid rgba(255,255,255,0.05); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
            width: 100%;
            height: 100%;
            aspect-ratio: 1;
            overflow: hidden; /* Обрезает все, что пытается вылезти */
            line-height: 1;
        }
        
        .grid.disabled .cell { opacity: 0.7; pointer-events: none; }

        /* ИСПРАВЛЕННАЯ АНИМАЦИЯ: возвращаем масштаб к scale(1) */
        .cell.safe { background: var(--cell-safe); border: 1px solid var(--blue-main); box-shadow: inset 0 0 15px rgba(0,136,255,0.2); animation: pop 0.4s ease forwards; }
        .cell.mine { background: var(--cell-mine); border: 1px solid #ff3366; box-shadow: inset 0 0 15px rgba(255,51,102,0.4); animation: shake 0.4s ease forwards; }
        .cell.dimmed { opacity: 0.4; }

        @keyframes pop { 
            0% { transform: scale(0.7); opacity: 0; } 
            50% { transform: scale(1.05); } 
            100% { transform: scale(1); opacity: 1; } 
        }
        @keyframes shake { 
            0%, 100% { transform: translateX(0); } 
            25% { transform: translateX(-4px); } 
            75% { transform: translateX(4px); } 
        }

        /* Управление ставкой */
        .controls { background: rgba(20, 22, 28, 0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; margin-top: auto; backdrop-filter: blur(10px); }
        
        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .label { font-size: 14px; color: var(--secondary); font-weight: 600; }
        
        .bet-options { display: flex; gap: 8px; }
        .bet-btn { background: #1a1d24; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 10px 14px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .bet-btn.active { background: rgba(0, 136, 255, 0.2); border-color: var(--blue-main); color: var(--blue-main); }
        .bet-btn:disabled { opacity: 0.5; pointer-events: none; }

        .mines-selector { display: flex; align-items: center; gap: 15px; background: #1a1d24; border-radius: 10px; padding: 5px 10px; border: 1px solid rgba(255,255,255,0.1); }
        .m-btn { background: transparent; border: none; color: #fff; font-size: 20px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .m-btn:disabled { opacity: 0.3; pointer-events: none; }
        .m-val { font-weight: bold; font-size: 16px; width: 25px; text-align: center; color: var(--blue-main); }

        .action-btn { 
            width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 16px; font-weight: 800; 
            color: #fff; background: var(--blue-main); cursor: pointer; 
            box-shadow: 0 0 15px var(--blue-glow); transition: 0.2s; 
            display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px;
        }
        .action-btn:active { transform: scale(0.97); }
        
        .action-btn.cashout { background: #00cc66; box-shadow: 0 0 15px rgba(0, 204, 102, 0.4); }
        .action-btn.bust { background: #ff3366; box-shadow: 0 0 15px rgba(255, 51, 102, 0.4); }
        .action-btn:disabled { background: #2a2d35; color: #555; box-shadow: none; pointer-events: none; }
    </style>
</head>
<body>

    <canvas id="stars"></canvas>
    <div class="dark-overlay"></div>

    <div class="game-container">
        
        <!-- Шапка -->
        <div class="header">
            <button class="back-btn" onclick="goBack()">❮</button>
            <div class="balance-pill">
                <span id="balanceDisplay">500</span> <img src="coins.png" alt="coins" class="coin-icon">
            </div>
        </div>

        <!-- Сетка мин (изначально заблокирована классом disabled) -->
        <div class="grid-wrapper">
            <div class="grid disabled" id="grid">
                <!-- Ячейки сгенерируются в JS -->
            </div>
        </div>

        <!-- Панель управления -->
        <div class="controls">
            
            <div class="row">
                <div class="label">Ставка</div>
                <div class="bet-options">
                    <button class="bet-btn active" onclick="setBet(20, this)">20</button>
                    <button class="bet-btn" onclick="setBet(50, this)">50</button>
                    <button class="bet-btn" onclick="setBet(100, this)">100</button>
                    <button class="bet-btn" onclick="setBet(200, this)">200</button>
                </div>
            </div>

            <div class="row">
                <div class="label">Кол-во мин (2-20)</div>
                <div class="mines-selector">
                    <button class="m-btn" id="minMinus" onclick="changeMines(-1)">-</button>
                    <div class="m-val" id="minesCount">3</div>
                    <button class="m-btn" id="minPlus" onclick="changeMines(1)">+</button>
                </div>
            </div>

            <!-- Кнопка действия -->
            <button class="action-btn" id="actionBtn" onclick="handleAction()">НАЧАТЬ ИГРУ</button>

        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand(); tg.setHeaderColor('#000000'); tg.setBackgroundColor('#000000');

        // Глобальные переменные игры
        let balance = parseInt(localStorage.getItem('vetruch_balance')) || 500;
        let bet = 20;
        let mines = 3;
        
        let state = 'idle'; // 'idle', 'playing', 'finished'
        
        let gridData = [];
        let clicks = 0;
        let currentWin = 0;

        const gridEl = document.getElementById('grid');
        const actionBtn = document.getElementById('actionBtn');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const betBtns = document.querySelectorAll('.bet-btn');
        const mineMinus = document.getElementById('minMinus');
        const minePlus = document.getElementById('minPlus');

        updateBalanceUI();
        drawEmptyGrid();

        function goBack() {
            window.location.href = 'index.html';
        }

        function updateBalanceUI() {
            balanceDisplay.textContent = balance;
            localStorage.setItem('vetruch_balance', balance);
        }

        function setBet(amount, btn) {
            if(state === 'playing') return;
            bet = amount;
            betBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function changeMines(delta) {
            if(state === 'playing') return;
            mines += delta;
            if(mines < 2) mines = 2;
            if(mines > 20) mines = 20;
            document.getElementById('minesCount').textContent = mines;
        }

        function drawEmptyGrid() {
            gridEl.innerHTML = '';
            for(let i=0; i<25; i++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                gridEl.appendChild(cell);
            }
        }

        function getMultiplier(minesCount, clicksCount) {
            let prob = 1.0;
            let safeCells = 25 - minesCount;
            for(let i=0; i<clicksCount; i++) {
                prob *= (safeCells - i) / (25 - i);
            }
            return (0.95 / prob); 
        }

        function handleAction() {
            if (state === 'idle' || state === 'finished') {
                startGame();
            } else if (state === 'playing' && clicks > 0) {
                cashout();
            }
        }

        function startGame() {
            if (balance < bet) {
                tg.showAlert("Недостаточно монет!");
                return;
            }

            balance -= bet;
            updateBalanceUI();
            
            state = 'playing';
            clicks = 0;
            currentWin = 0;

            betBtns.forEach(b => b.disabled = true);
            mineMinus.disabled = true;
            minePlus.disabled = true;

            actionBtn.classList.remove('cashout', 'bust');
            actionBtn.innerHTML = 'ОТКРОЙТЕ ЯЧЕЙКУ';
            actionBtn.disabled = true;

            gridEl.classList.remove('disabled');
            generateGrid();
        }

        function generateGrid() {
            gridEl.innerHTML = '';
            gridData = [];
            
            let rawMines = Array(25).fill(false);
            for(let i=0; i<mines; i++) rawMines[i] = true;

            for (let i = rawMines.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [rawMines[i], rawMines[j]] = [rawMines[j], rawMines[i]];
            }

            for(let i=0; i<25; i++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                cell.onclick = () => clickCell(i);
                gridEl.appendChild(cell);
                
                gridData.push({ 
                    isMine: rawMines[i], 
                    revealed: false, 
                    el: cell 
                });
            }
        }

        function clickCell(index) {
            if(state !== 'playing' || gridData[index].revealed) return;

            let cellData = gridData[index];
            cellData.revealed = true;

            if (cellData.isMine) {
                cellData.el.classList.add('mine');
                cellData.el.innerHTML = '💣';
                loseGame();
            } else {
                cellData.el.classList.add('safe');
                cellData.el.innerHTML = '💎';
                clicks++;
                
                let mult = getMultiplier(mines, clicks);
                currentWin = Math.floor(bet * mult);

                actionBtn.disabled = false;
                actionBtn.classList.add('cashout');
                actionBtn.innerHTML = `ЗАБРАТЬ ${currentWin} <img src="coins.png" class="coin-icon"> (x${mult.toFixed(2)})`;

                if (clicks === (25 - mines)) {
                    cashout();
                }
            }
        }

        function cashout() {
            if(clicks === 0 || state !== 'playing') return;
            
            balance += currentWin;
            updateBalanceUI();
            
            actionBtn.classList.remove('cashout');
            actionBtn.classList.add('cashout');
            actionBtn.innerHTML = `ВЫИГРЫШ ${currentWin}! ИГРАТЬ СНОВА`;
            
            endGame();
        }

        function loseGame() {
            actionBtn.classList.remove('cashout');
            actionBtn.classList.add('bust');
            actionBtn.innerHTML = 'ПРОИГРЫШ! ИГРАТЬ СНОВА';
            actionBtn.disabled = false;
            
            endGame();
        }

        function endGame() {
            state = 'finished';
            gridEl.classList.add('disabled');
            
            betBtns.forEach(b => b.disabled = false);
            mineMinus.disabled = false;
            minePlus.disabled = false;

            for(let i=0; i<25; i++) {
                if(!gridData[i].revealed) {
                    gridData[i].el.classList.add('dimmed');
                    if(gridData[i].isMine) {
                        gridData[i].el.innerHTML = '💣';
                    }
                }
            }
        }

        // ================= Анимация звезд на фоне =================
        const canvas = document.getElementById("stars");
        const ctx = canvas.getContext("2d");
        let stars = []; let w = 0; let h = 0;

        function resizeCanvas() {
            w = window.innerWidth; h = window.innerHeight;
            canvas.width = w; canvas.height = h;
            createStars();
        }
        function createStars() {
            stars = [];
            for (let i = 0; i < 70; i++) stars.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.2 + 0.2, s: Math.random() * 0.1 + 0.02, o: Math.random() * 0.5 + 0.2 });
        }
        function drawStars() {
            ctx.clearRect(0, 0, w, h);
            for (const star of stars) {
                ctx.beginPath(); ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(100, 180, 255, ${star.o})`; ctx.fill();
                star.y += star.s;
                if (star.y > h) { star.y = 0; star.x = Math.random() * w; }
            }
            requestAnimationFrame(drawStars);
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas(); drawStars();
    </script>
</body>
</html>
