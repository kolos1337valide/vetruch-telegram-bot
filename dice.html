<!DOCTYPE html>
<html lang="ru">
<head>

<script src="vetruch-economy.js?v=6"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кости - Vetruch</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        :root {
            --bg: #02050b; --text: #ffffff;
            --blue-main: #00d9ff; --blue-glow: rgba(0, 136, 255, 0.55);
            --red-main: #ff3366; --red-glow: rgba(255, 51, 102, 0.6);
        }
        body { margin: 0; background: radial-gradient(circle at 50% 25%, #0d2444 0%, #050d1a 60%, #02050b 100%); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; overflow-y: auto; }

        /* Фон */
        #stars { position: fixed; z-index: 0; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        .dark-overlay { position: fixed; z-index: 1; inset: 0; background: linear-gradient(180deg, rgba(5,13,26,0.12) 0%, rgba(2,5,11,0.82) 100%); pointer-events: none; }

        /* ЭКРАН ЗАГРУЗКИ ДЛЯ ИГРЫ (Моментально скроется JS скриптом) */
        #loading-screen {
            position: fixed; inset: 0; background: #02050b; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
        }

        .game-container { 
            position: relative; z-index: 2; display: flex; flex-direction: column; 
            min-height: 100vh; padding: 15px 16px 60px 16px; 
        }

        /* ================= ВЕРХНИЙ БЛОК ================= */
        .top-section { display: flex; flex-direction: column; gap: 10px; width: 100%; z-index: 10; }

        .header { display: flex; justify-content: space-between; align-items: center; }
        .back-btn { background: rgba(11, 24, 46, 0.88); border: 1px solid rgba(0, 217, 255, 0.28); color: #fff; height: 40px; padding: 0 14px; border-radius: 12px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer; backdrop-filter: blur(8px); }
        .balance-pill { display: flex; align-items: center; gap: 6px; background: linear-gradient(135deg, rgba(0, 136, 255, 0.2), rgba(0, 217, 255, 0.1)); padding: 8px 16px; border-radius: 20px; font-weight: 800; font-size: 16px; border: 1px solid rgba(0, 217, 255, 0.42); color: #e0f7ff; box-shadow: 0 0 16px rgba(0, 136, 255, 0.24); }
        .coin-icon { width: 18px; height: 18px; flex-shrink: 0; vertical-align: middle; }

        .game-info-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(9, 20, 38, 0.88); border: 1px solid rgba(0, 217, 255, 0.24);
            padding: 12px 16px; border-radius: 14px;
            backdrop-filter: blur(10px); box-shadow: 0 6px 20px rgba(0,0,0,0.45);
        }
        .info-item { font-size: 13px; color: #94b8db; display: flex; align-items: center; gap: 8px; }
        .info-val { font-size: 16px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 4px; }

        /* ================= ИГРОВОЕ ПОЛЕ - САПФИРОВЫЕ КУБИКИ ================= */
        .dice-stage { 
            display: flex; justify-content: center; align-items: center; position: relative;
            gap: 40px; margin: 74px 0 84px 0; perspective: 1200px;
        }
        .dice-stage::before {
            content: "";
            position: absolute;
            width: 262px; height: 152px;
            border-radius: 999px;
            border: 1.5px dashed rgba(0, 217, 255, 0.34);
            background: radial-gradient(ellipse at center, rgba(0, 136, 255, 0.18) 0%, transparent 74%);
            box-shadow: 0 0 32px rgba(0, 136, 255, 0.16);
            pointer-events: none;
        }
        .dice-stage-pill {
            position: absolute;
            bottom: -44px;
            left: 50%;
            transform: translateX(-50%);
            padding: 4px 12px;
            border-radius: 999px;
            background: rgba(8, 22, 46, 0.88);
            border: 1px solid rgba(0, 217, 255, 0.38);
            color: #93c5fd;
            font-size: 10.5px;
            font-weight: 800;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            white-space: nowrap;
            pointer-events: none;
        }
        .dice-stage-deco {
            position: absolute;
            font-size: 14px;
            color: rgba(0, 217, 255, 0.36);
            pointer-events: none;
        }
        .dice-stage-deco.left { left: 10px; top: 50%; transform: translateY(-50%) rotate(-12deg); }
        .dice-stage-deco.right { right: 10px; top: 50%; transform: translateY(-50%) rotate(12deg); }

        .die-container {
            width: 80px; height: 80px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(0.1, 0.8, 0.2, 1);
            transform: rotateX(-20deg) rotateY(-20deg);
        }

        .die-face {
            position: absolute; width: 80px; height: 80px;
            background: linear-gradient(145deg, #0e2c52 0%, #061529 100%); 
            border: 2px solid #00d9ff; 
            border-radius: 8px; 
            box-shadow: inset 0 0 18px rgba(0, 170, 255, 0.32), 0 0 8px rgba(0, 217, 255, 0.38);
            display: grid; padding: 14px;
        }

        /* 3D Грани */
        .face-1 { transform: rotateY(0deg) translateZ(40px); }
        .face-2 { transform: rotateX(90deg) translateZ(40px); }
        .face-3 { transform: rotateY(90deg) translateZ(40px); }
        .face-4 { transform: rotateY(-90deg) translateZ(40px); }
        .face-5 { transform: rotateX(-90deg) translateZ(40px); }
        .face-6 { transform: rotateY(180deg) translateZ(40px); }

        /* Светящиеся голубые точки */
        .dot { 
            background: radial-gradient(circle at 30% 30%, #e0fbff, #00e5ff 62%, #0077ff 100%); 
            border-radius: 50%; 
            box-shadow: 0 0 9px rgba(0, 229, 255, 0.9), inset 0 1px 1px rgba(255, 255, 255, 0.7); 
            width: 12px; height: 12px;
            justify-self: center; align-self: center; 
        }
        
        .face-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
        .face-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .face-2 .dot:nth-child(1) { grid-column: 1; grid-row: 1; }
        .face-2 .dot:nth-child(2) { grid-column: 2; grid-row: 2; }
        .face-3 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
        .face-3 .dot:nth-child(1) { grid-column: 1; grid-row: 1; }
        .face-3 .dot:nth-child(2) { grid-column: 2; grid-row: 2; }
        .face-3 .dot:nth-child(3) { grid-column: 3; grid-row: 3; }
        .face-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .face-5 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
        .face-5 .dot:nth-child(1) { grid-column: 1; grid-row: 1; }
        .face-5 .dot:nth-child(2) { grid-column: 3; grid-row: 1; }
        .face-5 .dot:nth-child(3) { grid-column: 2; grid-row: 2; }
        .face-5 .dot:nth-child(4) { grid-column: 1; grid-row: 3; }
        .face-5 .dot:nth-child(5) { grid-column: 3; grid-row: 3; }
        .face-6 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }

        /* ================= ПАНЕЛЬ УПРАВЛЕНИЯ ================= */
        .controls { 
            background: rgba(9, 20, 38, 0.9); border: 1px solid rgba(0, 217, 255, 0.25); 
            border-radius: 20px; padding: 18px; z-index: 10;
            backdrop-filter: blur(10px); box-shadow: 0 10px 26px rgba(0,0,0,0.65);
        }
        
        .mode-tabs { display: flex; background: rgba(4, 11, 24, 0.85); border: 1px solid rgba(0, 195, 255, 0.22); border-radius: 12px; padding: 4px; margin-bottom: 15px; }
        .mode-btn { flex: 1; background: transparent; border: none; color: #8cb4db; padding: 10px; font-weight: 700; font-size: 13px; border-radius: 8px; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .mode-btn.active { background: rgba(0, 170, 255, 0.24); color: #7dd3fc; box-shadow: inset 0 0 10px rgba(0, 217, 255, 0.28); }

        .target-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 15px; }
        .target-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(0, 195, 255, 0.2); color: #fff;
            width: 42px; height: 42px; border-radius: 10px; font-weight: 800; font-size: 16px;
            cursor: pointer; transition: all 0.2s;
        }
        .target-btn.active {
            background: rgba(0, 170, 255, 0.24); border-color: #00d9ff; color: #7dd3fc;
            box-shadow: inset 0 0 10px rgba(0, 217, 255, 0.3); transform: scale(1.05);
        }
        .target-btn:disabled { opacity: 0.3; pointer-events: none; }

        .multiplier-badge { display: flex; flex-direction: column; align-items: center; margin-bottom: 18px; background: rgba(4, 12, 26, 0.72); padding: 10px; border-radius: 12px; border: 1px dashed rgba(0, 217, 255, 0.34); }
        .mult-label { font-size: 11px; color: #94b8db; text-transform: uppercase; font-weight: 700; margin-bottom: 2px; }
        .mult-value { font-size: 22px; font-weight: 900; color: #00e676; text-shadow: 0 0 12px rgba(0, 230, 118, 0.35); }

        .bet-options { display: flex; gap: 8px; margin-bottom: 18px; }
        .bet-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(0,195,255,0.2); color: #fff; padding: 12px 14px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.2s; flex: 1; font-size: 15px; }
        .bet-btn.active { background: rgba(0, 170, 255, 0.22); border-color: #00d9ff; color: #7dd3fc; box-shadow: 0 0 12px rgba(0, 170, 255, 0.28); }
        .bet-btn:disabled { opacity: 0.5; pointer-events: none; }

        .action-btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 16px; font-weight: 900; color: #ffffff; background: linear-gradient(135deg, #0095ff 0%, #005fd2 100%); cursor: pointer; box-shadow: 0 4px 18px rgba(0, 136, 255, 0.48), inset 0 1px 0 rgba(255,255,255,0.3); transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .action-btn:active { transform: scale(0.97); }
        .action-btn.win { background: linear-gradient(135deg, #00e676, #00c853); color: #042111; box-shadow: 0 4px 18px rgba(0, 230, 118, 0.45); }
        .action-btn.loss { background: linear-gradient(135deg, #fb7185, #e11d48); color: #fff; box-shadow: 0 4px 18px rgba(225, 29, 72, 0.45); }
        .action-btn:disabled { opacity: 0.8; cursor: not-allowed; }
    </style>
</head>
<body>

    <canvas id="stars"></canvas>
    <div class="dark-overlay"></div>

    <div class="game-container">
        
        <!-- Шапка -->
        <div class="top-section">
            <div class="header">
                <button class="back-btn" onclick="goBack()">❮ Назад</button>
                <div class="balance-pill">
                    <span id="balanceDisplay">500</span> <img src="coins.png" alt="coins" class="coin-icon">
                </div>
            </div>

            <div class="game-info-bar">
                <div class="info-item">Ставка: 
                    <span class="info-val"><span id="infoBet">20</span> <img src="coins.png" class="coin-icon"></span>
                </div>
                <div class="info-item">Остаток: 
                    <span class="info-val"><span id="infoBalance">500</span> <img src="coins.png" class="coin-icon"></span>
                </div>
            </div>
        </div>

        <!-- 3D Кубики -->
        <div class="dice-stage">
            <span class="dice-stage-deco left" aria-hidden="true">🎲</span>
            <span class="dice-stage-deco right" aria-hidden="true">🎲</span>
            <div class="dice-stage-pill" id="diceStagePill">ЦЕЛЬ: ТОЧНО 7</div>
            <div class="die-container" id="die1">
                <div class="die-face face-1"><div class="dot"></div></div>
                <div class="die-face face-2"><div class="dot"></div><div class="dot"></div></div>
                <div class="die-face face-3"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                <div class="die-face face-4"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                <div class="die-face face-5"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                <div class="die-face face-6"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            </div>
            <div class="die-container" id="die2">
                <div class="die-face face-1"><div class="dot"></div></div>
                <div class="die-face face-2"><div class="dot"></div><div class="dot"></div></div>
                <div class="die-face face-3"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                <div class="die-face face-4"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                <div class="die-face face-5"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                <div class="die-face face-6"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            </div>
        </div>

        <!-- Панель управления -->
        <div class="controls">
            
            <div class="mode-tabs">
                <button class="mode-btn" id="btnModeUnder" onclick="setMode('under')">Меньше</button>
                <button class="mode-btn active" id="btnModeExact" onclick="setMode('exact')">Точно</button>
                <button class="mode-btn" id="btnModeOver" onclick="setMode('over')">Больше</button>
            </div>

            <!-- Сетка кнопок 2-12 -->
            <div class="target-grid" id="targetGrid">
                <!-- Генерируется через JS -->
            </div>

            <div class="multiplier-badge">
                <div class="mult-label" id="multDesc">ВЫБРАННЫЙ МНОЖИТЕЛЬ</div>
                <div class="mult-value" id="multDisplay">x0.00</div>
            </div>

            <div class="bet-options">
                <button class="bet-btn active" onclick="setBet(20, this)">20</button>
                <button class="bet-btn" onclick="setBet(50, this)">50</button>
                <button class="bet-btn" onclick="setBet(100, this)">100</button>
                <button class="bet-btn" onclick="setBet(200, this)">200</button>
            </div>

            <button class="action-btn" id="actionBtn" onclick="rollDice()">БРОСИТЬ КУБИКИ</button>

        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand(); tg.setHeaderColor('#050d1a'); tg.setBackgroundColor('#02050b');

        // Логика ставок и РТП
        let balance = parseInt(localStorage.getItem('vetruch_balance')) || 500;
        let bet = 20;
        let mode = 'exact'; // 'under', 'exact', 'over'
        let targetNum = 7;
        let currentMultiplier = 0.00;
        let isRolling = false;

        const MULTIPLIERS = {
            'exact': { 2:12.0, 3:10.0, 4:7.5, 5:5.5, 6:4.5, 7:3.5, 8:4.5, 9:5.5, 10:7.5, 11:10.0, 12:12.0 },
            'under': { 3:10.0, 4:8.0, 5:5.0, 6:3.2, 7:2.1, 8:1.6, 9:1.35, 10:1.18, 11:1.10, 12:1.07 },
            'over': { 2:1.07, 3:1.10, 4:1.18, 5:1.35, 6:1.6, 7:2.1, 8:3.2, 9:5.0, 10:8.0, 11:10.0 }
        };

        const balanceDisplay = document.getElementById('balanceDisplay');
        const infoBalance = document.getElementById('infoBalance');
        const infoBet = document.getElementById('infoBet');
        const betBtns = document.querySelectorAll('.bet-btn');
        
        const targetGrid = document.getElementById('targetGrid');
        const multDisplay = document.getElementById('multDisplay');
        const multDesc = document.getElementById('multDesc');
        const actionBtn = document.getElementById('actionBtn');
        const die1El = document.getElementById('die1');
        const die2El = document.getElementById('die2');

        updateBalanceUI();
        initNumberButtons();

        function goBack() {
            if (window.parent && window.parent !== window && typeof window.parent.closeGameModal === 'function') {
                window.parent.closeGameModal();
            } else if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }

        function updateBalanceUI() {
            balanceDisplay.textContent = balance;
            infoBalance.textContent = balance;
            localStorage.setItem('vetruch_balance', balance);
        }

        function setBet(amount, btn) {
            if(isRolling) return;
            bet = amount;
            infoBet.textContent = bet;
            betBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function initNumberButtons() {
            targetGrid.innerHTML = '';
            for(let i = 2; i <= 12; i++) {
                let btn = document.createElement('button');
                btn.className = 'target-btn';
                btn.textContent = i;
                btn.onclick = () => selectTarget(i);
                btn.id = `btnNum_${i}`;
                targetGrid.appendChild(btn);
            }
            updateModeUI();
        }

        function setMode(newMode) {
            if(isRolling) return;
            mode = newMode;
            
            document.getElementById('btnModeUnder').classList.remove('active');
            document.getElementById('btnModeExact').classList.remove('active');
            document.getElementById('btnModeOver').classList.remove('active');
            
            if(mode === 'under') {
                document.getElementById('btnModeUnder').classList.add('active');
                if(targetNum < 3) targetNum = 3; 
            } else if (mode === 'over') {
                document.getElementById('btnModeOver').classList.add('active');
                if(targetNum > 11) targetNum = 11; 
            } else {
                document.getElementById('btnModeExact').classList.add('active');
            }

            updateModeUI();
        }

        function selectTarget(num) {
            if(isRolling) return;
            targetNum = num;
            updateModeUI();
        }

        function updateModeUI() {
            for(let i = 2; i <= 12; i++) {
                let btn = document.getElementById(`btnNum_${i}`);
                btn.classList.remove('active');
                
                if (mode === 'under' && i === 2) btn.disabled = true;
                else if (mode === 'over' && i === 12) btn.disabled = true;
                else btn.disabled = false;
                
                if (i === targetNum) btn.classList.add('active');
            }

            currentMultiplier = MULTIPLIERS[mode][targetNum];
            multDisplay.textContent = 'x' + currentMultiplier.toFixed(2);
            
            let desc = '';
            if(mode === 'exact') desc = `ТОЧНО ${targetNum}`;
            if(mode === 'under') desc = `МЕНЬШЕ ${targetNum}`;
            if(mode === 'over') desc = `БОЛЬШЕ ${targetNum}`;
            multDesc.textContent = `МНОЖИТЕЛЬ НА: ${desc}`;
            const stagePill = document.getElementById('diceStagePill');
            if (stagePill) stagePill.textContent = `ЦЕЛЬ: ${desc} · x${currentMultiplier.toFixed(2)}`;
        }

        const diceRotations = {
            1: {x: 0, y: 0},
            2: {x: -90, y: 0},
            3: {x: 0, y: -90},
            4: {x: 0, y: 90},
            5: {x: 90, y: 0},
            6: {x: 180, y: 0}
        };

        function rollDice() {
            if(isRolling) return;
            if(balance < bet) { showAppAlert("Недостаточно монет!"); return; }

            if (window.VETRUCH_ECONOMY) {
                var check = VETRUCH_ECONOMY.checkAndUseAttempt('dice');
                if (!check.ok) {
                    VETRUCH_ECONOMY.showNoAttemptsOverlay('dice');
                    return;
                }
                VETRUCH_ECONOMY.updateBadgeUI('dice');
            }

            isRolling = true;
            balance -= bet;
            const expEarned = Math.floor(bet / 50);
            if (expEarned > 0) {
                let curXp = parseInt(localStorage.getItem('vetruch_user_xp') || '0', 10);
                localStorage.setItem('vetruch_user_xp', curXp + expEarned);
            }
            updateBalanceUI();

            actionBtn.className = 'action-btn';
            actionBtn.textContent = 'БРОСАЕМ...';
            actionBtn.disabled = true;

            document.querySelectorAll('.target-btn').forEach(b => b.disabled = true);

            let r1 = Math.floor(Math.random() * 6) + 1;
            let r2 = Math.floor(Math.random() * 6) + 1;
            let sum = r1 + r2;

            // Проверяем, победный ли это бросок
            let wouldWin = false;
            if (mode === 'exact' && sum === targetNum) wouldWin = true;
            else if (mode === 'under' && sum < targetNum) wouldWin = true;
            else if (mode === 'over' && sum > targetNum) wouldWin = true;

            // RTP 60% контроль: если бросок победный, но выпал 40% house edge (RTP 60%),
            // подбираем гарантированно проигрышную комбинацию кубиков
            if (wouldWin && Math.random() > 0.60) {
                for (let try1 = 1; try1 <= 6; try1++) {
                    for (let try2 = 1; try2 <= 6; try2++) {
                        let s = try1 + try2;
                        let w = (mode === 'exact' && s === targetNum) || (mode === 'under' && s < targetNum) || (mode === 'over' && s > targetNum);
                        if (!w) {
                            r1 = try1;
                            r2 = try2;
                            sum = s;
                            break;
                        }
                    }
                    let wNow = (mode === 'exact' && sum === targetNum) || (mode === 'under' && sum < targetNum) || (mode === 'over' && sum > targetNum);
                    if (!wNow) break;
                }
            }

            let spinX1 = 360 * 3 + diceRotations[r1].x;
            let spinY1 = 360 * 3 + diceRotations[r1].y;
            
            let spinX2 = 360 * 4 + diceRotations[r2].x; 
            let spinY2 = 360 * 4 + diceRotations[r2].y;

            die1El.style.transform = `rotateX(${spinX1}deg) rotateY(${spinY1}deg)`;
            die2El.style.transform = `rotateX(${spinX2}deg) rotateY(${spinY2}deg)`;

            setTimeout(() => { checkWin(sum); }, 1500);
        }

        function checkWin(resultSum) {
            let isWin = false;

            if (mode === 'exact' && resultSum === targetNum) isWin = true;
            else if (mode === 'under' && resultSum < targetNum) isWin = true;
            else if (mode === 'over' && resultSum > targetNum) isWin = true;

            actionBtn.disabled = false;
            
            if (isWin) {
                let winAmount = Math.floor(bet * currentMultiplier);
                balance += winAmount;
                updateBalanceUI();
                
                actionBtn.className = 'action-btn win';
                actionBtn.innerHTML = `ВЫИГРЫШ ${winAmount} <img src="coins.png" class="coin-icon"> (Выпало ${resultSum})`;
            } else {
                actionBtn.className = 'action-btn loss';
                actionBtn.textContent = `ВЫПАЛО ${resultSum}. ПРОИГРЫШ`;
            }

            isRolling = false;
            updateModeUI();

            setTimeout(() => {
                if(!isRolling) {
                    die1El.style.transition = 'none';
                    die2El.style.transition = 'none';
                    
                    let base1X = die1El.style.transform.match(/rotateX\((.*?)deg\)/)[1] % 360;
                    let base1Y = die1El.style.transform.match(/rotateY\((.*?)deg\)/)[1] % 360;
                    let base2X = die2El.style.transform.match(/rotateX\((.*?)deg\)/)[1] % 360;
                    let base2Y = die2El.style.transform.match(/rotateY\((.*?)deg\)/)[1] % 360;

                    die1El.style.transform = `rotateX(${base1X}deg) rotateY(${base1Y}deg)`;
                    die2El.style.transform = `rotateX(${base2X}deg) rotateY(${base2Y}deg)`;

                    setTimeout(() => {
                        die1El.style.transition = 'transform 1.5s cubic-bezier(0.1, 0.8, 0.2, 1)';
                        die2El.style.transition = 'transform 1.5s cubic-bezier(0.1, 0.8, 0.2, 1)';
                    }, 50);
                }
            }, 2000);
        }

        // ================= Анимация звезд =================
        const canvas = document.getElementById("stars");
        const ctx = canvas.getContext("2d");
        let stars = []; let w = 0; let h = 0;

        function resizeCanvas() {
            w = window.innerWidth; h = window.innerHeight;
            canvas.width = w; canvas.height = h;
            createStars();
        }
        function createStars() {
            stars = [];
            for (let i = 0; i < 70; i++) stars.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.2 + 0.2, s: Math.random() * 0.1 + 0.02, o: Math.random() * 0.5 + 0.2 });
        }
        function drawStars() {
            ctx.clearRect(0, 0, w, h);
            for (const star of stars) {
                ctx.beginPath(); ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(100, 200, 255, ${star.o})`; ctx.fill();
                star.y += star.s;
                if (star.y > h) { star.y = 0; star.x = Math.random() * w; }
            }
            requestAnimationFrame(drawStars);
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas(); drawStars();
    </script>
</body>
</html>
