<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetruch GiftBot</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --background: #151a22;
            --panel: #202b38;
            --button: #2d8cff;
            --text: #ffffff;
            --secondary: #9ca8b8;
            --active: #55b9ff;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family: Arial, sans-serif;
            padding-bottom: 92px;
        }

        .page {
            display: none;
            padding: 22px 20px 20px;
            animation: fadeIn 0.2s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            margin: 8px 0 8px;
            text-align: center;
            font-size: 30px;
        }

        h2 {
            margin: 8px 0 22px;
            text-align: center;
            font-size: 25px;
        }

        .subtitle {
            margin: 0 0 26px;
            color: var(--secondary);
            text-align: center;
            font-size: 17px;
        }

        .menu {
            display: grid;
            gap: 12px;
        }

        .main-button {
            width: 100%;
            padding: 17px;
            border: 0;
            border-radius: 15px;
            background: var(--button);
            color: white;
            font-size: 17px;
            font-weight: bold;
        }

        .card {
            margin-bottom: 12px;
            padding: 18px;
            border-radius: 16px;
            background: var(--panel);
            text-align: center;
        }

        .card-title {
            margin-bottom: 8px;
            font-size: 19px;
            font-weight: bold;
        }

        .card-text {
            color: var(--secondary);
            line-height: 1.4;
        }

        /* Нижняя панель */
        /* Плавающая нижняя панель */
.bottom-nav {
    position: fixed;
    z-index: 10;
    right: 4px;
    bottom: 10px;
    left: 4px;

    display: flex;
    align-items: center;
    justify-content: space-around;

    height: 64px;
    padding: 0 4px;

    border: 1px solid #314454;
    border-radius: 25px;

    background: #172936;
    box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);

    overflow: visible;
}

/* Отдельная вкладка */
.nav-button {
    position: relative;

    display: flex;
    flex: 1;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;

    height: 62px;
    padding: 4px 2px;

    border: 0;
    border-radius: 22px;

    background: transparent;
    color: #71808d;

    font-size: 11px;
    font-weight: normal;

    cursor: pointer;
    transition: all 0.2s ease;
}

/* Иконки */
.nav-button .icon {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 25px;
    height: 25px;

    color: #71808d;
    font-size: 21px;
    line-height: 1;
}

/* Активная вкладка */
.nav-button.active {
    z-index: 2;

    height: 62px;
    margin-top: -21px;

    border-radius: 50%;

    background: #ffe600;
    color: #14202a;

    font-weight: bold;

    box-shadow:
        0 0 0 5px #172936,
        0 4px 12px rgba(0, 0, 0, 0.4);
}

/* Жёлтый текст активной вкладки */
.nav-button.active .icon {
    color: #14202a;
}

.nav-button.active span:last-child {
    position: absolute;
    top: 67px;

    color: #ffe600;
    font-size: 11px;
    font-weight: bold;
    white-space: nowrap;
}

/* Немного увеличиваем иконку активной вкладки */
.nav-button.active .icon {
    font-size: 22px;
}

    </style>
</head>

<body>

    <!-- Главная -->
    <main id="home" class="page active">
        <h1>Vetruch GiftBot</h1>
        <p class="subtitle">Главное меню</p>

        <div class="menu">
            <button class="main-button" onclick="openPage('profile')">
                👤 Профиль
            </button>

            <button class="main-button" onclick="openPage('tasks')">
                📋 Задания
            </button>

            <button class="main-button" onclick="openPage('shop')">
                🛒 Магазин
            </button>

            <button class="main-button" onclick="openPage('games')">
                🎮 Игры
            </button>
        </div>
    </main>

    <!-- Игры -->
    <main id="games" class="page">
        <h2>🎮 Игры</h2>

        <div class="card">
            <div class="card-title">Игры скоро появятся</div>
            <div class="card-text">
                Здесь будут мини-игры и соревнования.
            </div>
        </div>
    </main>

    <!-- Задания -->
    <main id="tasks" class="page">
        <h2>📋 Задания</h2>

        <div class="card">
            <div class="card-title">Заданий пока нет</div>
            <div class="card-text">
                Новые задания появятся совсем скоро.
            </div>
        </div>
    </main>

    <!-- Магазин -->
    <main id="shop" class="page">
        <h2>🛒 Магазин</h2>

        <div class="card">
            <div class="card-title">Магазин пуст</div>
            <div class="card-text">
                Скоро здесь можно будет обменивать награды.
            </div>
        </div>
    </main>

    <!-- Профиль -->
    <main id="profile" class="page">
        <h2>👤 Профиль</h2>

        <div class="card">
            <div class="card-title" id="userName">Пользователь</div>
            <div class="card-text">
                ⭐ Баланс: 0<br>
                🏆 Уровень: 1
            </div>
        </div>
    </main>

    <!-- Нижняя панель вкладок -->
    <nav class="bottom-nav">
        <button class="nav-button active" data-page="home" onclick="openPage('home')">
            <span class="icon">⌂</span>
            <span>Главная</span>
        </button>

        <button class="nav-button" data-page="games" onclick="openPage('games')">
            <span class="icon">🎮</span>
            <span>Игры</span>
        </button>

        <button class="nav-button" data-page="tasks" onclick="openPage('tasks')">
            <span class="icon">☷</span>
            <span>Задания</span>
        </button>

        <button class="nav-button" data-page="shop" onclick="openPage('shop')">
            <span class="icon">🛍</span>
            <span>Магазин</span>
        </button>

        <button class="nav-button" data-page="profile" onclick="openPage('profile')">
            <span class="icon">♙</span>
            <span>Профиль</span>
        </button>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        // Получаем имя пользователя Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            const name = user.first_name || "Пользователь";

            document.getElementById("userName").textContent = name;
        }

        function openPage(pageId) {
            // Показываем выбранную страницу
            document.querySelectorAll(".page").forEach(function(page) {
                page.classList.remove("active");
            });

            document.getElementById(pageId).classList.add("active");

            // Подсвечиваем выбранную вкладку
            document.querySelectorAll(".nav-button").forEach(function(button) {
                button.classList.remove("active");
            });

            const activeButton = document.querySelector(
                '.nav-button[data-page="' + pageId + '"]'
            );

            if (activeButton) {
                activeButton.classList.add("active");
            }

            // Прокручиваем страницу наверх
            window.scrollTo(0, 0);
        }
    </script>

</body>
</html>
