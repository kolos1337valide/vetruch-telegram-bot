<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vetruch GiftBot</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --text: #ffffff;
            --secondary: #9aa8b8;
            --nav-bg: #172936;
            --nav-border: #304655;
            --active: #ffe600;
        }

        html,
        body {
            margin: 0;
            min-height: 100vh;
            background: #000000;
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        body {
            position: relative;
            overflow-x: hidden;
            padding-bottom: 105px;
        }

        /* Фон со звёздами */
        #stars {
            position: fixed;
            z-index: 0;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Затемнение поверх звёзд */
        .dark-overlay {
            position: fixed;
            z-index: 1;
            inset: 0;
            background: rgba(0, 0, 0, 0.18);
            pointer-events: none;
        }

        .page {
            position: relative;
            z-index: 2;
            display: none;
            min-height: calc(100vh - 105px);
            padding: 28px 20px 20px;
        }

        .page.active {
            display: block;
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 30px;
        }

        h2 {
            margin: 10px 0 24px;
            text-align: center;
            font-size: 26px;
        }

        .subtitle {
            margin: 0;
            color: #aab8c8;
            text-align: center;
            font-size: 17px;
        }

        .card {
            margin-bottom: 12px;
            padding: 20px;
            border: 1px solid rgba(100, 150, 180, 0.22);
            border-radius: 17px;
            background: rgba(23, 41, 54, 0.82);
            text-align: center;
        }

        .card-title {
            margin-bottom: 8px;
            font-size: 19px;
            font-weight: bold;
        }

        .card-text {
            color: var(--secondary);
            line-height: 1.5;
        }

        /* Плавающая нижняя панель */
        /* Нижняя плавающая панель */
.bottom-nav {
    position: fixed;
    z-index: 10;
    right: 5px;
    bottom: 10px;
    left: 5px;

    display: flex;
    align-items: center;
    justify-content: space-around;

    height: 64px;
    padding: 0 4px;

    border: 1px solid #202934;
    border-radius: 28px;

    background: rgba(8, 16, 22, 0.97);

    box-shadow:
        0 0 18px rgba(0, 0, 0, 0.65),
        inset 0 1px 1px rgba(255, 255, 255, 0.04);

    overflow: visible;
}

/* Кнопки вкладок */
.nav-button {
    position: relative;

    display: flex;
    flex: 1;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;

    height: 58px;
    padding: 4px 2px;

    border: 0;
    border-radius: 20px;

    background: transparent;
    color: #626a7d;

    font-family: Arial, sans-serif;
    font-size: 10px;
    font-weight: bold;

    cursor: pointer;
    transition: 0.2s ease;
}

/* Иконки */
.nav-button .icon {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 25px;
    height: 25px;

    color: #778096;
    font-size: 22px;
    line-height: 1;
}

/* Активная кнопка */
.nav-button.active {
    background: rgba(0, 213, 190, 0.14);
    color: #00d5be;

    box-shadow:
        inset 0 0 18px rgba(0, 213, 190, 0.12),
        0 0 12px rgba(0, 213, 190, 0.16);
}

.nav-button.active .icon {
    color: #00d5be;
    filter: drop-shadow(0 0 5px rgba(0, 213, 190, 0.65));
}

.nav-button.active span:last-child {
    color: #00d5be;
}

/* Убираем жёлтый цвет */
.nav-button.active::before {
    display: none;
}

    </style>
</head>

<body>

    <!-- Холст для падающих звёзд -->
    <canvas id="stars"></canvas>
    <div class="dark-overlay"></div>

    <!-- Главная страница без больших кнопок -->
   <main id="home" class="page active"></main>


    <!-- Игры -->
    <main id="games" class="page">
        <h2>🎮 Игры</h2>

        <div class="card">
            <div class="card-title">Игры скоро появятся</div>
            <div class="card-text">
                Здесь будут мини-игры и соревнования.
            </div>
        </div>
    </main>

    <!-- Задания -->
    <main id="tasks" class="page">
        <h2>📋 Задания</h2>

        <div class="card">
            <div class="card-title">Заданий пока нет</div>
            <div class="card-text">
                Новые задания появятся совсем скоро.
            </div>
        </div>
    </main>

    <!-- Магазин -->
    <main id="shop" class="page">
        <h2>🛒 Магазин</h2>

        <div class="card">
            <div class="card-title">Магазин пуст</div>
            <div class="card-text">
                Скоро здесь можно будет обменивать награды.
            </div>
        </div>
    </main>

    <!-- Профиль -->
    <main id="profile" class="page">
        <h2>👤 Профиль</h2>

        <div class="card">
            <div class="card-title" id="userName">Пользователь</div>

            <div class="card-text">
                ⭐ Баланс: 0<br>
                🏆 Уровень: 1
            </div>
        </div>
    </main>

    <!-- Нижняя панель -->
   <nav class="bottom-nav">
    <button class="nav-button active" data-page="home" onclick="openPage('home')">
        <span class="icon">⌂</span>
        <span>Главная</span>
    </button>

    <button class="nav-button" data-page="tasks" onclick="openPage('tasks')">
        <span class="icon">ϟ</span>
        <span>Задания</span>
    </button>

    <button class="nav-button" data-page="shop" onclick="openPage('shop')">
        <span class="icon">▣</span>
        <span>Магазин</span>
    </button>

    <button class="nav-button" data-page="games" onclick="openPage('games')">
        <span class="icon">♧</span>
        <span>Друзья</span>
    </button>

    <button class="nav-button" data-page="profile" onclick="openPage('profile')">
        <span class="icon">♙</span>
        <span>Профиль</span>
    </button>
</nav>


    <script>
        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        // Показываем имя пользователя Telegram в профиле
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById("userName").textContent =
                user.first_name || "Пользователь";
        }

        // Переключение вкладок
        function openPage(pageId) {
            document.querySelectorAll(".page").forEach(function(page) {
                page.classList.remove("active");
            });

            document.getElementById(pageId).classList.add("active");

            document.querySelectorAll(".nav-button").forEach(function(button) {
                button.classList.remove("active");
            });

            const activeButton = document.querySelector(
                '.nav-button[data-page="' + pageId + '"]'
            );

            if (activeButton) {
                activeButton.classList.add("active");
            }

            window.scrollTo(0, 0);
        }

        // Медленно падающие звёзды
        const canvas = document.getElementById("stars");
        const ctx = canvas.getContext("2d");

        let stars = [];
        let width = 0;
        let height = 0;

        function resizeCanvas() {
            const pixelRatio = window.devicePixelRatio || 1;

            width = window.innerWidth;
            height = window.innerHeight;

            canvas.width = width * pixelRatio;
            canvas.height = height * pixelRatio;
            canvas.style.width = width + "px";
            canvas.style.height = height + "px";

            ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

            createStars();
        }

        function createStars() {
            stars = [];

            // Количество точек зависит от размера экрана
            const amount = Math.min(130, Math.max(65, Math.floor(width / 3)));

            for (let i = 0; i < amount; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.2 + 0.25,
                    speed: Math.random() * 0.10 + 0.025,
                    opacity: Math.random() * 0.65 + 0.25
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, width, height);

            for (const star of stars) {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 255, 255, " + star.opacity + ")";
                ctx.fill();

                // Очень медленное движение вниз
                star.y += star.speed;

                // Когда звезда ушла вниз, возвращаем её наверх
                if (star.y > height + 3) {
                    star.y = -3;
                    star.x = Math.random() * width;
                }
            }

            requestAnimationFrame(drawStars);
        }

        window.addEventListener("resize", resizeCanvas);

        resizeCanvas();
        drawStars();
    </script>

</body>
</html>
