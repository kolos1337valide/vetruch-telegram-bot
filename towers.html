<!DOCTYPE html>
<html lang="ru">
<head>

<script src="vetruch-economy.js?v=6"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Башни · Шахта - Vetruch</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        :root {
            --bg: #02050b;
            --text: #ffffff;
            --blue-main: #00d9ff;
            --blue-glow: rgba(0, 136, 255, 0.55);
        }

        body {
            margin: 0;
            background:
                radial-gradient(circle at 50% 12%, #0e2a52 0%, #050f20 55%, #02050b 100%);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        #stars { position: fixed; z-index: 0; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        .dark-overlay {
            position: fixed;
            z-index: 1;
            inset: 0;
            background:
                repeating-linear-gradient(125deg, rgba(0, 170, 255, 0.025) 0px, rgba(0, 170, 255, 0.025) 2px, transparent 2px, transparent 22px),
                linear-gradient(180deg, rgba(5, 13, 26, 0.14) 0%, rgba(2, 5, 11, 0.86) 100%);
            pointer-events: none;
        }

        .game-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 14px 14px 30px 14px;
        }

        /* Верхняя панель */
        .top-section { display: flex; flex-direction: column; gap: 9px; width: 100%; z-index: 10; margin-bottom: 12px; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .back-btn {
            background: rgba(11, 24, 46, 0.88);
            border: 1px solid rgba(0, 217, 255, 0.28);
            color: #fff;
            height: 38px;
            padding: 0 13px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }
        .balance-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, rgba(0, 136, 255, 0.2), rgba(0, 217, 255, 0.1));
            color: #e0f7ff;
            padding: 7px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 15px;
            border: 1px solid rgba(0, 217, 255, 0.42);
            box-shadow: 0 0 16px rgba(0, 136, 255, 0.22);
        }
        .coin-icon { width: 17px; height: 17px; flex-shrink: 0; vertical-align: middle; }

        .game-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(9, 20, 38, 0.88);
            border: 1px solid rgba(0, 217, 255, 0.24);
            padding: 10px 14px;
            border-radius: 14px;
            backdrop-filter: blur(10px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
        }
        .info-item { font-size: 12.5px; color: #94b8db; display: flex; align-items: center; gap: 7px; }
        .info-val { font-size: 15px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 4px; }

        /* Сцена ШАХТЫ */
        .grid-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            flex: 1;
        }

        .tower-stage-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 13px;
            border-radius: 999px;
            background: rgba(8, 22, 46, 0.92);
            border: 1px solid rgba(0, 217, 255, 0.36);
            color: #93c5fd;
            font-size: 10.5px;
            font-weight: 800;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45), 0 0 14px rgba(0, 170, 255, 0.16);
        }
        .tower-stage-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #00e5ff;
            box-shadow: 0 0 8px #00e5ff;
        }

        .mine-shaft {
            width: 100%;
            max-width: 392px;
            position: relative;
            border-radius: 20px;
            padding: 10px 14px 12px 14px;
            background:
                radial-gradient(ellipse at 50% 8%, rgba(0, 175, 255, 0.16) 0%, transparent 55%),
                repeating-linear-gradient(160deg, rgba(16, 46, 86, 0.22) 0px, rgba(16, 46, 86, 0.22) 12px, rgba(5, 13, 27, 0.4) 12px, rgba(5, 13, 27, 0.4) 26px),
                linear-gradient(180deg, #091830 0%, #050d1d 55%, #030812 100%);
            border: 1.5px solid rgba(0, 217, 255, 0.34);
            box-shadow:
                inset 0 0 36px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(125, 211, 252, 0.2),
                0 16px 36px rgba(0, 0, 0, 0.7),
                0 0 24px rgba(0, 136, 255, 0.15);
            overflow: hidden;
        }

        /* Боковые опорные балки шахты */
        .mine-shaft::before,
        .mine-shaft::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            width: 8px;
            background: linear-gradient(90deg, #0e2444, #193b69, #09172c);
            border-right: 1px solid rgba(0, 217, 255, 0.28);
            border-left: 1px solid rgba(0, 217, 255, 0.2);
            pointer-events: none;
            z-index: 2;
        }
        .mine-shaft::before { left: 0; }
        .mine-shaft::after { right: 0; }

        .mine-shaft.shake {
            animation: mineShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97);
        }
        @keyframes mineShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(5px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(3px); }
        }

        .mine-summit-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            margin-bottom: 8px;
            border-radius: 10px;
            background: linear-gradient(90deg, rgba(0, 149, 255, 0.18), rgba(0, 229, 255, 0.08));
            border: 1px solid rgba(0, 217, 255, 0.32);
            font-size: 10px;
            font-weight: 800;
            color: #bae6fd;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            position: relative;
            z-index: 3;
        }
        .mine-summit-bar b { color: #00e5ff; font-weight: 900; }

        .towers-grid {
            display: flex;
            flex-direction: column-reverse;
            gap: 5px;
            width: 100%;
            position: relative;
            z-index: 3;
        }

        /* Этаж с настилом и лесенками */
        .tower-row {
            display: flex;
            align-items: stretch;
            gap: 8px;
            padding: 4px 6px 6px 6px;
            border-radius: 11px;
            background: rgba(7, 19, 38, 0.55);
            border: 1px solid rgba(0, 175, 255, 0.1);
            border-bottom: 3px solid #163661;
            box-shadow: inset 0 -2px 0 rgba(0, 217, 255, 0.16);
            opacity: 0.44;
            transition: opacity 0.25s ease, border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
            pointer-events: none;
            position: relative;
        }

        .tower-row.active {
            opacity: 1;
            pointer-events: auto;
            background: linear-gradient(90deg, rgba(0, 136, 255, 0.2) 0%, rgba(10, 30, 62, 0.9) 55%, rgba(0, 136, 255, 0.14) 100%);
            border-color: rgba(0, 217, 255, 0.52);
            border-bottom: 3px solid #00a8ff;
            box-shadow: 0 0 16px rgba(0, 170, 255, 0.24), inset 0 -2px 0 rgba(125, 211, 252, 0.4);
        }

        .tower-row.completed {
            opacity: 0.94;
            border-color: rgba(0, 230, 118, 0.26);
            border-bottom-color: rgba(0, 230, 118, 0.5);
        }

        .tower-row.failed {
            opacity: 0.95;
            border-color: rgba(244, 63, 94, 0.35);
            border-bottom-color: #e11d48;
        }

        .tower-mult-badge {
            width: 56px;
            min-height: 44px;
            background: rgba(0, 136, 255, 0.12);
            border: 1px solid rgba(0, 217, 255, 0.22);
            border-radius: 9px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            flex-shrink: 0;
            transition: all 0.25s ease;
        }
        .floor-num {
            font-size: 8.5px;
            font-weight: 800;
            color: #7da2c8;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }
        .floor-mult {
            font-size: 11.5px;
            font-weight: 900;
            color: #93c5fd;
        }

        .tower-row.active .tower-mult-badge {
            background: linear-gradient(135deg, rgba(0, 162, 255, 0.32), rgba(0, 217, 255, 0.2));
            border-color: #00e5ff;
            box-shadow: 0 0 12px rgba(0, 217, 255, 0.42);
            transform: scale(1.03);
        }
        .tower-row.active .floor-num { color: #bae6fd; }
        .tower-row.active .floor-mult { color: #ffffff; }

        .tower-row.completed .tower-mult-badge {
            background: rgba(0, 230, 118, 0.14);
            border-color: rgba(0, 230, 118, 0.48);
        }
        .tower-row.completed .floor-num { color: #86efac; }
        .tower-row.completed .floor-mult { color: #00e676; }

        .ladders-bay {
            display: flex;
            justify-content: space-around;
            align-items: stretch;
            gap: 7px;
            flex: 1;
        }

        /* Реалистичная синяя лесенка */
        .ladder-btn {
            flex: 1;
            max-width: 68px;
            height: 44px;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3px 6px;
            border-radius: 8px;
            background: rgba(5, 16, 36, 0.55);
            border: 1px solid rgba(56, 189, 248, 0.16);
            transition: transform 0.14s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .tower-row.active .ladder-btn:hover {
            background: rgba(0, 149, 255, 0.18);
            border-color: rgba(0, 229, 255, 0.65);
        }
        .tower-row.active .ladder-btn:active {
            transform: scale(0.93);
        }

        /* Боковые тетивы лесенки */
        .ladder-rail {
            position: absolute;
            top: 2px;
            bottom: 2px;
            width: 4px;
            border-radius: 3px;
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 60%, #0b3c70 100%);
            box-shadow: 0 0 6px rgba(56, 189, 248, 0.35);
            transition: all 0.25s ease;
        }
        .ladder-rail.left { left: 10px; }
        .ladder-rail.right { right: 10px; }

        .ladder-rungs {
            position: relative;
            width: calc(100% - 16px);
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            padding: 2px 0;
        }

        .ladder-rung {
            height: 3.5px;
            width: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, #0ea5e9, #7dd3fc, #0ea5e9);
            box-shadow: 0 1px 4px rgba(0, 170, 255, 0.45);
            transition: transform 0.28s ease, background 0.25s ease, opacity 0.25s ease;
            position: relative;
        }

        .ladder-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            line-height: 1;
            z-index: 4;
            pointer-events: none;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.85));
        }

        /* Подъём по лесенке */
        .ladder-btn.climbing .climber-spark {
            position: absolute;
            left: 50%;
            bottom: 2px;
            width: 14px;
            height: 14px;
            margin-left: -7px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 10%, #00e5ff 65%, transparent 100%);
            box-shadow: 0 0 14px #00e5ff, 0 0 24px #38bdf8;
            z-index: 5;
            animation: climberAscend 0.32s ease-out forwards;
        }
        @keyframes climberAscend {
            0% { bottom: 2px; opacity: 0.95; transform: scale(0.85); }
            65% { bottom: 24px; opacity: 1; transform: scale(1.15); }
            100% { bottom: 34px; opacity: 0.25; transform: scale(0.7); }
        }

        /* Пройденная целая лесенка */
        .ladder-btn.safe {
            background: linear-gradient(180deg, rgba(0, 229, 255, 0.26), rgba(0, 119, 255, 0.16));
            border-color: #00e5ff;
            box-shadow: 0 0 14px rgba(0, 217, 255, 0.42), inset 0 0 10px rgba(0, 229, 255, 0.25);
        }
        .ladder-btn.safe .ladder-rail {
            background: linear-gradient(180deg, #e0fbff 0%, #00e5ff 60%, #0284c7 100%);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.85);
        }
        .ladder-btn.safe .ladder-rung {
            background: linear-gradient(90deg, #00e5ff, #ffffff, #00e5ff);
        }

        /* Сломанная лесенка (поломка + анимация) */
        .ladder-btn.broken {
            background: linear-gradient(180deg, rgba(244, 63, 94, 0.3), rgba(159, 18, 57, 0.22));
            border-color: #fb7185;
            box-shadow: inset 0 0 14px rgba(244, 63, 94, 0.45), 0 0 14px rgba(244, 63, 94, 0.35);
        }
        .ladder-btn.broken .ladder-rail.left {
            background: linear-gradient(180deg, #fb7185, #be123c);
            transform: rotate(-8deg) translateY(2px);
        }
        .ladder-btn.broken .ladder-rail.right {
            background: linear-gradient(180deg, #fb7185, #be123c);
            transform: rotate(8deg) translateY(2px);
        }
        .ladder-btn.broken .ladder-rung:nth-child(1),
        .ladder-btn.broken .ladder-rung:nth-child(4) {
            background: #fda4af;
            opacity: 0.7;
        }
        .ladder-btn.broken .ladder-rung:nth-child(2) {
            background: #fb7185;
            width: 52%;
            transform-origin: left center;
            animation: snapLeft 0.36s ease forwards;
        }
        .ladder-btn.broken .ladder-rung:nth-child(3) {
            background: #f43f5e;
            width: 52%;
            margin-left: auto;
            transform-origin: right center;
            animation: snapRight 0.36s ease forwards;
        }

        @keyframes snapLeft {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(28deg) translateY(4px); }
        }
        @keyframes snapRight {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-28deg) translateY(4px); }
        }

        /* Подсветка сломанной лесенки после прохождения или конца игры */
        .ladder-btn.revealed-broken {
            background: rgba(244, 63, 94, 0.14);
            border-color: rgba(244, 63, 94, 0.45);
            opacity: 0.78;
        }
        .ladder-btn.revealed-broken .ladder-rail {
            background: linear-gradient(180deg, #fb7185, #881337);
        }
        .ladder-btn.revealed-broken .ladder-rung:nth-child(2) {
            width: 50%;
            transform: rotate(24deg) translateY(2px);
            background: #fb7185;
        }
        .ladder-btn.revealed-broken .ladder-rung:nth-child(3) {
            width: 50%;
            margin-left: auto;
            transform: rotate(-24deg) translateY(2px);
            background: #fb7185;
        }

        /* Управление ставкой */
        .controls {
            background: rgba(9, 20, 38, 0.9);
            border: 1px solid rgba(0, 217, 255, 0.25);
            border-radius: 20px;
            padding: 15px;
            margin-top: auto;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.65);
        }

        .bet-options { display: flex; gap: 8px; margin-bottom: 12px; }
        .bet-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 195, 255, 0.2);
            color: #fff;
            padding: 11px 12px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
            font-size: 14.5px;
        }
        .bet-btn.active {
            background: rgba(0, 170, 255, 0.22);
            border-color: #00d9ff;
            color: #7dd3fc;
            box-shadow: 0 0 12px rgba(0, 170, 255, 0.28);
        }
        .bet-btn:disabled { opacity: 0.5; pointer-events: none; }

        .action-btn {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            border: none;
            font-size: 15.5px;
            font-weight: 900;
            color: #ffffff;
            background: linear-gradient(135deg, #0095ff 0%, #005fd2 100%);
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 136, 255, 0.48), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .action-btn:active { transform: scale(0.97); }
        .action-btn.cashout { background: linear-gradient(135deg, #00e676, #00c853); color: #042111; box-shadow: 0 4px 18px rgba(0, 230, 118, 0.45); }
        .action-btn.bust { background: linear-gradient(135deg, #fb7185, #e11d48); color: #fff; box-shadow: 0 4px 18px rgba(225, 29, 72, 0.45); cursor: pointer; }
        .action-btn:disabled { background: #192538; color: #5b6e8a; box-shadow: none; pointer-events: none; }
    </style>
</head>
<body>

    <canvas id="stars"></canvas>
    <div class="dark-overlay"></div>

    <div class="game-container">
        <div class="top-section">
            <div class="header">
                <button class="back-btn" onclick="goBack()">❮ Назад</button>
                <div class="balance-pill">
                    <span id="balanceDisplay">500</span> <img src="coins.png" alt="coins" class="coin-icon">
                </div>
            </div>

            <div class="game-info-bar">
                <div class="info-item">Ставка:
                    <span class="info-val"><span id="infoBet">20</span> <img src="coins.png" class="coin-icon"></span>
                </div>
                <div class="info-item">Остаток:
                    <span class="info-val"><span id="infoBalance">500</span> <img src="coins.png" class="coin-icon"></span>
                </div>
            </div>
        </div>

        <!-- Синяя Шахта с Этажами и Лесенками -->
        <div class="grid-wrapper">
            <div class="tower-stage-badge">
                <span class="tower-stage-dot"></span>
                <span>ЛЕДЯНАЯ ШАХТА · 8 ЯРУСОВ</span>
            </div>

            <div class="mine-shaft" id="mineShaft">
                <div class="mine-summit-bar">
                    <span>💎 ВЕРШИНА ШАХТЫ</span>
                    <b>ДО x24.50</b>
                </div>
                <div class="towers-grid" id="grid">
                    <!-- Ярусы и лесенки генерируются через JS -->
                </div>
            </div>
        </div>

        <!-- Панель управления -->
        <div class="controls">
            <div class="bet-options">
                <button class="bet-btn active" onclick="setBet(20, this)">20</button>
                <button class="bet-btn" onclick="setBet(50, this)">50</button>
                <button class="bet-btn" onclick="setBet(100, this)">100</button>
                <button class="bet-btn" onclick="setBet(200, this)">200</button>
            </div>

            <button class="action-btn" id="actionBtn" onclick="handleAction()">НАЧАТЬ ПОДЪЁМ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand(); tg.setHeaderColor('#050d1a'); tg.setBackgroundColor('#02050b');

        let balance = parseInt(localStorage.getItem('vetruch_balance')) || 500;
        let bet = 20;

        let state = 'idle'; // idle, playing, finished
        let isClimbing = false;
        let currentRow = 0;
        let currentWin = 0;
        let brokenPositions = []; // индекс сломанной лесенки на каждом ярусе

        // 8 ярусов: на 1-3 по 4 лесенки, на 4-6 по 3 лесенки, на 7-8 по 2 лесенки (1 на ярусе всегда ломается)
        const ROW_COUNT = 8;
        const LADDERS_PER_ROW = [4, 4, 4, 3, 3, 3, 2, 2];
        const MULTIPLIERS = [1.28, 1.68, 2.20, 3.20, 4.65, 6.75, 12.80, 24.50];

        const gridEl = document.getElementById('grid');
        const mineShaft = document.getElementById('mineShaft');
        const actionBtn = document.getElementById('actionBtn');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const infoBalance = document.getElementById('infoBalance');
        const infoBet = document.getElementById('infoBet');
        const betBtns = document.querySelectorAll('.bet-btn');

        updateBalanceUI();
        drawInitialGrid();

        function goBack() {
            if (window.parent && window.parent !== window && typeof window.parent.closeGameModal === 'function') {
                window.parent.closeGameModal();
            } else if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }

        function updateBalanceUI() {
            balanceDisplay.textContent = balance;
            infoBalance.textContent = balance;
            localStorage.setItem('vetruch_balance', balance);
        }

        function setBet(amount, btn) {
            if (state === 'playing') return;
            bet = amount;
            infoBet.textContent = bet;
            betBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function buildLadderHTML() {
            return `
                <span class="ladder-rail left"></span>
                <span class="ladder-rail right"></span>
                <div class="ladder-rungs">
                    <span class="ladder-rung"></span>
                    <span class="ladder-rung"></span>
                    <span class="ladder-rung"></span>
                    <span class="ladder-rung"></span>
                </div>
                <span class="ladder-badge"></span>
            `;
        }

        function drawInitialGrid() {
            gridEl.innerHTML = '';
            for (let r = 0; r < ROW_COUNT; r++) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'tower-row';
                rowDiv.id = `row-${r}`;

                const multBadge = document.createElement('div');
                multBadge.className = 'tower-mult-badge';
                multBadge.innerHTML = `<span class="floor-num">ЯРУС ${r + 1}</span><span class="floor-mult">x${MULTIPLIERS[r].toFixed(2)}</span>`;
                rowDiv.appendChild(multBadge);

                const bayDiv = document.createElement('div');
                bayDiv.className = 'ladders-bay';

                const count = LADDERS_PER_ROW[r];
                for (let c = 0; c < count; c++) {
                    const ladder = document.createElement('div');
                    ladder.className = 'ladder-btn';
                    ladder.id = `cell-${r}-${c}`;
                    ladder.innerHTML = buildLadderHTML();
                    ladder.onclick = () => clickLadder(r, c);
                    bayDiv.appendChild(ladder);
                }

                rowDiv.appendChild(bayDiv);
                gridEl.appendChild(rowDiv);
            }
        }

        function handleAction() {
            if (state === 'idle' || state === 'finished') {
                startGame();
            } else if (state === 'playing' && !isClimbing && currentRow > 0) {
                cashout();
            }
        }

        function startGame() {
            if (balance < bet) {
                showAppAlert("Недостаточно монет!");
                return;
            }

            if (window.VETRUCH_ECONOMY) {
                var check = VETRUCH_ECONOMY.checkAndUseAttempt('towers');
                if (!check.ok) {
                    VETRUCH_ECONOMY.showNoAttemptsOverlay('towers');
                    return;
                }
                VETRUCH_ECONOMY.updateBadgeUI('towers');
            }

            balance -= bet;
            const expEarned = Math.floor(bet / 50);
            if (expEarned > 0) {
                let curXp = parseInt(localStorage.getItem('vetruch_user_xp') || '0', 10);
                localStorage.setItem('vetruch_user_xp', curXp + expEarned);
            }
            updateBalanceUI();

            state = 'playing';
            isClimbing = false;
            currentRow = 0;
            currentWin = 0;
            brokenPositions = [];
            if (mineShaft) mineShaft.classList.remove('shake');

            betBtns.forEach(b => b.disabled = true);
            actionBtn.classList.remove('cashout', 'bust');
            actionBtn.style.background = '#1e2c44';
            actionBtn.style.color = '#7da2c8';
            actionBtn.innerHTML = 'ВЫБЕРИТЕ ЛЕСЕНКУ';
            actionBtn.disabled = true;

            // На каждом ярусе одна лесенка хрупкая (подломлена)
            for (let r = 0; r < ROW_COUNT; r++) {
                brokenPositions.push(Math.floor(Math.random() * LADDERS_PER_ROW[r]));
            }

            // Очищаем лесенки
            for (let r = 0; r < ROW_COUNT; r++) {
                const rowEl = document.getElementById(`row-${r}`);
                rowEl.className = 'tower-row';
                const count = LADDERS_PER_ROW[r];
                for (let c = 0; c < count; c++) {
                    const ladderEl = document.getElementById(`cell-${r}-${c}`);
                    ladderEl.className = 'ladder-btn';
                    ladderEl.innerHTML = buildLadderHTML();
                }
            }

            document.getElementById('row-0').classList.add('active');
        }

        function clickLadder(r, c) {
            if (state !== 'playing' || isClimbing || r !== currentRow) return;
            isClimbing = true;

            const clickedLadder = document.getElementById(`cell-${r}-${c}`);
            const spark = document.createElement('span');
            spark.className = 'climber-spark';
            clickedLadder.appendChild(spark);
            clickedLadder.classList.add('climbing');

            let isBroken = (brokenPositions[r] === c);

            // RTP 60% контроль: при безопасной лесенке с вероятностью house edge она подламывается под игроком
            if (!isBroken && Math.random() > 0.60) {
                isBroken = true;
                brokenPositions[r] = c;
            }

            setTimeout(() => {
                if (state !== 'playing') {
                    isClimbing = false;
                    return;
                }
                spark.remove();
                clickedLadder.classList.remove('climbing');

                const badge = clickedLadder.querySelector('.ladder-badge');

                if (isBroken) {
                    clickedLadder.classList.add('broken');
                    if (badge) badge.textContent = '💥';
                    document.getElementById(`row-${r}`).classList.add('failed');
                    if (mineShaft) {
                        mineShaft.classList.remove('shake');
                        void mineShaft.offsetWidth;
                        mineShaft.classList.add('shake');
                    }
                    isClimbing = false;
                    loseGame();
                } else {
                    clickedLadder.classList.add('safe');
                    if (badge) badge.textContent = '⛏️';

                    // Показать, какая лесенка на этом ярусе была сломана
                    const badIdx = brokenPositions[r];
                    if (badIdx !== c) {
                        const badEl = document.getElementById(`cell-${r}-${badIdx}`);
                        if (badEl) {
                            badEl.classList.add('revealed-broken');
                            const bBadge = badEl.querySelector('.ladder-badge');
                            if (bBadge) bBadge.textContent = '⚠️';
                        }
                    }

                    document.getElementById(`row-${r}`).classList.remove('active');
                    document.getElementById(`row-${r}`).classList.add('completed');

                    currentWin = Math.floor(bet * MULTIPLIERS[r]);
                    currentRow++;
                    isClimbing = false;

                    if (currentRow >= ROW_COUNT) {
                        cashout();
                    } else {
                        document.getElementById(`row-${currentRow}`).classList.add('active');
                        actionBtn.disabled = false;
                        actionBtn.className = 'action-btn cashout';
                        actionBtn.innerHTML = `ЗАБРАТЬ ${currentWin} <img src="coins.png" class="coin-icon">`;
                        actionBtn.style.background = '';
                        actionBtn.style.color = '';
                    }
                }
            }, 300);
        }

        function cashout() {
            if (currentRow === 0 || state !== 'playing') return;

            balance += currentWin;
            updateBalanceUI();

            actionBtn.className = 'action-btn cashout';
            actionBtn.innerHTML = `ДОБЫЧА +${currentWin}! ИГРАТЬ СНОВА`;
            actionBtn.style.background = '';

            revealBrokenLadders();
            state = 'finished';
            betBtns.forEach(b => b.disabled = false);

            if (currentRow < ROW_COUNT) {
                document.getElementById(`row-${currentRow}`).classList.remove('active');
            }
        }

        function loseGame() {
            actionBtn.className = 'action-btn bust';
            actionBtn.innerHTML = 'ЛЕСЕНКА СЛОМАЛАСЬ! СНОВА';
            actionBtn.style.background = '';
            actionBtn.disabled = false;

            document.getElementById(`row-${currentRow}`).classList.remove('active');
            revealBrokenLadders();

            state = 'finished';
            betBtns.forEach(b => b.disabled = false);
        }

        function revealBrokenLadders() {
            for (let r = currentRow; r < ROW_COUNT; r++) {
                const badCol = brokenPositions[r];
                const ladder = document.getElementById(`cell-${r}-${badCol}`);
                if (ladder && !ladder.classList.contains('broken')) {
                    ladder.classList.add('revealed-broken');
                    const badge = ladder.querySelector('.ladder-badge');
                    if (badge) badge.textContent = '⚠️';
                }
            }
        }

        // ================= Анимация звезд и кристальной пыли =================
        const canvas = document.getElementById("stars");
        const ctx = canvas.getContext("2d");
        let stars = []; let w = 0; let h = 0;

        function resizeCanvas() {
            w = window.innerWidth; h = window.innerHeight;
            canvas.width = w; canvas.height = h;
            createStars();
        }
        function createStars() {
            stars = [];
            for (let i = 0; i < 70; i++) stars.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.2 + 0.2, s: Math.random() * 0.1 + 0.02, o: Math.random() * 0.5 + 0.2 });
        }
        function drawStars() {
            ctx.clearRect(0, 0, w, h);
            for (const star of stars) {
                ctx.beginPath(); ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(100, 200, 255, ${star.o})`; ctx.fill();
                star.y += star.s;
                if (star.y > h) { star.y = 0; star.x = Math.random() * w; }
            }
            requestAnimationFrame(drawStars);
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas(); drawStars();
    </script>
</body>
</html>
