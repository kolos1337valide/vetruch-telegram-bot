<!DOCTYPE html>
<html lang="ru">
<head>

<script src="vetruch-economy.js?v=6"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Башни - Vetruch</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        :root {
            --bg: #02050b; --text: #ffffff;
            --blue-main: #00d9ff; --blue-glow: rgba(0, 136, 255, 0.55);
            --cell-bg: linear-gradient(180deg, #162944 0%, #0b1628 100%);
            --cell-safe: linear-gradient(145deg, rgba(0, 217, 255, 0.26), rgba(0, 136, 255, 0.18));
            --cell-mine: linear-gradient(145deg, rgba(244, 63, 94, 0.3), rgba(159, 18, 57, 0.2));
        }
        
        body { 
            margin: 0;
            background: radial-gradient(circle at 50% 18%, #0d2444 0%, #050d1a 58%, #02050b 100%);
            color: var(--text); 
            min-height: 100vh; overflow-x: hidden; overflow-y: auto; 
        }

        #stars { position: fixed; z-index: 0; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        .dark-overlay { position: fixed; z-index: 1; inset: 0; background: linear-gradient(180deg, rgba(5,13,26,0.12) 0%, rgba(2,5,11,0.8) 100%); pointer-events: none; }

        .game-container { 
            position: relative; z-index: 2; display: flex; flex-direction: column; 
            min-height: 100vh; padding: 15px 16px 40px 16px; 
        }

        /* Верхняя панель */
        .top-section { display: flex; flex-direction: column; gap: 10px; width: 100%; z-index: 10; margin-bottom: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .back-btn { background: rgba(11, 24, 46, 0.88); border: 1px solid rgba(0, 217, 255, 0.28); color: #fff; height: 40px; padding: 0 14px; border-radius: 12px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer; backdrop-filter: blur(8px); }
        .balance-pill { display: flex; align-items: center; gap: 6px; background: linear-gradient(135deg, rgba(0, 136, 255, 0.2), rgba(0, 217, 255, 0.1)); color: #e0f7ff; padding: 8px 16px; border-radius: 20px; font-weight: 800; font-size: 16px; border: 1px solid rgba(0, 217, 255, 0.42); box-shadow: 0 0 16px rgba(0, 136, 255, 0.22); }
        .coin-icon { width: 18px; height: 18px; flex-shrink: 0; vertical-align: middle; }

        .game-info-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(9, 20, 38, 0.88); border: 1px solid rgba(0, 217, 255, 0.24);
            padding: 12px 16px; border-radius: 14px;
            backdrop-filter: blur(10px); box-shadow: 0 6px 20px rgba(0,0,0,0.45);
        }
        .info-item { font-size: 13px; color: #94b8db; display: flex; align-items: center; gap: 8px; }
        .info-val { font-size: 16px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 4px; }

        /* Игровое поле БАШНИ */
        .grid-wrapper { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; margin-bottom: 18px; flex: 1; }
        .tower-stage-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(9, 22, 44, 0.88);
            border: 1px solid rgba(0, 217, 255, 0.34);
            color: #93c5fd;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45), 0 0 14px rgba(0, 170, 255, 0.16);
        }
        .tower-stage-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #00e5ff;
            box-shadow: 0 0 8px #00e5ff;
        }
        
        .towers-grid { 
            display: flex; 
            flex-direction: column-reverse;
            gap: 8px; 
            width: 100%; 
            max-width: 380px; 
            margin: 0 auto;
            background: linear-gradient(180deg, rgba(11, 26, 50, 0.78) 0%, rgba(7, 15, 29, 0.92) 100%);
            border: 1.5px solid rgba(0, 217, 255, 0.3);
            border-radius: 18px;
            padding: 12px 10px;
            position: relative;
            box-shadow: inset 0 1px 0 rgba(120, 215, 255, 0.18), 0 12px 30px rgba(0, 0, 0, 0.58), 0 0 22px rgba(0, 136, 255, 0.14);
        }
        .towers-grid::before {
            content: "";
            position: absolute;
            top: 0;
            left: 22px;
            right: 22px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00e5ff, transparent);
            opacity: 0.65;
            pointer-events: none;
        }

        .tower-row {
            display: flex;
            gap: 8px;
            align-items: center;
            opacity: 0.42;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .tower-row.active {
            opacity: 1;
            pointer-events: auto;
        }
        
        .tower-row.completed {
            opacity: 0.92;
        }

        .tower-mult-badge {
            width: 52px;
            height: 42px;
            background: rgba(0, 136, 255, 0.08);
            border: 1px solid rgba(0, 217, 255, 0.18);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            color: #93c5fd;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .tower-row.active .tower-mult-badge {
            background: rgba(0, 170, 255, 0.24);
            border-color: #00d9ff;
            color: #ffffff;
            box-shadow: 0 0 14px rgba(0, 170, 255, 0.42);
            transform: scale(1.05);
        }

        .tower-row.completed .tower-mult-badge {
            color: #00e676;
            background: rgba(0, 230, 118, 0.14);
            border-color: rgba(0, 230, 118, 0.45);
        }

        .tower-cells {
            display: flex;
            gap: 8px;
            flex: 1;
        }

        .cell { 
            background: var(--cell-bg); 
            border-radius: 10px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 22px; 
            cursor: pointer; 
            border: 1px solid rgba(0, 195, 255, 0.18); 
            box-shadow: inset 0 1px 0 rgba(186, 230, 253, 0.16), inset 0 -3px 0 rgba(0, 0, 0, 0.55), 0 4px 10px rgba(0,0,0,0.45);
            transition: all 0.2s ease;
            flex: 1;
            height: 42px;
        }
        
        .tower-row.active .cell { border-color: rgba(0, 217, 255, 0.42); }
        .tower-row.active .cell:active { transform: scale(0.92); }

        .cell.safe { 
            background: var(--cell-safe); border: 1px solid #00d9ff; 
            box-shadow: inset 0 0 16px rgba(0, 217, 255, 0.34), 0 0 12px rgba(0, 170, 255, 0.24); 
            animation: pop 0.4s ease forwards; 
        }
        .cell.mine { 
            background: var(--cell-mine); border: 1px solid #f43f5e; 
            box-shadow: inset 0 0 16px rgba(244, 63, 94, 0.45); 
            animation: shake 0.4s ease forwards; 
        }

        @keyframes pop { 
            0% { transform: scale(0.8); opacity: 0; } 
            50% { transform: scale(1.1); } 
            100% { transform: scale(1); opacity: 1; } 
        }
        @keyframes shake { 
            0%, 100% { transform: translateX(0); } 
            25% { transform: translateX(-4px); } 
            75% { transform: translateX(4px); } 
        }

        /* Управление ставкой */
        .controls { background: rgba(9, 20, 38, 0.9); border: 1px solid rgba(0, 217, 255, 0.25); border-radius: 20px; padding: 18px; margin-top: auto; backdrop-filter: blur(10px); box-shadow: 0 10px 26px rgba(0,0,0,0.65); }
        
        .bet-options { display: flex; gap: 8px; margin-bottom: 15px; }
        .bet-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(0, 195, 255, 0.2); color: #fff; padding: 12px 14px; border-radius: 10px; font-weight: 800; cursor: pointer; transition: 0.2s; flex: 1; font-size: 15px;}
        .bet-btn.active { background: rgba(0, 170, 255, 0.22); border-color: #00d9ff; color: #7dd3fc; box-shadow: 0 0 12px rgba(0, 170, 255, 0.28); }
        .bet-btn:disabled { opacity: 0.5; pointer-events: none; }

        .action-btn { 
            width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 16px; font-weight: 900; 
            color: #ffffff; background: linear-gradient(135deg, #0095ff 0%, #005fd2 100%); cursor: pointer; 
            box-shadow: 0 4px 20px rgba(0, 136, 255, 0.48), inset 0 1px 0 rgba(255,255,255,0.3); transition: 0.2s; 
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .action-btn:active { transform: scale(0.97); }
        
        .action-btn.cashout { background: linear-gradient(135deg, #00e676, #00c853); color: #042111; box-shadow: 0 4px 18px rgba(0, 230, 118, 0.45); }
        .action-btn.bust { background: linear-gradient(135deg, #fb7185, #e11d48); color: #fff; box-shadow: 0 4px 18px rgba(225, 29, 72, 0.45); cursor: pointer; }
        .action-btn:disabled { background: #192538; color: #5b6e8a; box-shadow: none; pointer-events: none; }
    </style>
</head>
<body>

    <canvas id="stars"></canvas>
    <div class="dark-overlay"></div>

    <div class="game-container">
        
        <div class="top-section">
            <div class="header">
                <button class="back-btn" onclick="goBack()">❮ Назад</button>
                <div class="balance-pill">
                    <span id="balanceDisplay">500</span> <img src="coins.png" alt="coins" class="coin-icon">
                </div>
            </div>

            <div class="game-info-bar">
                <div class="info-item">Ставка: 
                    <span class="info-val"><span id="infoBet">20</span> <img src="coins.png" class="coin-icon"></span>
                </div>
                <div class="info-item">Остаток: 
                    <span class="info-val"><span id="infoBalance">500</span> <img src="coins.png" class="coin-icon"></span>
                </div>
            </div>
        </div>

        <!-- Сетка Башни -->
        <div class="grid-wrapper">
            <div class="tower-stage-badge">
                <span class="tower-stage-dot"></span>
                <span>КИБЕР-БАШНЯ · 9 ЭТАЖЕЙ</span>
            </div>
            <div class="towers-grid" id="grid">
                <!-- Ряды генерируются через JS -->
            </div>
        </div>

        <!-- Панель управления -->
        <div class="controls">
            <div class="bet-options">
                <button class="bet-btn active" onclick="setBet(20, this)">20</button>
                <button class="bet-btn" onclick="setBet(50, this)">50</button>
                <button class="bet-btn" onclick="setBet(100, this)">100</button>
                <button class="bet-btn" onclick="setBet(200, this)">200</button>
            </div>

            <button class="action-btn" id="actionBtn" onclick="handleAction()">НАЧАТЬ ИГРУ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand(); tg.setHeaderColor('#050d1a'); tg.setBackgroundColor('#02050b');

        let balance = parseInt(localStorage.getItem('vetruch_balance')) || 500;
        let bet = 20;
        
        let state = 'idle'; // idle, playing, finished
        let currentRow = 0;
        let currentWin = 0;
        let bombPositions = []; // массив позиций бомб для каждого ряда (0, 1 или 2)

        // Настройки 8 рядов. Множители настроены так, чтобы держать баланс.
        const ROW_COUNT = 8;
        const COLS_PER_ROW = 3;
        const MULTIPLIERS = [1.35, 1.82, 2.45, 3.30, 4.45, 6.00, 8.10, 10.93];

        const gridEl = document.getElementById('grid');
        const actionBtn = document.getElementById('actionBtn');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const infoBalance = document.getElementById('infoBalance');
        const infoBet = document.getElementById('infoBet');
        const betBtns = document.querySelectorAll('.bet-btn');

        updateBalanceUI();
        drawInitialGrid();

        function goBack() {
            if (window.parent && window.parent !== window && typeof window.parent.closeGameModal === 'function') {
                window.parent.closeGameModal();
            } else if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }

        function updateBalanceUI() {
            balanceDisplay.textContent = balance;
            infoBalance.textContent = balance;
            localStorage.setItem('vetruch_balance', balance);
        }

        function setBet(amount, btn) {
            if(state === 'playing') return;
            bet = amount;
            infoBet.textContent = bet;
            betBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function drawInitialGrid() {
            gridEl.innerHTML = '';
            for(let r = 0; r < ROW_COUNT; r++) {
                let rowDiv = document.createElement('div');
                rowDiv.className = 'tower-row';
                rowDiv.id = `row-${r}`;
                
                let multBadge = document.createElement('div');
                multBadge.className = 'tower-mult-badge';
                multBadge.textContent = 'x' + MULTIPLIERS[r].toFixed(2);
                rowDiv.appendChild(multBadge);

                let cellsDiv = document.createElement('div');
                cellsDiv.className = 'tower-cells';

                for(let c = 0; c < COLS_PER_ROW; c++) {
                    let cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `cell-${r}-${c}`;
                    // Клик привязан только к состоянию активного ряда
                    cell.onclick = () => clickCell(r, c);
                    cellsDiv.appendChild(cell);
                }
                rowDiv.appendChild(cellsDiv);
                gridEl.appendChild(rowDiv);
            }
        }

        function handleAction() {
            if (state === 'idle' || state === 'finished') {
                startGame();
            } else if (state === 'playing' && currentRow > 0) {
                cashout();
            }
        }

        function startGame() {
            if (balance < bet) { showAppAlert("Недостаточно монет!"); return; }

            if (window.VETRUCH_ECONOMY) {
                var check = VETRUCH_ECONOMY.checkAndUseAttempt('towers');
                if (!check.ok) {
                    VETRUCH_ECONOMY.showNoAttemptsOverlay('towers');
                    return;
                }
                VETRUCH_ECONOMY.updateBadgeUI('towers');
            }

            balance -= bet;
            const expEarned = Math.floor(bet / 50);
            if (expEarned > 0) {
                let curXp = parseInt(localStorage.getItem('vetruch_user_xp') || '0', 10);
                localStorage.setItem('vetruch_user_xp', curXp + expEarned);
            }
            updateBalanceUI();
            
            state = 'playing';
            currentRow = 0;
            currentWin = 0;
            bombPositions = [];

            betBtns.forEach(b => b.disabled = true);
            actionBtn.classList.remove('cashout', 'bust');
            actionBtn.style.background = '#2a2d35';
            actionBtn.style.color = '#888';
            actionBtn.innerHTML = 'ВЫБЕРИТЕ БЛОК';
            actionBtn.disabled = true;

            // Генерируем бомбы: для каждого из 8 рядов выбираем 1 мину из 3 ячеек
            for(let r = 0; r < ROW_COUNT; r++) {
                bombPositions.push(Math.floor(Math.random() * COLS_PER_ROW));
            }

            // Очищаем сетку визуально
            for(let r = 0; r < ROW_COUNT; r++) {
                let rowEl = document.getElementById(`row-${r}`);
                rowEl.className = 'tower-row';
                for(let c = 0; c < COLS_PER_ROW; c++) {
                    let cellEl = document.getElementById(`cell-${r}-${c}`);
                    cellEl.className = 'cell';
                    cellEl.innerHTML = '';
                }
            }

            // Активируем нулевой ряд
            document.getElementById(`row-0`).classList.add('active');
        }

        function clickCell(r, c) {
            if (state !== 'playing' || r !== currentRow) return;

            let isBomb = (bombPositions[r] === c);

            // RTP 60% контроль: если ячейка была безопасной, но выпал перевес дома 40% (RTP 60%),
            // подставляем бомбу в выбранную позицию
            if (!isBomb && Math.random() > 0.60) {
                isBomb = true;
                bombPositions[r] = c;
            }

            let clickedCell = document.getElementById(`cell-${r}-${c}`);

            if (isBomb) {
                clickedCell.classList.add('mine');
                clickedCell.innerHTML = '💣';
                loseGame();
            } else {
                clickedCell.classList.add('safe');
                clickedCell.innerHTML = '💎';
                
                document.getElementById(`row-${r}`).classList.remove('active');
                document.getElementById(`row-${r}`).classList.add('completed');
                
                currentWin = Math.floor(bet * MULTIPLIERS[r]);
                currentRow++;

                if (currentRow >= ROW_COUNT) {
                    cashout(); // Прошел всю башню
                } else {
                    document.getElementById(`row-${currentRow}`).classList.add('active');
                    
                    actionBtn.disabled = false;
                    actionBtn.className = 'action-btn cashout';
                    actionBtn.innerHTML = `ЗАБРАТЬ ${currentWin} <img src="coins.png" class="coin-icon">`;
                    actionBtn.style.background = ''; // сброс кастомного
                    actionBtn.style.color = '';
                }
            }
        }

        function cashout() {
            if (currentRow === 0 || state !== 'playing') return;
            
            balance += currentWin;
            updateBalanceUI();
            
            actionBtn.className = 'action-btn cashout';
            actionBtn.innerHTML = `ВЫИГРЫШ ${currentWin}! ИГРАТЬ СНОВА`;
            actionBtn.style.background = '';
            
            revealBombs();
            state = 'finished';
            betBtns.forEach(b => b.disabled = false);
            
            if (currentRow < ROW_COUNT) {
                document.getElementById(`row-${currentRow}`).classList.remove('active');
            }
        }

        function loseGame() {
            actionBtn.className = 'action-btn bust';
            actionBtn.innerHTML = 'ПРОИГРЫШ! ИГРАТЬ СНОВА';
            actionBtn.style.background = '';
            actionBtn.disabled = false;
            
            document.getElementById(`row-${currentRow}`).classList.remove('active');
            revealBombs();
            
            state = 'finished';
            betBtns.forEach(b => b.disabled = false);
        }

        function revealBombs() {
            // Показываем бомбы в рядах, которые игрок не прошел или на которых проиграл
            for(let r = currentRow; r < ROW_COUNT; r++) {
                let bombCol = bombPositions[r];
                let cell = document.getElementById(`cell-${r}-${bombCol}`);
                if (!cell.classList.contains('mine')) {
                    cell.innerHTML = '💣';
                    cell.style.opacity = '0.5'; // Тусклая бомба
                }
            }
        }

        // ================= Анимация звезд =================
        const canvas = document.getElementById("stars");
        const ctx = canvas.getContext("2d");
        let stars = []; let w = 0; let h = 0;

        function resizeCanvas() {
            w = window.innerWidth; h = window.innerHeight;
            canvas.width = w; canvas.height = h;
            createStars();
        }
        function createStars() {
            stars = [];
            for (let i = 0; i < 70; i++) stars.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.2 + 0.2, s: Math.random() * 0.1 + 0.02, o: Math.random() * 0.5 + 0.2 });
        }
        function drawStars() {
            ctx.clearRect(0, 0, w, h);
            for (const star of stars) {
                ctx.beginPath(); ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(100, 200, 255, ${star.o})`; ctx.fill();
                star.y += star.s;
                if (star.y > h) { star.y = 0; star.x = Math.random() * w; }
            }
            requestAnimationFrame(drawStars);
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas(); drawStars();
    </script>
</body>
</html>
