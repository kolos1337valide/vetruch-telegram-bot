<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Стройка Башни - Vetruch</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        :root {
            --bg: #000000; --text: #ffffff;
            --blue-main: #00d9ff; --blue-glow: rgba(0, 217, 255, 0.6);
        }
        
        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            min-height: 100vh; overflow-x: hidden; overflow-y: hidden; /* Запрещаем скролл для аркады */
            display: flex; flex-direction: column;
        }

        #stars { position: fixed; z-index: 0; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        .dark-overlay { position: fixed; z-index: 1; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%); pointer-events: none; }

        .game-container { 
            position: relative; z-index: 2; display: flex; flex-direction: column; 
            height: 100vh; padding: 15px 16px 20px 16px; justify-content: space-between;
        }

        /* Верхняя панель */
        .top-section { display: flex; flex-direction: column; gap: 10px; width: 100%; z-index: 10; flex-shrink: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .back-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; height: 40px; padding: 0 14px; border-radius: 12px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .balance-pill { display: flex; align-items: center; gap: 6px; background: rgba(0, 136, 255, 0.15); padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 16px; border: 1px solid rgba(0, 136, 255, 0.3); }
        .coin-icon { width: 18px; height: 18px; flex-shrink: 0; vertical-align: middle; }

        .game-info-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(20, 22, 28, 0.85); border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 16px; border-radius: 14px;
            backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .info-item { font-size: 13px; color: #8c97a7; display: flex; align-items: center; gap: 8px; }
        .info-val { font-size: 16px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 4px; }

        /* ИГРОВАЯ СЦЕНА (Кран и лесенка) */
        .arcade-stage {
            display: flex;
            flex: 1;
            margin: 10px 0;
            position: relative;
            background: radial-gradient(circle at 50% 50%, rgba(0, 136, 255, 0.05) 0%, rgba(0,0,0,0) 80%);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            overflow: hidden;
        }

        /* Зона стройки (Слева) */
        .build-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* Контейнер башни (двигается вниз при постройке) */
        .tower-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            width: 100%;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Дизайн неонового блока */
        .building-block {
            position: absolute;
            width: 100px;
            height: 35px;
            background: rgba(0, 30, 60, 0.8);
            border: 2px solid var(--blue-main);
            border-radius: 4px;
            box-shadow: 0 0 10px var(--blue-glow), inset 0 0 8px rgba(0, 217, 255, 0.3);
            margin-left: -50px; /* Центрирование от left: 50% */
            display: flex;
            align-items: center;
            justify-content: space-evenly;
        }
        /* Окошки в блоке */
        .building-block::before, .building-block::after {
            content: '';
            width: 25px; height: 15px;
            background: rgba(0, 217, 255, 0.15);
            border: 1px solid rgba(0, 217, 255, 0.4);
            border-radius: 2px;
        }

        .base-block {
            bottom: 0;
            left: 50%;
            background: rgba(0, 100, 255, 0.2);
            border-color: rgba(0, 136, 255, 0.6);
            width: 120px;
            margin-left: -60px;
        }

        /* Кран с блоком */
        .crane-system {
            position: absolute;
            top: 0;
            left: 50%;
            height: 100px;
            width: 100px;
            margin-left: -50px;
            display: none;
            flex-direction: column;
            align-items: center;
            will-change: transform;
        }

        .crane-wire {
            width: 2px;
            height: 40px;
            background: #fff;
            box-shadow: 0 0 5px #fff;
        }

        .crane-hook {
            width: 12px; height: 12px;
            background: #ffcc00;
            border-radius: 50%;
            margin-bottom: 2px;
        }

        /* Анимация ошибки */
        @keyframes blockFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(150px) rotate(25deg); opacity: 0; }
        }
        .falling-block {
            animation: blockFall 0.5s ease-in forwards;
        }

        /* Шкала множителей (Справа) */
        .multiplier-ladder {
            width: 75px;
            background: rgba(10, 12, 16, 0.8);
            border-left: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column-reverse; /* 1.00x внизу */
            align-items: flex-end;
            padding: 10px;
            gap: 12px;
            overflow-y: hidden;
            position: relative;
        }

        .mult-step {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            font-weight: 700;
            transition: all 0.3s;
            position: relative;
        }

        .mult-step.active {
            font-size: 19px;
            color: #ffb800; /* Золотой/Оранжевый как на скрине */
            text-shadow: 0 0 10px rgba(255, 184, 0, 0.6);
            transform: scale(1.1);
        }

        /* Управление ставкой и кнопки */
        .controls { background: rgba(20, 22, 28, 0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 15px; backdrop-filter: blur(10px); flex-shrink: 0; }
        
        .bet-options { display: flex; gap: 8px; margin-bottom: 12px; }
        .bet-btn { background: #1a1d24; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; flex: 1; font-size: 14px;}
        .bet-btn.active { background: rgba(0, 217, 255, 0.2); border-color: var(--blue-main); color: var(--blue-main); }
        .bet-btn:disabled { opacity: 0.5; pointer-events: none; }

        .actions-grid {
            display: flex;
            gap: 10px;
        }

        .action-btn { 
            flex: 1; padding: 15px; border-radius: 14px; border: none; font-size: 15px; font-weight: 800; 
            color: #111; background: linear-gradient(90deg, #00ffff, #0088ff); cursor: pointer; 
            box-shadow: 0 0 15px var(--blue-glow); transition: 0.1s; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
            touch-action: manipulation; -webkit-user-select: none;
        }
        .action-btn:active { transform: scale(0.95); }
        
        .action-btn.cashout { background: #00cc66; color: #fff; box-shadow: 0 0 15px rgba(0, 204, 102, 0.4); }
        .action-btn.bust { background: #ff3366; color: #fff; box-shadow: 0 0 15px rgba(255, 51, 102, 0.4); pointer-events: none;}
        .action-btn:disabled { background: #2a2d35; color: #555; box-shadow: none; pointer-events: none; }

        .sub-text { font-size: 10px; font-weight: 700; text-transform: uppercase; opacity: 0.8; }
    </style>
</head>
<body>

    <canvas id="stars"></canvas>
    <div class="dark-overlay"></div>

    <div class="game-container">
        
        <div class="top-section">
            <div class="header">
                <button class="back-btn" onclick="goBack()">❮ Назад</button>
                <div class="balance-pill">
                    <span id="balanceDisplay">500</span> <img src="coins.png" alt="coins" class="coin-icon">
                </div>
            </div>

            <div class="game-info-bar">
                <div class="info-item">Ставка: 
                    <span class="info-val"><span id="infoBet">20</span> <img src="coins.png" class="coin-icon"></span>
                </div>
                <div class="info-item">Остаток: 
                    <span class="info-val"><span id="infoBalance">500</span> <img src="coins.png" class="coin-icon"></span>
                </div>
            </div>
        </div>

        <!-- Игровая сцена -->
        <div class="arcade-stage" id="gameArea">
            <div class="build-area">
                <div class="tower-container" id="towerWrap">
                    <!-- Базовый блок -->
                    <div class="building-block base-block"></div>
                </div>
                
                <!-- Кран, который ездит туда-сюда -->
                <div class="crane-system" id="craneSystem">
                    <div class="crane-wire"></div>
                    <div class="crane-hook"></div>
                    <div class="building-block" id="craneBlock" style="position: relative; margin: 0; bottom: 0; left: 0;"></div>
                </div>
            </div>

            <!-- Шкала множителей -->
            <div class="multiplier-ladder" id="multLadder">
                <!-- Генерируется JS -->
            </div>
        </div>

        <!-- Панель управления -->
        <div class="controls">
            <div class="bet-options">
                <button class="bet-btn active" onclick="setBet(20, this)">20</button>
                <button class="bet-btn" onclick="setBet(50, this)">50</button>
                <button class="bet-btn" onclick="setBet(100, this)">100</button>
                <button class="bet-btn" onclick="setBet(200, this)">200</button>
            </div>

            <div class="actions-grid">
                <button class="action-btn" id="mainActionBtn" onclick="handleAction()">
                    <span id="mainBtnText">НАЧАТЬ ИГРУ</span>
                    <span class="sub-text" id="mainBtnSub">Множитель 1.00x</span>
                </button>
                <button class="action-btn cashout" id="cashoutBtn" style="display: none;" onclick="cashout()">
                    ЗАБРАТЬ
                </button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand(); tg.setHeaderColor('#000000'); tg.setBackgroundColor('#000000');

        // Математика лестницы (как на скрине + продолжение)
        const MULTIPLIERS = [1.00, 1.12, 1.28, 1.46, 1.67, 1.91, 2.18, 2.50, 2.85, 3.25, 3.80, 4.50, 5.50];
        
        let balance = parseInt(localStorage.getItem('vetruch_balance')) || 500;
        let bet = 20;
        
        let state = 'idle'; // idle, playing, dropping, finished
        let currentLevel = 0;
        let currentWin = 0;
        
        // Переменные анимации крана
        let animFrame;
        let craneX = 0;
        let craneDirection = 1;
        let craneSpeed = 3; // Базовая скорость (растет с уровнем)
        let blockHeight = 35; // Высота блока (для сдвига камеры)
        let lastPlacedX = 0;

        const balanceDisplay = document.getElementById('balanceDisplay');
        const infoBalance = document.getElementById('infoBalance');
        const infoBet = document.getElementById('infoBet');
        const betBtns = document.querySelectorAll('.bet-btn');
        
        const towerWrap = document.getElementById('towerWrap');
        const craneSystem = document.getElementById('craneSystem');
        const multLadder = document.getElementById('multLadder');
        
        const mainActionBtn = document.getElementById('mainActionBtn');
        const mainBtnText = document.getElementById('mainBtnText');
        const mainBtnSub = document.getElementById('mainBtnSub');
        const cashoutBtn = document.getElementById('cashoutBtn');

        updateBalanceUI();
        initLadder();

        function goBack() { window.location.href = 'index.html'; }

        function updateBalanceUI() {
            balanceDisplay.textContent = balance;
            infoBalance.textContent = balance;
            localStorage.setItem('vetruch_balance', balance);
        }

        function setBet(amount, btn) {
            if(state === 'playing' || state === 'dropping') return;
            bet = amount;
            infoBet.textContent = bet;
            betBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function initLadder() {
            multLadder.innerHTML = '';
            for(let i = 0; i < MULTIPLIERS.length; i++) {
                let step = document.createElement('div');
                step.className = 'mult-step';
                step.id = `mult-${i}`;
                step.textContent = MULTIPLIERS[i].toFixed(2) + 'x';
                multLadder.appendChild(step);
            }
            updateLadderUI();
        }

        function updateLadderUI() {
            for(let i = 0; i < MULTIPLIERS.length; i++) {
                let step = document.getElementById(`mult-${i}`);
                if (step) {
                    if (i === currentLevel) {
                        step.classList.add('active');
                        // Скроллим лестницу, чтобы активный множитель был виден
                        multLadder.scrollTop = step.offsetTop - (multLadder.clientHeight / 2);
                    } else {
                        step.classList.remove('active');
                    }
                }
            }
        }

        function handleAction() {
            if (state === 'idle' || state === 'finished') {
                startGame();
            } else if (state === 'playing') {
                dropBlock();
            }
        }

        function startGame() {
            if (balance < bet) { tg.showAlert("Недостаточно монет!"); return; }

            balance -= bet;
            updateBalanceUI();
            
            state = 'playing';
            currentLevel = 0;
            currentWin = 0;
            craneSpeed = 2.5; // Сброс скорости
            lastPlacedX = 0;

            betBtns.forEach(b => b.disabled = true);
            
            // Сброс интерфейса башни
            towerWrap.innerHTML = '<div class="building-block base-block"></div>';
            towerWrap.style.transform = `translateY(0px)`;
            craneSystem.style.display = 'flex';
            craneX = 0;
            
            updateLadderUI();

            // Кнопки
            mainActionBtn.className = 'action-btn';
            mainActionBtn.style.background = '';
            mainBtnText.textContent = 'СБРОСИТЬ БЛОК';
            mainBtnSub.textContent = `СЛЕДУЮЩИЙ: ${MULTIPLIERS[1].toFixed(2)}x`;
            cashoutBtn.style.display = 'none';

            animateCrane();
        }

        function animateCrane() {
            if (state !== 'playing') return;
            
            // Максимальный размах зависит от ширины экрана, 80px - безопасно
            let maxSwing = 80; 
            
            craneX += craneSpeed * craneDirection;
            if (craneX > maxSwing) {
                craneX = maxSwing;
                craneDirection = -1;
            } else if (craneX < -maxSwing) {
                craneX = -maxSwing;
                craneDirection = 1;
            }

            craneSystem.style.transform = `translateX(${craneX}px)`;
            animFrame = requestAnimationFrame(animateCrane);
        }

        function dropBlock() {
            state = 'dropping';
            cancelAnimationFrame(animFrame);
            
            mainActionBtn.disabled = true;
            mainBtnText.textContent = 'ПАДАЕТ...';

            let dropX = craneX;
            let targetX = lastPlacedX;
            let offset = Math.abs(dropX - targetX);
            
            // Погрешность (чем выше уровень, тем строже)
            let tolerance = 45; // Допустимое смещение от центра
            
            setTimeout(() => {
                if (offset < tolerance) {
                    // УСПЕШНАЯ ПОСТАНОВКА
                    successDrop(dropX);
                } else {
                    // ПРОМАХ
                    failDrop(dropX);
                }
            }, 300); // Имитация времени падения
        }

        function successDrop(dropX) {
            currentLevel++;
            currentWin = Math.floor(bet * MULTIPLIERS[currentLevel]);
            lastPlacedX = dropX;
            
            // Добавляем блок в башню
            let newBlock = document.createElement('div');
            newBlock.className = 'building-block';
            newBlock.style.bottom = `${currentLevel * blockHeight}px`;
            newBlock.style.transform = `translateX(${dropX}px)`;
            towerWrap.appendChild(newBlock);

            // Опускаем камеру
            towerWrap.style.transform = `translateY(${currentLevel * blockHeight}px)`;

            updateLadderUI();

            if (currentLevel >= MULTIPLIERS.length - 1) {
                // Максимальный уровень
                cashout();
            } else {
                state = 'playing';
                craneSpeed += 0.5; // Увеличиваем скорость для сложности (снижает RTP)
                
                mainActionBtn.disabled = false;
                mainBtnText.textContent = 'СБРОСИТЬ БЛОК';
                mainBtnSub.textContent = `СЛЕДУЮЩИЙ: ${MULTIPLIERS[currentLevel+1].toFixed(2)}x`;
                
                cashoutBtn.style.display = 'flex';
                cashoutBtn.innerHTML = `ЗАБРАТЬ<br><span style="font-size:12px">${currentWin} <img src="coins.png" class="coin-icon-sm"></span>`;
                
                animateCrane();
            }
        }

        function failDrop(dropX) {
            // Анимация падения мимо
            let fallingBlock = document.createElement('div');
            fallingBlock.className = 'building-block falling-block';
            fallingBlock.style.bottom = `${currentLevel * blockHeight}px`;
            fallingBlock.style.transform = `translateX(${dropX}px)`;
            fallingBlock.style.borderColor = '#ff3366';
            fallingBlock.style.boxShadow = '0 0 10px #ff3366';
            towerWrap.appendChild(fallingBlock);

            craneSystem.style.display = 'none';

            mainActionBtn.disabled = false;
            mainActionBtn.className = 'action-btn bust';
            mainBtnText.textContent = 'БАШНЯ УПАЛА 💥';
            mainBtnSub.textContent = 'ИГРАТЬ СНОВА';
            cashoutBtn.style.display = 'none';

            state = 'finished';
            betBtns.forEach(b => b.disabled = false);
        }

        function cashout() {
            if (currentLevel === 0 || (state !== 'playing' && state !== 'dropping')) return;
            
            cancelAnimationFrame(animFrame);
            
            balance += currentWin;
            updateBalanceUI();
            
            craneSystem.style.display = 'none';

            mainActionBtn.className = 'action-btn cashout';
            mainBtnText.textContent = 'ВЫИГРЫШ ЗАБРАН 💰';
            mainBtnSub.textContent = `ВЫ ПОЛУЧИЛИ ${currentWin} МОНЕТ`;
            cashoutBtn.style.display = 'none';

            state = 'finished';
            betBtns.forEach(b => b.disabled = false);
        }

        // ================= Анимация звезд на фоне =================
        const canvas = document.getElementById("stars");
        const ctx = canvas.getContext("2d");
        let stars = []; let w = 0; let h = 0;

        function resizeCanvas() {
            w = window.innerWidth; h = window.innerHeight;
            canvas.width = w; canvas.height = h;
            createStars();
        }
        function createStars() {
            stars = [];
            for (let i = 0; i < 70; i++) stars.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.2 + 0.2, s: Math.random() * 0.1 + 0.02, o: Math.random() * 0.5 + 0.2 });
        }
        function drawStars() {
            ctx.clearRect(0, 0, w, h);
            for (const star of stars) {
                ctx.beginPath(); ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(100, 217, 255, ${star.o})`; ctx.fill();
                star.y += star.s;
                if (star.y > h) { star.y = 0; star.x = Math.random() * w; }
            }
            requestAnimationFrame(drawStars);
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas(); drawStars();
    </script>
</body>
</html>
