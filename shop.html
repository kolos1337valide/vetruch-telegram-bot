<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Магазин - Vetruch</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        :root {
            --bg: #000000; --text: #ffffff; --secondary: #8c97a7;
            --blue-main: #0088ff; --blue-glow: rgba(0, 136, 255, 0.5);
            --card-bg: rgba(18, 14, 28, 0.82); 
            --card-border: rgba(130, 90, 220, 0.3);
        }
        
        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            min-height: 100vh; overflow-x: hidden; padding-bottom: 90px; 
        }

        /* Фон */
        #stars { position: fixed; z-index: 0; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        .dark-overlay { position: fixed; z-index: 1; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%); pointer-events: none; }

        .game-container { 
            position: relative; z-index: 2; display: flex; flex-direction: column; 
            min-height: 100vh; padding: 20px 16px 40px 16px; 
        }

        /* Шапка */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        h2.shop-heading {
            text-align: left; margin: 0; font-size: 26px; font-weight: 800;
            background: linear-gradient(90deg, #ffffff 0%, #73caff 55%, #168bff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .balance-pill { 
            display: flex; align-items: center; gap: 6px; background: rgba(0, 136, 255, 0.15); 
            padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 16px; 
            border: 1px solid rgba(0, 136, 255, 0.3); box-shadow: 0 0 10px rgba(0, 136, 255, 0.2);
            flex-shrink: 0;
        }
        .coin-icon { width: 18px; height: 18px; flex-shrink: 0; vertical-align: middle; }

        /* СЕТКА ТОВАРОВ 2x2 */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        /* Дизайн карточки точь-в-точь как на первом референсе */
        .shop-card {
            background: var(--card-bg);
            border: 1.5px solid var(--card-border);
            border-radius: 22px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 0 25px rgba(120, 80, 200, 0.05);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .shop-card:active { transform: scale(0.97); border-color: #a855f7; }

        /* Квадратная картинка с внутренними отступами и скруглением */
        .shop-card-img-wrap {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 14px;
            overflow: hidden;
            background: #05080c;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .shop-card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ровно заполняет квадратную область без черных полос */
            display: block;
        }

        /* Название товара */
        .shop-card-title {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
            text-align: left;
            line-height: 1.3;
            min-height: 34px;
            display: flex;
            align-items: center;
            padding: 0 2px;
        }

        /* Кнопка */
        .shop-btn {
            width: 100%;
            background: linear-gradient(135deg, #0088ff, #00d9ff);
            border: none;
            border-radius: 14px;
            padding: 12px;
            color: #fff;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 0 18px rgba(0, 136, 255, 0.45);
            text-align: center;
            transition: 0.2s;
        }
        .shop-btn:active { transform: scale(0.95); opacity: 0.9; }

        /* НИЖНЕЕ МЕНЮ НАВИГАЦИИ */
        .bottom-nav {
            position: fixed; z-index: 10; right: 12px; bottom: 15px; left: 12px; 
            display: flex; align-items: center; justify-content: space-around;
            height: 65px; padding: 0 5px; border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 20px; background: rgba(15, 18, 22, 0.95);
            backdrop-filter: blur(15px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); 
        }
        .nav-button { 
            display: flex; flex: 1; flex-direction: column; align-items: center; justify-content: center; 
            gap: 4px; height: 55px; border: 0; border-radius: 16px; background: transparent; 
            color: #626a7d; font-size: 10px; font-weight: 600; cursor: pointer; text-decoration: none;
            transition: all 0.2s ease; 
        }
        .nav-button svg { width: 24px; height: 24px; stroke: #626a7d; transition: all 0.2s ease; }
        .nav-button.active { color: var(--blue-main); }
        .nav-button.active svg { stroke: var(--blue-main); filter: drop-shadow(0 0 6px var(--blue-glow)); transform: translateY(-2px); }
    </style>
</head>
<body>

    <canvas id="stars"></canvas>
    <div class="dark-overlay"></div>

    <div class="game-container">
        
        <!-- Шапка -->
        <div class="header">
            <h2 class="shop-heading">Магазин</h2>
            <div class="balance-pill">
                <span id="balanceDisplay">500</span> <img src="coins.png" alt="coins" class="coin-icon">
            </div>
        </div>

        <!-- СЕТКА КАРТОЧЕК -->
        <div class="shop-grid">
            
            <div class="shop-card">
                <div class="shop-card-img-wrap"><img src="IMG_1068.PNG" alt="iPhone 18 PRO MAX"></div>
                <div class="shop-card-title">iPhone 18 PRO MAX</div>
                <button class="shop-btn" onclick="buyItem('iPhone 18 PRO MAX')">КУПИТЬ</button>
            </div>

            <div class="shop-card">
                <div class="shop-card-img-wrap"><img src="IMG_1073.jpg" alt="iPhone DUO"></div>
                <div class="shop-card-title">iPhone DUO</div>
                <button class="shop-btn" onclick="buyItem('iPhone DUO')">КУПИТЬ</button>
            </div>

            <div class="shop-card">

                <div class="shop-card-title">AirPods PRO 3</div>
                <button class="shop-btn" onclick="buyItem('AirPods PRO 3')">КУПИТЬ</button>
            </div>

            <div class="shop-card">
                <div class="shop-card-img-wrap"><img src="IMG_1074.jpg" alt="Бонуска за 10 000₽"></div>
                <div class="shop-card-title">Бонуска за 10 000₽</div>
                <button class="shop-btn" onclick="buyItem('Бонуска за 10 000₽')">КУПИТЬ</button>
            </div>

            <div class="shop-card">
                <div class="shop-card-img-wrap"><img src="IMG_1072.jpg" alt="5000 рублей"></div>
                <div class="shop-card-title">5000 рублей</div>
                <button class="shop-btn" onclick="buyItem('5000 рублей')">КУПИТЬ</button>
            </div>

            <div class="shop-card">
                <div class="shop-card-img-wrap"><img src="IMG_1069.jpg" alt="2500 рублей"></div>
                <div class="shop-card-title">2500 рублей</div>
                <button class="shop-btn" onclick="buyItem('2500 рублей')">КУПИТЬ</button>
            </div>

            <div class="shop-card">
                <div class="shop-card-img-wrap"><img src="IMG_1071.jpg" alt="1000 рублей"></div>
                <div class="shop-card-title">1000 рублей</div>
                <button class="shop-btn" onclick="buyItem('1000 рублей')">КУПИТЬ</button>
            </div>

            <div class="shop-card">
                <div class="shop-card-img-wrap"><img src="IMG_1075.jpg" alt="Выбрать слот для стрима"></div>
                <div class="shop-card-title">Выбрать слот для стрима</div>
                <button class="shop-btn" onclick="buyItem('Выбрать слот для стрима')">КУПИТЬ</button>
            </div>

            <div class="shop-card">
                <div class="shop-card-img-wrap"><img src="IMG_1076.jpg" alt="Telegram Premium на 1 год"></div>
                <div class="shop-card-title">Telegram Premium на 1 год</div>
                <button class="shop-btn" onclick="buyItem('Telegram Premium на 1 год')">КУПИТЬ</button>
            </div>

            <div class="shop-card">
                <div class="shop-card-img-wrap"><img src="IMG_1079.jpg" alt="Telegram Premium 6 месяцев"></div>
                <div class="shop-card-title">Telegram Premium 6 месяцев</div>
                <button class="shop-btn" onclick="buyItem('Telegram Premium 6 месяцев')">КУПИТЬ</button>
            </div>

            <div class="shop-card">
                <div class="shop-card-img-wrap"><img src="IMG_1080.jpg" alt="Telegram Premium 3 месяца"></div>
                <div class="shop-card-title">Telegram Premium 3 месяца</div>
                <button class="shop-btn" onclick="buyItem('Telegram Premium 3 месяца')">КУПИТЬ</button>
            </div>

            <div class="shop-card">
                <div class="shop-card-img-wrap"><img src="IMG_1077.jpg" alt="VIP либо OG в чате"></div>
                <div class="shop-card-title">VIP либо OG в чате</div>
                <button class="shop-btn" onclick="buyItem('VIP либо OG в чате')">КУПИТЬ</button>
            </div>

            <div class="shop-card">
                <div class="shop-card-img-wrap"><img src="IMG_1078.jpg" alt="VPN 1 месяц"></div>
                <div class="shop-card-title">VPN 1 месяц</div>
                <button class="shop-btn" onclick="buyItem('VPN 1 месяц')">КУПИТЬ</button>
            </div>

        </div>
    </div>

    <!-- Нижнее меню -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-button" onclick="setTab('home')">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg><span>Главная</span>
        </a>
        <a href="index.html" class="nav-button" onclick="setTab('games')">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 12h4"></path><path d="M8 10v4"></path><line x1="15" y1="13" x2="15.01" y2="13"></line><line x1="18" y1="11" x2="18.01" y2="11"></line></svg><span>Игры</span>
        </a>
        <a href="index.html" class="nav-button" onclick="setTab('tasks')">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg><span>Задания</span>
        </a>
        <a href="shop.html" class="nav-button active" onclick="setTab('shop')">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg><span>Магазин</span>
        </a>
        <a href="index.html" class="nav-button" onclick="setTab('profile')">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Профиль</span>
        </a>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand(); tg.setHeaderColor('#000000'); tg.setBackgroundColor('#000000');

        let balance = parseInt(localStorage.getItem('vetruch_balance')) || 500;
        document.getElementById('balanceDisplay').textContent = balance;

        function setTab(tabName) {
            sessionStorage.setItem('vetruch_active_tab', tabName);
        }

        function buyItem(itemName) {
            tg.showAlert(`Товар "${itemName}" выбран! Цены и покупку настроим чуть позже, шеф 🚀`);
        }

        // Анимация звезд
        const canvas = document.getElementById("stars");
        const ctx = canvas.getContext("2d");
        let stars = []; let w = 0; let h = 0;

        function resizeCanvas() {
            w = window.innerWidth; h = window.innerHeight;
            canvas.width = w; canvas.height = h;
            createStars();
        }
        function createStars() {
            stars = [];
            for (let i = 0; i < 70; i++) stars.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.2 + 0.2, s: Math.random() * 0.1 + 0.02, o: Math.random() * 0.5 + 0.2 });
        }
        function drawStars() {
            ctx.clearRect(0, 0, w, h);
            for (const star of stars) {
                ctx.beginPath(); ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(100, 180, 255, ${star.opacity})`; ctx.fill();
                star.y += star.speed;
                if (star.y > h + 3) { star.y = -3; star.x = Math.random() * w; }
            }
            requestAnimationFrame(drawStars);
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas(); drawStars();
    </script>
</body>
</html>
