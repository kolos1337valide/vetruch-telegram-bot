<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="vetruch-economy.js?v=4"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Флаппи Утка - Vetruch</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        :root {
            --bg: #030711;
            --text: #ffffff;
            --blue-main: #0088ff;
            --blue-cyan: #00d9ff;
            --blue-glow: rgba(0, 170, 255, 0.55);
            --gold: #ffd700;
            --green: #00e676;
            --red: #ff3366;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .game-shell {
            position: relative;
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at 50% 25%, #0e203d 0%, #050b17 62%, #02050b 100%);
        }

        /* Верхняя панель навигации и баланса */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px 8px 14px;
            z-index: 20;
            flex-shrink: 0;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            height: 38px;
            padding: 0 13px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }
        .back-btn:active { transform: scale(0.95); }

        .balance-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 136, 255, 0.16);
            padding: 7px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 15px;
            border: 1px solid rgba(0, 217, 255, 0.35);
            box-shadow: 0 0 16px rgba(0, 136, 255, 0.25);
        }
        .coin-icon { width: 17px; height: 17px; flex-shrink: 0; vertical-align: middle; }

        /* Сцена полёта */
        .stage-wrap {
            position: relative;
            flex: 1 1 auto;
            min-height: 260px;
            margin: 0 10px;
            border-radius: 20px;
            overflow: hidden;
            border: 1.5px solid rgba(0, 217, 255, 0.32);
            box-shadow:
                inset 0 0 36px rgba(0, 0, 0, 0.75),
                0 8px 26px rgba(0, 0, 0, 0.75);
            touch-action: manipulation;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        /* Верхний HUD счёта как на референсе */
        .hud-overlay {
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .hud-score {
            font-size: 46px;
            font-weight: 900;
            line-height: 1;
            color: #ffffff;
            -webkit-text-stroke: 2px rgba(10, 32, 60, 0.55);
            paint-order: stroke fill;
            text-shadow:
                0 3px 0 rgba(10, 32, 60, 0.55),
                0 6px 14px rgba(0, 0, 0, 0.35);
            letter-spacing: -1px;
            font-variant-numeric: tabular-nums;
        }

        /* Кнопка "Тапни, чтобы лететь" в idle состоянии */
        .tap-prompt-wrap {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 22%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 12;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .tap-prompt-wrap.hidden {
            opacity: 0;
            transform: scale(0.92);
        }
        .tap-prompt-pill {
            pointer-events: auto;
            background: linear-gradient(135deg, #22e3d0 0%, #00b8ff 100%);
            color: #03131c;
            font-size: 15px;
            font-weight: 900;
            padding: 11px 24px;
            border-radius: 999px;
            border: none;
            box-shadow:
                0 6px 22px rgba(0, 217, 255, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.55);
            cursor: pointer;
            animation: tapPulse 1.5s ease-in-out infinite;
        }
        @keyframes tapPulse {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-3px) scale(1.03); }
        }

        /* Результат раунда поверх сцены */
        .result-overlay {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(4, 8, 18, 0.72);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 15;
            padding: 18px;
            text-align: center;
        }
        .result-overlay.show {
            display: flex;
            animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .result-card {
            width: 100%;
            max-width: 290px;
            background: linear-gradient(180deg, rgba(16, 28, 48, 0.96) 0%, rgba(8, 14, 26, 0.98) 100%);
            border: 1.5px solid rgba(0, 217, 255, 0.45);
            border-radius: 20px;
            padding: 18px 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.85);
        }
        .result-card.win {
            border-color: rgba(0, 230, 118, 0.65);
            box-shadow: 0 0 28px rgba(0, 230, 118, 0.25), 0 12px 32px rgba(0, 0, 0, 0.85);
        }
        .result-card.lose {
            border-color: rgba(255, 51, 102, 0.6);
            box-shadow: 0 0 26px rgba(255, 51, 102, 0.2), 0 12px 32px rgba(0, 0, 0, 0.85);
        }
        .result-title {
            font-size: 16px;
            font-weight: 900;
            margin-bottom: 6px;
            color: #fff;
        }
        .result-sub {
            font-size: 13px;
            font-weight: 700;
            color: #cbd5e1;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .result-best {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 800;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.28);
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 14px;
        }
        .result-btn {
            width: 100%;
            border: none;
            border-radius: 13px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            color: #031520;
            background: linear-gradient(135deg, #22e3d0 0%, #0095ff 100%);
            box-shadow: 0 4px 16px rgba(0, 195, 255, 0.45);
        }
        .result-btn:active { transform: scale(0.96); }
        .result-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Нижняя панель ставок */
        .controls {
            flex-shrink: 0;
            margin: 10px 10px 14px 10px;
            background: rgba(16, 20, 29, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 10px 12px;
            z-index: 20;
        }

        .bet-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11.5px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        .bet-header-row b { color: #00e5ff; }
        .bet-header-row span.gold { color: #ffd700; font-weight: 800; }

        .bet-options {
            display: flex;
            gap: 7px;
        }
        .bet-btn {
            flex: 1;
            background: #1a202c;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 10px 6px;
            border-radius: 11px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            transition: 0.18s;
        }
        .bet-btn.active {
            background: rgba(0, 217, 255, 0.18);
            border-color: var(--blue-cyan);
            color: var(--blue-cyan);
            box-shadow: 0 0 12px rgba(0, 217, 255, 0.25);
        }
        .bet-btn:disabled {
            opacity: 0.45;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="game-shell">
    <div class="header">
        <button type="button" class="back-btn" onclick="goBack()">❮ Назад</button>
        <div class="balance-pill">
            <span id="balanceDisplay">500</span> <img src="coins.png" alt="coins" class="coin-icon">
        </div>
    </div>

    <div class="stage-wrap" id="stageWrap">
        <canvas id="gameCanvas"></canvas>

        <div class="hud-overlay">
            <div class="hud-score" id="scoreDisplay">0</div>
        </div>

        <div class="tap-prompt-wrap" id="tapPromptWrap">
            <button type="button" class="tap-prompt-pill" id="tapPromptBtn">Тапни, чтобы лететь</button>
        </div>

        <div class="result-overlay" id="resultOverlay">
            <div class="result-card" id="resultCard">
                <div class="result-title" id="resultTitle">Попытка завершена</div>
                <div class="result-sub" id="resultSub">Счёт: 0</div>
                <div class="result-best" id="resultBest">Рекорд: 0</div>
                <button type="button" class="result-btn" id="resultBtn" onclick="prepareNextFlight()">Тапни, чтобы лететь</button>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="bet-header-row">
            <span>Ставка: <b id="infoBet">20</b> <img src="coins.png" class="coin-icon" style="width:13px;height:13px;"></span>
            <span class="gold">Макс. приз (x10): <span id="maxPrizeDisplay">200</span> <img src="coins.png" class="coin-icon" style="width:13px;height:13px;"></span>
        </div>
        <div class="bet-options">
            <button type="button" class="bet-btn active" onclick="setBet(20, this)">20</button>
            <button type="button" class="bet-btn" onclick="setBet(50, this)">50</button>
            <button type="button" class="bet-btn" onclick="setBet(100, this)">100</button>
            <button type="button" class="bet-btn" onclick="setBet(200, this)">200</button>
        </div>
    </div>
</div>

<script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : { ready:()=>{}, expand:()=>{}, setHeaderColor:()=>{}, setBackgroundColor:()=>{}, showAlert:(m)=>alert(m) };
    tg.ready(); tg.expand();
    try { tg.setHeaderColor('#030711'); tg.setBackgroundColor('#030711'); } catch (e) {}

    let rawBal = localStorage.getItem('vetruch_balance');
    let balance = rawBal !== null ? parseInt(rawBal, 10) : 500;
    if (isNaN(balance)) balance = 500;

    let bet = 20;
    let bestScore = parseInt(localStorage.getItem('vetruch_flappy_best') || '0', 10) || 0;
    let state = 'idle'; // 'idle' | 'flying' | 'finished'
    let score = 0;
    let restartUnlockAt = 0;

    const MAX_PIPES = 50;

    function getMultiplierForScore(s) {
        if (s >= MAX_PIPES) return 10;
        if (s < 10) return 0;
        return Math.round((1 + Math.floor(s / 10) * 0.2) * 10) / 10;
    }

    const balanceDisplay = document.getElementById('balanceDisplay');
    const infoBet = document.getElementById('infoBet');
    const maxPrizeDisplay = document.getElementById('maxPrizeDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const tapPromptWrap = document.getElementById('tapPromptWrap');
    const resultOverlay = document.getElementById('resultOverlay');
    const resultCard = document.getElementById('resultCard');
    const resultTitle = document.getElementById('resultTitle');
    const resultSub = document.getElementById('resultSub');
    const resultBest = document.getElementById('resultBest');
    const resultBtn = document.getElementById('resultBtn');
    const betBtns = document.querySelectorAll('.bet-btn');
    const stageWrap = document.getElementById('stageWrap');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function goBack() {
        if (window.parent && window.parent !== window && typeof window.parent.closeGameModal === 'function') {
            window.parent.closeGameModal();
        } else if (window.history.length > 1) {
            window.history.back();
        } else {
            window.location.href = 'index.html';
        }
    }

    function updateBalanceUI() {
        if (isNaN(balance)) balance = 0;
        balanceDisplay.textContent = balance;
        localStorage.setItem('vetruch_balance', balance);
    }

    function setBet(amount, btn) {
        if (state === 'flying') return;
        bet = amount;
        infoBet.textContent = bet;
        maxPrizeDisplay.textContent = Math.floor(bet * 10);
        betBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    updateBalanceUI();

    // ================= ЗАГРУЗКА СПРАЙТА УТКИ =================
    const duckImg = new Image();
    let duckImgLoaded = false;
    duckImg.onload = () => { duckImgLoaded = true; };
    duckImg.src = 'flappy-duck.png';

    // ================= РАЗМЕРЫ СЦЕНЫ И СПАВН =================
    let W = 360;
    let H = 480;
    let dpr = 1;
    let floorHeight = 58;

    const duck = {
        x: 92,
        y: 220,
        vy: 0,
        w: 56,
        h: 68,
        angle: 0
    };

    let pipes = [];
    let particles = [];
    let floatingPopups = [];
    let bgClouds = [];
    let scrollX = 0;
    let lastTime = performance.now();

    function initClouds() {
        bgClouds = [];
        for (let i = 0; i < 6; i++) {
            bgClouds.push({
                x: (i * 95 + Math.random() * 40) % (W + 120) - 40,
                y: 34 + Math.random() * Math.max(80, (H - floorHeight) * 0.36),
                scale: 0.75 + Math.random() * 0.55,
                speed: 0.18 + Math.random() * 0.22,
                alpha: 0.72 + Math.random() * 0.22
            });
        }
    }

    function resizeCanvas() {
        const rect = stageWrap.getBoundingClientRect();
        if (rect.width < 10 || rect.height < 10) return;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = rect.width;
        H = rect.height;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        duck.x = Math.round(Math.min(115, W * 0.27));
        if (state === 'idle') {
            duck.y = Math.round((H - floorHeight) * 0.46);
        }
        initClouds();
    }

    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 30);

    function spawnPipe(offsetX, indexNum) {
        const usableH = H - floorHeight;
        const gap = Math.max(150, Math.min(168, usableH * 0.31));
        const marginTop = 86;
        const marginBottom = 56;
        const maxTop = Math.max(marginTop + 20, usableH - gap - marginBottom);
        const gapTop = marginTop + Math.random() * (maxTop - marginTop);
        const isGolden = (indexNum % 10 === 0);

        pipes.push({
            x: offsetX,
            w: 58,
            gapTop,
            gapBottom: gapTop + gap,
            passed: false,
            num: indexNum,
            isGolden
        });
    }

    let nextPipeNum = 1;

    function resetFlightState() {
        pipes = [];
        particles = [];
        floatingPopups = [];
        score = 0;
        nextPipeNum = 1;
        scoreDisplay.textContent = '0';
        duck.y = Math.round((H - floorHeight) * 0.46);
        duck.vy = 0;
        duck.angle = 0;
        resultOverlay.classList.remove('show');
        tapPromptWrap.classList.remove('hidden');
        betBtns.forEach(b => b.disabled = false);
        state = 'idle';
    }

    function prepareNextFlight() {
        if (Date.now() < restartUnlockAt) return;
        resetFlightState();
    }

    function spawnFlapParticles(burstCount) {
        for (let i = 0; i < burstCount; i++) {
            particles.push({
                x: duck.x - 16 + (Math.random() - 0.5) * 10,
                y: duck.y + 8 + (Math.random() - 0.5) * 12,
                vx: -2.2 - Math.random() * 2.2,
                vy: 1.0 + (Math.random() - 0.5) * 2.0,
                r: Math.random() * 3.8 + 1.8,
                life: 1.0,
                decay: 0.045 + Math.random() * 0.03,
                color: Math.random() < 0.3 ? '#ffd700' : '#00e5ff'
            });
        }
    }

    function startRoundAndFlap() {
        if (state !== 'idle') return;
        let storedBal = parseInt(localStorage.getItem('vetruch_balance') || String(balance), 10);
        if (!isNaN(storedBal)) balance = storedBal;

        if (balance < bet) {
            tg.showAlert('Недостаточно монет!');
            return;
        }

        if (window.VETRUCH_ECONOMY) {
            var check = VETRUCH_ECONOMY.checkAndUseAttempt('flappy');
            if (!check.ok) {
                VETRUCH_ECONOMY.showNoAttemptsOverlay('flappy');
                return;
            }
            VETRUCH_ECONOMY.updateBadgeUI('flappy');
        }

        balance -= bet;
        const expEarned = Math.floor(bet / 50);
        if (expEarned > 0) {
            let curXp = parseInt(localStorage.getItem('vetruch_user_xp') || '0', 10);
            localStorage.setItem('vetruch_user_xp', curXp + expEarned);
        }
        updateBalanceUI();

        state = 'flying';
        score = 0;
        nextPipeNum = 1;
        pipes = [];
        floatingPopups = [];
        scoreDisplay.textContent = '0';

        tapPromptWrap.classList.add('hidden');
        resultOverlay.classList.remove('show');
        betBtns.forEach(b => b.disabled = true);

        const firstX = Math.max(W + 60, duck.x + 270);
        const spacing = 225;
        for (let i = 0; i < 4; i++) {
            spawnPipe(firstX + i * spacing, nextPipeNum++);
        }

        performFlap();
    }

    function performFlap() {
        duck.vy = -6.2;
        spawnFlapParticles(9);
        if (tg.HapticFeedback) {
            try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
        }
    }

    function handleFlyInput(e) {
        if (e && e.target && e.target.closest('.controls, .header')) return;
        if (e) e.preventDefault();

        if (state === 'idle') {
            startRoundAndFlap();
        } else if (state === 'flying') {
            performFlap();
        }
    }

    stageWrap.addEventListener('pointerdown', handleFlyInput);
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            if (state === 'finished' && Date.now() >= restartUnlockAt) {
                prepareNextFlight();
            } else {
                handleFlyInput();
            }
        }
    });

    function finishFlight(completedAll) {
        if (state === 'finished') return;
        state = 'finished';
        restartUnlockAt = Date.now() + 450;

        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('vetruch_flappy_best', bestScore);
        }

        const mult = getMultiplierForScore(score);
        const winAmount = mult > 0 ? Math.floor(bet * mult) : 0;

        if (winAmount > 0) {
            balance += winAmount;
            updateBalanceUI();
            if (tg.HapticFeedback) {
                try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
            }
        } else {
            if (tg.HapticFeedback) {
                try { tg.HapticFeedback.notificationOccurred('error'); } catch (e) {}
            }
        }

        resultCard.className = 'result-card ' + (winAmount > 0 ? 'win' : 'lose');
        if (score >= MAX_PIPES || completedAll) {
            resultTitle.textContent = '🏆 50 ТРУБ ПРОЙДЕНО!';
            resultTitle.style.color = '#00e676';
            resultSub.innerHTML = `Выигрыш: <b>+${winAmount}</b> <img src="coins.png" class="coin-icon"> (x10)`;
            resultBtn.textContent = 'ЛЕТЕТЬ ЕЩЁ';
        } else if (winAmount > 0) {
            resultTitle.textContent = `✨ ОТЛИЧНЫЙ ПОЛЁТ (${score})`;
            resultTitle.style.color = '#00e5ff';
            resultSub.innerHTML = `Выигрыш: <b>+${winAmount}</b> <img src="coins.png" class="coin-icon"> (x${mult})`;
            resultBtn.textContent = 'ЛЕТЕТЬ ЕЩЁ';
        } else {
            resultTitle.textContent = '💥 СТОЛКНОВЕНИЕ';
            resultTitle.style.color = '#ff5277';
            resultSub.textContent = `Пройдено труб: ${score}`;
            resultBtn.textContent = 'ПОПРОБОВАТЬ СНОВА';
        }
        resultBest.textContent = `🏆 Рекорд: ${bestScore}`;

        resultBtn.disabled = true;
        setTimeout(() => { resultBtn.disabled = false; }, 450);
        resultOverlay.classList.add('show');
        betBtns.forEach(b => b.disabled = false);
    }

    // ================= ОТРИСОВКА ФОНА (НЕБО, ОБЛАКА И ДЕРЕВЬЯ) =================
    function drawCloud(cx, cy, scale, alpha) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
        ctx.arc(16, -6, 22, 0, Math.PI * 2);
        ctx.arc(36, -2, 17, 0, Math.PI * 2);
        ctx.arc(50, 4, 13, 0, Math.PI * 2);
        ctx.arc(-15, 5, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function drawTree(x, baseY, treeIdx) {
        const variant = ((treeIdx % 3) + 3) % 3;
        const sizeBoost = ((treeIdx * 37) % 19) - 9;

        if (variant === 0) {
            // Высокое лиственное дерево
            const trunkH = 38 + sizeBoost * 0.6;
            ctx.fillStyle = '#6f4e37';
            ctx.fillRect(x - 5, baseY - trunkH, 10, trunkH);

            ctx.fillStyle = '#249448';
            ctx.beginPath();
            ctx.arc(x, baseY - trunkH - 10, 24, 0, Math.PI * 2);
            ctx.arc(x - 16, baseY - trunkH + 2, 17, 0, Math.PI * 2);
            ctx.arc(x + 16, baseY - trunkH + 2, 17, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#34c759';
            ctx.beginPath();
            ctx.arc(x - 4, baseY - trunkH - 14, 16, 0, Math.PI * 2);
            ctx.fill();
        } else if (variant === 1) {
            // Ель
            const trunkH = 24;
            ctx.fillStyle = '#5d4037';
            ctx.fillRect(x - 4, baseY - trunkH, 8, trunkH);

            const layers = [
                { yOff: 18, w: 28, h: 30, col: '#1e7e3e' },
                { yOff: 36, w: 22, h: 28, col: '#259b4d' },
                { yOff: 54, w: 16, h: 24, col: '#2ecc71' }
            ];
            for (const l of layers) {
                ctx.fillStyle = l.col;
                ctx.beginPath();
                ctx.moveTo(x, baseY - l.yOff - l.h);
                ctx.lineTo(x - l.w, baseY - l.yOff);
                ctx.lineTo(x + l.w, baseY - l.yOff);
                ctx.closePath();
                ctx.fill();
            }
        } else {
            // Пышное круглое дерево + куст
            const trunkH = 30 + sizeBoost * 0.5;
            ctx.fillStyle = '#6f4e37';
            ctx.fillRect(x - 4, baseY - trunkH, 8, trunkH);

            ctx.fillStyle = '#27ae60';
            ctx.beginPath();
            ctx.arc(x, baseY - trunkH - 6, 20, 0, Math.PI * 2);
            ctx.arc(x - 13, baseY - trunkH + 4, 14, 0, Math.PI * 2);
            ctx.arc(x + 13, baseY - trunkH + 4, 14, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#58d68d';
            ctx.beginPath();
            ctx.arc(x - 3, baseY - trunkH - 10, 12, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawBackground() {
        const usableH = H - floorHeight;

        // Чистое дневное небо
        const skyGrad = ctx.createLinearGradient(0, 0, 0, usableH);
        skyGrad.addColorStop(0, '#36b5ff');
        skyGrad.addColorStop(0.58, '#7ad7ff');
        skyGrad.addColorStop(1, '#c8f2ff');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, W, H);

        // Мягкое солнце в небе
        const sunX = W * 0.82;
        const sunY = Math.max(54, usableH * 0.16);
        const sunGlow = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 56);
        sunGlow.addColorStop(0, 'rgba(255, 248, 200, 0.95)');
        sunGlow.addColorStop(0.4, 'rgba(255, 232, 130, 0.45)');
        sunGlow.addColorStop(1, 'rgba(255, 232, 130, 0)');
        ctx.fillStyle = sunGlow;
        ctx.beginPath();
        ctx.arc(sunX, sunY, 56, 0, Math.PI * 2);
        ctx.fill();

        // Плывущие облака
        for (const c of bgClouds) {
            drawCloud(c.x, c.y, c.scale, c.alpha);
        }

        // Дальние зелёные холмы (параллакс)
        const hillStep = 140;
        const hillOffset = ((scrollX * 0.18) % hillStep + hillStep) % hillStep;
        ctx.fillStyle = '#8be098';
        ctx.beginPath();
        ctx.moveTo(-hillStep, usableH);
        for (let x = -hillStep - hillOffset; x <= W + hillStep * 2; x += hillStep) {
            ctx.quadraticCurveTo(x + hillStep * 0.5, usableH - 76, x + hillStep, usableH - 14);
        }
        ctx.lineTo(W + hillStep, usableH);
        ctx.closePath();
        ctx.fill();

        // Средний план холмов
        const midStep = 110;
        const midOffset = ((scrollX * 0.3) % midStep + midStep) % midStep;
        ctx.fillStyle = '#65c975';
        ctx.beginPath();
        ctx.moveTo(-midStep, usableH);
        for (let x = -midStep - midOffset; x <= W + midStep * 2; x += midStep) {
            ctx.quadraticCurveTo(x + midStep * 0.5, usableH - 48, x + midStep, usableH - 8);
        }
        ctx.lineTo(W + midStep, usableH);
        ctx.closePath();
        ctx.fill();

        // Деревья сзади (бесконечный плавный параллакс)
        const treeSpacing = 76;
        const firstIdx = Math.floor((scrollX * 0.45 - 80) / treeSpacing);
        const lastIdx = Math.ceil((scrollX * 0.45 + W + 80) / treeSpacing);
        for (let idx = firstIdx; idx <= lastIdx; idx++) {
            const screenX = idx * treeSpacing - scrollX * 0.45;
            drawTree(screenX, usableH - 4, idx);
        }

        // Передние низкие кустики вдоль горизонта
        const bushStep = 48;
        const bushOffset = ((scrollX * 0.62) % bushStep + bushStep) % bushStep;
        ctx.fillStyle = '#27ae60';
        ctx.beginPath();
        for (let x = -bushStep - bushOffset; x <= W + bushStep * 2; x += bushStep) {
            ctx.arc(x + 14, usableH, 16, Math.PI, 0);
            ctx.arc(x + 34, usableH + 2, 13, Math.PI, 0);
        }
        ctx.fill();
    }

    function drawGround() {
        const y = H - floorHeight;

        // Земля
        const earthGrad = ctx.createLinearGradient(0, y + 16, 0, H);
        earthGrad.addColorStop(0, '#c49652');
        earthGrad.addColorStop(1, '#7a4f23');
        ctx.fillStyle = earthGrad;
        ctx.fillRect(0, y + 16, W, floorHeight - 16);

        // Верхняя полоса травы
        ctx.fillStyle = '#4cd137';
        ctx.fillRect(0, y, W, 16);

        // Диагональные полоски на траве для ощущения движения
        const step = 28;
        const offset = ((scrollX % step) + step) % step;
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, y, W, 16);
        ctx.clip();
        ctx.fillStyle = '#6fe356';
        for (let x = -step - offset; x < W + step; x += step) {
            ctx.beginPath();
            ctx.moveTo(x, y + 16);
            ctx.lineTo(x + 10, y);
            ctx.lineTo(x + 20, y);
            ctx.lineTo(x + 10, y + 16);
            ctx.closePath();
            ctx.fill();
        }
        ctx.restore();

        // Блик и нижняя кромка травы
        ctx.fillStyle = '#9bf78a';
        ctx.fillRect(0, y, W, 2);
        ctx.fillStyle = '#25701b';
        ctx.fillRect(0, y + 15, W, 3);
    }

    function drawPipes() {
        const usableH = H - floorHeight;
        const outline = '#123458';

        const fillPipeGradient = (gx, gw) => {
            const grad = ctx.createLinearGradient(gx, 0, gx + gw, 0);
            grad.addColorStop(0.0, '#2c8ae6');
            grad.addColorStop(0.16, '#6dc3ff');
            grad.addColorStop(0.28, '#a6dcff');
            grad.addColorStop(0.46, '#3ea0ff');
            grad.addColorStop(0.84, '#1e6ec4');
            grad.addColorStop(1.0, '#145096');
            return grad;
        };

        for (const p of pipes) {
            const drawSegment = (x, y, w, h, capAtBottom) => {
                if (h <= 0) return;
                const capH = Math.min(22, h);
                const capX = x - 4;
                const capW = w + 8;
                const capY = capAtBottom ? (y + h - capH) : y;

                // Основной ствол трубы (классический объёмный синий)
                ctx.fillStyle = fillPipeGradient(x, w);
                ctx.fillRect(x, y, w, h);

                // Глянцевый блик слева и лёгкая тень справа
                ctx.fillStyle = 'rgba(255, 255, 255, 0.34)';
                ctx.fillRect(x + 9, y, 5, h);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
                ctx.fillRect(x + 17, y, 2, h);
                ctx.fillStyle = 'rgba(10, 35, 70, 0.16)';
                ctx.fillRect(x + w - 8, y, 6, h);

                // Контур ствола
                ctx.strokeStyle = outline;
                ctx.lineWidth = 2.5;
                ctx.strokeRect(x, y, w, h);

                // Лёгкая тень под/над ободком
                ctx.fillStyle = 'rgba(10, 32, 62, 0.22)';
                if (capAtBottom && h > capH + 4) {
                    ctx.fillRect(x + 1, capY - 4, w - 2, 4);
                } else if (!capAtBottom && h > capH + 4) {
                    ctx.fillRect(x + 1, capY + capH, w - 2, 4);
                }

                // Классический выступающий оголовок трубы
                ctx.fillStyle = fillPipeGradient(capX, capW);
                ctx.fillRect(capX, capY, capW, capH);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.36)';
                ctx.fillRect(capX + 10, capY + 1, 6, capH - 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
                ctx.fillRect(capX + 19, capY + 1, 2, capH - 2);
                ctx.fillStyle = 'rgba(10, 35, 70, 0.18)';
                ctx.fillRect(capX + capW - 9, capY + 1, 7, capH - 2);

                // Верхний/нижний светлый кантик на ободке для объёма
                ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
                ctx.fillRect(capX + 2, capY + 2, capW - 4, 2);

                ctx.strokeStyle = outline;
                ctx.lineWidth = 2.5;
                ctx.strokeRect(capX, capY, capW, capH);
            };

            drawSegment(p.x, 0, p.w, p.gapTop, true);
            drawSegment(p.x, p.gapBottom, p.w, usableH - p.gapBottom, false);
        }
    }

    function drawDuck() {
        ctx.save();
        ctx.translate(duck.x, duck.y);
        ctx.rotate(duck.angle);

        if (duckImgLoaded) {
            const aspect = duckImg.naturalWidth / (duckImg.naturalHeight || 1);
            duck.h = 66;
            duck.w = Math.round(duck.h * aspect);
            ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
            ctx.shadowBlur = 8;
            ctx.drawImage(duckImg, -duck.w / 2, -duck.h / 2, duck.w, duck.h);
        } else {
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(0, 0, 22, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    function drawParticlesAndPopups(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
            const pt = particles[i];
            pt.x += pt.vx * dt;
            pt.y += pt.vy * dt;
            pt.life -= pt.decay * dt;
            if (pt.life <= 0) {
                particles.splice(i, 1);
                continue;
            }
            ctx.save();
            ctx.globalAlpha = Math.max(0, pt.life);
            ctx.fillStyle = pt.color;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        for (let i = floatingPopups.length - 1; i >= 0; i--) {
            const fp = floatingPopups[i];
            fp.y -= 0.9 * dt;
            fp.life -= 0.02 * dt;
            if (fp.life <= 0) {
                floatingPopups.splice(i, 1);
                continue;
            }
            ctx.save();
            ctx.globalAlpha = Math.max(0, fp.life);
            ctx.font = '900 16px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillStyle = fp.color;
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.65)';
            ctx.lineWidth = 3;
            ctx.strokeText(fp.text, fp.x, fp.y);
            ctx.fillText(fp.text, fp.x, fp.y);
            ctx.restore();
        }
    }

    // ================= ГЛАВНЫЙ ЦИКЛ (60 FPS NORMALIZED) =================
    function gameLoop(now) {
        const rawDt = now - lastTime;
        lastTime = now;
        const dt = Math.min(32, Math.max(1, rawDt)) / 16.667;

        const usableH = H - floorHeight;

        if (state === 'idle') {
            scrollX += 1.4 * dt;
            duck.y = Math.round(usableH * 0.46 + Math.sin(now * 0.004) * 7);
            duck.angle = Math.sin(now * 0.004) * 0.05;
        } else if (state === 'flying') {
            const pipeSpeed = 2.65;
            scrollX += pipeSpeed * dt;

            // Физика падения
            duck.vy += 0.34 * dt;
            if (duck.vy > 8.5) duck.vy = 8.5;
            duck.y += duck.vy * dt;

            // Плавный наклон утки
            const targetAngle = Math.max(-0.35, Math.min(0.66, duck.vy * 0.075));
            duck.angle += (targetAngle - duck.angle) * Math.min(1, 0.22 * dt);

            // Мягкий хитбокс (62% от спрайта)
            const hitHalfW = duck.w * 0.31;
            const hitHalfH = duck.h * 0.31;

            // Верх/низ
            if (duck.y - hitHalfH < 0) {
                duck.y = hitHalfH;
                duck.vy = 0;
            }
            if (duck.y + hitHalfH >= usableH) {
                duck.y = usableH - hitHalfH;
                finishFlight(false);
            }

            // Движение и коллизия труб
            for (const p of pipes) {
                p.x -= pipeSpeed * dt;

                if (!p.passed && (p.x + p.w / 2) < duck.x) {
                    p.passed = true;
                    score++;
                    scoreDisplay.textContent = score;
                    if (score > bestScore) {
                        bestScore = score;
                        localStorage.setItem('vetruch_flappy_best', bestScore);
                    }
                    if (score >= MAX_PIPES) {
                        floatingPopups.push({ x: duck.x, y: duck.y - 40, text: '🏆 x10!', color: '#00e676', life: 1.0 });
                        finishFlight(true);
                        break;
                    }
                    if (score % 10 === 0) {
                        floatingPopups.push({ x: duck.x, y: duck.y - 40, text: `✅ x${getMultiplierForScore(score)}!`, color: '#ffd700', life: 1.0 });
                    }
                }

                // Проверка столкновения
                const overlapX = (duck.x + hitHalfW > p.x) && (duck.x - hitHalfW < p.x + p.w);
                if (overlapX) {
                    if ((duck.y - hitHalfH < p.gapTop) || (duck.y + hitHalfH > p.gapBottom)) {
                        finishFlight(false);
                        break;
                    }
                }
            }

            // Убираем ушедшие и доспавниваем новые до 50 труб
            if (pipes.length > 0 && pipes[0].x + pipes[0].w < -20) {
                pipes.shift();
            }
            if (pipes.length > 0 && nextPipeNum <= MAX_PIPES) {
                const lastPipe = pipes[pipes.length - 1];
                if (lastPipe.x < W + 60) {
                    spawnPipe(lastPipe.x + 225, nextPipeNum++);
                }
            }
        }

        for (const c of bgClouds) {
            c.x -= c.speed * dt;
            if (c.x < -110) c.x = W + 70;
        }

        drawBackground();
        drawPipes();
        drawGround();
        drawParticlesAndPopups(dt);
        drawDuck();

        requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
</script>
